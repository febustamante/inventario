<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Gerencia · Agrícola San José</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#fff;color:#212529;display:flex;min-height:100vh}
  h1,h3,.serif{font-family:'Inter',sans-serif}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9aa0a6;margin:26px 0 10px}
  /* SIDEBAR claro */
  .side{width:230px;background:#ECECEC;color:#212529;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;border-right:1px solid #e0e0e0}
  .side .logo{margin:18px 16px 6px;padding:0}
  .side .logo span{font-weight:800;font-size:17px;color:#7B2D2D;font-style:italic}
  .side .empresa{font-size:12.5px;color:#555;margin:0 16px 12px}
  .side .selector{margin:0 14px 14px}
  .side .selector select{width:100%;padding:9px 10px;border:1px solid #d5d5d5;border-radius:8px;font-size:13px;background:#fff;font-weight:600}
  .nav{flex:1;padding:4px 10px;overflow-y:auto}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#3c4043;text-decoration:none;font-size:13.5px;margin-bottom:2px;cursor:pointer;font-weight:500}
  .nav a i{font-size:18px;color:#5f6368}
  .nav a.on{background:#fff;color:#111;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .nav a.on i{color:#2f7d4f}
  .nav a:hover:not(.on){background:rgba(255,255,255,.6)}
  .side .user{padding:12px 16px;border-top:1px solid #ddd;display:flex;gap:10px;align-items:center;font-size:13px}
  .side .user .av{width:32px;height:32px;border-radius:50%;background:#7B2D2D;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  /* MAIN */
  .main{flex:1;padding:22px 30px;min-width:0;background:#fff}
  .tophdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .tophdr h1{font-size:21px;font-weight:800}
  .tophdr .sub{font-size:12.5px;color:#80868b;margin-top:2px}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .btn.green{background:#2f7d4f;color:#fff}
  .btn.line{background:#fff;border:1px solid #dadce0;color:#3c4043}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:14px}
  .panel{background:#fff;border:1px solid #e6e6e6;border-radius:12px;padding:18px}
  .panel h3{font-size:15px;font-weight:700;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:#80868b;font-weight:600;text-align:left;padding:8px 10px;font-size:11.5px;border-bottom:1px solid #eee;text-transform:uppercase}
  td{padding:10px;border-bottom:1px solid #f4f4f4;vertical-align:middle}
  tr:last-child td{border:none}
  /* Pastillas de estado (sólidas, estilo referencia) */
  .tag{font-size:11.5px;padding:3px 12px;border-radius:12px;font-weight:700;white-space:nowrap;color:#fff}
  .tag.creada{background:#2f80ed}
  .tag.iniciada{background:#e0a800}
  .tag.terminada{background:#27ae60}
  .tag.anulada{background:#d64545}
  /* Filtros en cajas etiquetadas */
  .fbox{border:1px solid #dadce0;border-radius:10px;padding:7px 12px;background:#fff;min-width:170px}
  .fbox label{display:block;font-size:11px;color:#80868b;font-weight:600}
  .fbox select{border:none;outline:none;width:100%;font-size:13.5px;background:#fff;font-weight:500;padding:2px 0}
  .filters{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:flex-end}
  .chks{display:flex;gap:16px;align-items:center;font-size:13.5px;margin-bottom:14px;flex-wrap:wrap}
  .chks b{font-weight:700}
  .chks label{display:flex;gap:6px;align-items:center;cursor:pointer;font-weight:500}
  .chks input{width:16px;height:16px;accent-color:#2f80ed}
  /* Lista de órdenes como tarjetas */
  .ord-card{border:1px solid #e6e6e6;border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:box-shadow .12s}
  .ord-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07)}
  .ord-num{display:flex;align-items:center;gap:8px;min-width:92px}
  .ord-num .dot{width:10px;height:10px;border-radius:50%}
  .ord-num b{font-size:15px}
  .ord-mid{flex:1;min-width:0}
  .ord-mid .t{font-size:14px;font-weight:700}
  .ord-mid .s{font-size:12.5px;color:#80868b;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ord-right{text-align:right;display:flex;align-items:center;gap:14px}
  .ord-right .fecha{font-size:13px;color:#2f80ed;font-weight:600}
  .ord-det{border:1px solid #e6e6e6;border-top:none;border-radius:0 0 10px 10px;margin:-11px 0 10px;padding:16px 20px;background:#fafafa}
  .steps{display:flex;gap:3px;align-items:center}
  .step{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
  .step.ok{background:#27ae60;color:#fff}
  .step.no{background:#ececec;color:#a0a0a5}
  .stline{width:16px;height:2px;background:#e0e0e5}
  .famrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
  #login{position:fixed;inset:0;background:#f2f2f2;display:flex;align-items:center;justify-content:center;z-index:99}
  #login .box{background:#fff;border:1px solid #e0e0e0;border-radius:14px;padding:34px;width:320px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
  #login h2{color:#212529;font-size:17px;margin-bottom:4px}
  #login p{font-size:12.5px;color:#80868b;margin-bottom:16px}
  #login input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:20px;text-align:center;letter-spacing:8px;margin-bottom:12px}
  #login button{width:100%}
  .hide{display:none!important}
  .loading{text-align:center;padding:50px;color:#80868b;font-size:14px}
  .err{color:#d64545;font-size:12px;min-height:16px;margin-bottom:8px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-hdr{font-size:11px;color:#80868b;font-weight:700;text-transform:uppercase;text-align:center;padding:4px 0}
  .cal-dia{background:#fff;border:1px solid #e6e6e6;border-radius:10px;min-height:86px;padding:6px}
  .cal-dia.vacio{background:transparent;border:none}
  .cal-dia.hoy{border:2px solid #27ae60}
  .cal-num{font-size:12px;font-weight:700;color:#555;margin-bottom:4px}
  .cal-orden{font-size:10.5px;padding:3px 6px;border-radius:6px;margin-bottom:3px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.banda6{grid-template-columns:repeat(3,1fr)!important}}
  @media(max-width:640px){.banda6{grid-template-columns:repeat(2,1fr)!important}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div style="font-style:italic;font-weight:800;color:#7B2D2D;font-size:20px;margin-bottom:10px">Agrícola San José</div>
    <h2>Panel de Gerencia</h2>
    <p>Ingresa tu PIN para acceder</p>
    <input type="password" id="pin" maxlength="4" inputmode="numeric" placeholder="····" onkeydown="if(event.key==='Enter')entrar()">
    <div class="err" id="pin-err"></div>
    <button class="btn green" onclick="entrar()">Ingresar</button>
  </div>
</div>

<aside class="side hide" id="sidebar">
  <div class="logo"><span>Agrícola San José</span></div>
  <div class="empresa">Panel de gestión</div>
  <div class="selector">
    <select id="fundo-global" onchange="render()">
      <option value="">Todos los fundos</option>
      <option value="CERRILLOS">El Cerrillo</option>
      <option value="RULO">El Rulo</option>
      <option value="PAINE">Paine</option>
    </select>
  </div>
  <nav class="nav">
    <a class="on" data-v="dash" onclick="ver('dash')"><i class="ti ti-layout-dashboard"></i>Dashboard</a>
    <a data-v="ordenes" onclick="ver('ordenes')"><i class="ti ti-clipboard-list"></i>Órdenes</a>
    <a data-v="calendario" onclick="ver('calendario')"><i class="ti ti-calendar"></i>Calendario</a>
    <a data-v="maquinaria" onclick="ver('maquinaria')"><i class="ti ti-tractor"></i>Maquinaria</a>
    <a onclick="cargar()"><i class="ti ti-refresh"></i>Actualizar datos</a>
    <a href="index.html"><i class="ti ti-device-mobile"></i>Ir a la app</a>
  </nav>
  <div class="user"><div class="av" id="u-av">G</div><div><div style="font-weight:700" id="u-nm">Gerencia</div><div style="font-size:11px;color:#80868b">En línea</div></div></div>
</aside>

<main class="main hide" id="main">
  <div class="tophdr">
    <div><h1 id="titulo">Dashboard Gerencial</h1><div class="sub" id="subfecha"></div></div>
    <button class="btn line" onclick="cargar()"><i class="ti ti-refresh"></i> Actualizar</button>
  </div>
  <div id="contenido"><div class="loading">Cargando datos...</div></div>
</main>

<script>
const SUPABASE_URL='https://cmfvnluppvqyqwpfjrbs.supabase.co';
const SUPABASE_KEY='sb_publishable_TvfWNvrb2AitDfwvW5YNww_QsR_gjD1';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ID_UBIC={1:'Bodega Central',2:'Caseta Cerrillos',3:'Rulo',4:'Paine'};
const PINS={'2511':'Felipe','5555':'Gerencia'};
const plata=n=>'$'+Math.round(n).toLocaleString('es-CL');

let products=[],stockByLoc={},movimientos=[],ordenes=[],vista='dash',charts=[];

function entrar(){
  const p=document.getElementById('pin').value.trim();
  if(!PINS[p]){document.getElementById('pin-err').textContent='PIN incorrecto';return;}
  document.getElementById('u-nm').textContent=PINS[p];
  document.getElementById('u-av').textContent=PINS[p][0];
  document.getElementById('login').classList.add('hide');
  document.getElementById('sidebar').classList.remove('hide');
  document.getElementById('main').classList.remove('hide');
  document.getElementById('subfecha').textContent=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  cargar();
}

async function cargar(){
  document.getElementById('contenido').innerHTML='<div class="loading">Cargando datos...</div>';
  try{
    const [{data:prods},{data:stk},{data:movs},{data:ords}]=await Promise.all([
      sb.from('productos').select('*').order('nombre'),
      sb.from('stock').select('*'),
      sb.from('movimientos').select('*').eq('estado','ACTIVO').order('fecha',{ascending:false}),
      sb.from('ordenes').select('*').order('creado_en',{ascending:false})
    ]);
    products=(prods||[]).map(r=>({id:r.id,nombre:String(r.nombre||'').trim(),familia:String(r.familia||'SIN FAMILIA').trim(),minimo:parseFloat(r.minimo_alerta)||5,precio:parseFloat(r.precio_unitario)||0}));
    stockByLoc={};
    products.forEach(p=>stockByLoc[p.id]={'Bodega Central':0,'Caseta Cerrillos':0,'Rulo':0,'Paine':0});
    (stk||[]).forEach(s=>{const l=ID_UBIC[s.ubicacion_id];if(stockByLoc[s.producto_id]&&l)stockByLoc[s.producto_id][l]=parseFloat(s.cantidad)||0;});
    movimientos=(movs||[]).map(m=>{const pr=(prods||[]).find(p=>p.id===m.producto_id);return{tipo:String(m.tipo||'').toLowerCase(),producto:pr?String(pr.nombre).trim():'',cantidad:parseFloat(m.cantidad)||0,origen:ID_UBIC[m.origen_id]||'',destino:ID_UBIC[m.destino_id]||'',usuario:m.usuario||'',ordenNum:m.orden_id||'',obs:m.observaciones||'',fechaRaw:m.fecha,fecha:m.fecha?new Date(m.fecha).toLocaleDateString('es-CL'):''};});
    ordenes=(ords||[]).map(o=>({idOrden:o.id,fecha:o.creado_en?new Date(o.creado_en).toLocaleDateString('es-CL'):'',campo:ID_UBIC[o.campo_id]||'',dosificador:o.dosificador||'',estado:String(o.estado||'EN CURSO').toUpperCase(),detalle:o.detalle||{}}));
    render();
  }catch(e){
    document.getElementById('contenido').innerHTML='<div class="loading" style="color:#a32d2d">Error al cargar: '+(e.message||e)+'</div>';
  }
}

function totalStock(pid){const s=stockByLoc[pid]||{};return Object.values(s).reduce((a,b)=>a+b,0);}

function fundoSel(){return document.getElementById('fundo-global')?.value||'';}
function ordenesF(){const f=fundoSel();return f?ordenes.filter(o=>String(o.detalle?.fundo||'').toUpperCase().includes(f)):ordenes;}
function movsF(){const f=fundoSel();if(!f)return movimientos;const mapa={CERRILLOS:'Caseta Cerrillos',RULO:'Rulo',PAINE:'Paine'};const c=mapa[f];return movimientos.filter(m=>m.origen===c||m.destino===c);}

function ver(v){
  vista=v;
  document.querySelectorAll('.nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  document.getElementById('titulo').textContent=v==='dash'?'Dashboard Gerencial':v==='calendario'?'Calendario de órdenes':v==='maquinaria'?'Control de maquinaria':'Control de órdenes';
  render();
}

function badge(est){
  const m={'EN CURSO':['creada','Creada'],'INICIADA':['iniciada','Iniciada'],'TERMINADA':['terminada','Terminada'],'ANULADA':['anulada','Anulada']};
  const[c,t]=m[est]||['creada',est];return`<span class="tag ${c}">${t}</span>`;
}
function pasos(o){
  const e=o.estado,d=o.detalle||{};
  const p1=true,p2=e==='INICIADA'||e==='TERMINADA',p3=e==='TERMINADA';
  return`<div class="steps" title="Creada${d.inicioReal?' · Iniciada '+d.inicioReal.fecha+' '+d.inicioReal.hora:''}${p3?' · Terminada':''}">
    <div class="step ok">✓</div><div class="stline"></div>
    <div class="step ${p2?'ok':'no'}">${p2?'✓':'·'}</div><div class="stline"></div>
    <div class="step ${p3?'ok':'no'}">${p3?'✓':'·'}</div></div>`;
}
function numOrden(o){const d=o.detalle||{};return(d.tipo==='herbicida'?'H':'F')+'-N°'+(d.numeroOrden||o.idOrden);}

function render(){
  charts.forEach(c=>c.destroy());charts=[];
  const el=document.getElementById('contenido');
  if(vista==='dash')el.innerHTML=renderDash();
  else if(vista==='calendario')el.innerHTML=renderCalendario();
  else if(vista==='maquinaria'){el.innerHTML='<div class="loading">Cargando flota...</div>';renderMaquinaria();}
  else el.innerHTML=renderOrdenes();
  if(vista==='dash')setTimeout(buildCharts,60);
}

// ═══ HELPERS DE ANÁLISIS ═══
function hoyISO(){return new Date().toISOString().slice(0,10);}
function diasEntre(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function sumaDias(fecha,n){const d=new Date(fecha);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function fmtFecha(f){if(!f)return '—';const[a,m,d]=f.split('-');return d+'/'+m;}

function analitica(){
  const ordenes=ordenesF(), movimientos=movsF();
  const term=ordenes.filter(o=>o.estado==='TERMINADA');
  const apls=movimientos.filter(m=>m.tipo==='aplicacion');
  const precio=n=>{const p=products.find(x=>x.nombre===n);return p?p.precio:0;};

  // Costo aplicado por campo y hectáreas por campo → $/ha
  const costoCampo={},haCampo={};
  apls.forEach(m=>{if(m.origen)costoCampo[m.origen]=(costoCampo[m.origen]||0)+m.cantidad*precio(m.producto);});
  term.forEach(o=>{const c=o.detalle?.fundo||o.campo;if(c)haCampo[c]=(haCampo[c]||0)+(o.detalle?.hectareas||0);});
  const costoHa=Object.keys(costoCampo).map(c=>({campo:c,total:costoCampo[c],ha:haCampo[c]||haCampo[Object.keys(haCampo).find(k=>c.includes(k)||k.includes(c))]||0}))
    .map(x=>({...x,porHa:x.ha>0?x.total/x.ha:null}));

  // Desviación teórico vs real
  const desv=[];
  term.forEach(o=>{
    const d=o.detalle||{},ia=d.infoAplicacion;
    if(!ia||!ia.realAplicado)return;
    (d.productos||[]).forEach(p=>{
      if(!p.totalTeorico)return;
      const r=ia.realAplicado.find(x=>x.producto===p.nombre);
      if(!r)return;
      const pct=((r.cantidad-p.totalTeorico)/p.totalTeorico)*100;
      desv.push({orden:numOrden(o),producto:p.nombre,teo:p.totalTeorico,real:r.cantidad,pct});
    });
  });
  desv.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));

  // Carencias activas por cuartel
  const carencias=[];
  term.forEach(o=>{
    const d=o.detalle||{},ia=d.infoAplicacion;
    const fin=(ia&&ia.fechaTermino)||d.inicioReal?.fecha||d.fecha;
    if(!fin||!/^\d{4}-\d{2}-\d{2}$/.test(fin))return;
    const maxCar=Math.max(0,...(d.productos||[]).map(p=>parseInt(p.carencia)||0));
    if(!maxCar)return;
    const hasta=sumaDias(fin,maxCar);
    const rest=diasEntre(hoyISO(),hasta);
    if(rest>=0)carencias.push({orden:numOrden(o),cuarteles:(d.cuartelesFinales||d.cuarteles||[]).map(c=>c.c).join(', '),fundo:d.fundo||o.campo,hasta,rest,dias:maxCar});
  });
  carencias.sort((a,b)=>a.rest-b.rest);

  // Duración de aplicaciones y órdenes estancadas
  const durs=[];
  term.forEach(o=>{
    const d=o.detalle||{},ia=d.infoAplicacion;
    if(d.inicioReal&&ia&&ia.fechaTermino&&ia.horaTermino){
      const t0=new Date(d.inicioReal.fecha+'T'+(d.inicioReal.hora||'00:00'));
      const t1=new Date(ia.fechaTermino+'T'+ia.horaTermino);
      const h=(t1-t0)/3600000;
      if(h>0&&h<72)durs.push({orden:numOrden(o),h});
    }
  });
  const durProm=durs.length?durs.reduce((s,x)=>s+x.h,0)/durs.length:null;
  const estancadas=ordenes.filter(o=>o.estado==='EN CURSO'&&o.detalle?.fecha&&diasEntre(o.detalle.fecha,hoyISO())>=2)
    .map(o=>({orden:numOrden(o),campo:o.detalle?.fundo||o.campo,dias:diasEntre(o.detalle.fecha,hoyISO())}));

  // Proyección de quiebre de stock (consumo últimos 30 días)
  const hace30=new Date(Date.now()-30*86400000);
  const cons30={};
  apls.forEach(m=>{if(m.fechaRaw&&new Date(m.fechaRaw)>=hace30)cons30[m.producto]=(cons30[m.producto]||0)+m.cantidad;});
  const quiebre=Object.keys(cons30).map(n=>{
    const p=products.find(x=>x.nombre===n);if(!p)return null;
    const tot=totalStock(p.id),rate=cons30[n]/30;
    return rate>0?{producto:n,dias:Math.floor(tot/rate),stock:tot}:null;
  }).filter(x=>x&&x.dias<=60).sort((a,b)=>a.dias-b.dias).slice(0,6);

  // Pérdidas por motivo
  const perds=movimientos.filter(m=>m.tipo==='perdida');
  const perdMotivo={};
  perds.forEach(m=>{const mot=(m.obs||'Otro').split('·')[0].trim()||'Otro';perdMotivo[mot]=(perdMotivo[mot]||0)+m.cantidad*precio(m.producto);});

  // Top productos del mes en $
  const mesAct=new Date().getMonth(),anoAct=new Date().getFullYear();
  const topMes={};
  apls.forEach(m=>{if(!m.fechaRaw)return;const d=new Date(m.fechaRaw);if(d.getMonth()===mesAct&&d.getFullYear()===anoAct)topMes[m.producto]=(topMes[m.producto]||0)+m.cantidad*precio(m.producto);});
  const top5=Object.entries(topMes).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const costoMes=Object.values(topMes).reduce((s,v)=>s+v,0);
  return {costoHa,desv:desv.slice(0,8),carencias,durProm,durs,estancadas,quiebre,perdMotivo,top5,costoMes};
}

function semaforo(pct){
  const a=Math.abs(pct);
  if(a<=10)return['#3E7A52','#E8F3EC'];
  if(a<=20)return['#C98A1B','#FBF3E1'];
  return['#B3382F','#F9E9E7'];
}

    </div>

function buildCharts(){
  const fam={};
  products.forEach(p=>{const v=totalStock(p.id)*p.precio;if(v>0)fam[p.familia]=(fam[p.familia]||0)+v;});
  const famTop=Object.entries(fam).sort((a,b)=>b[1]-a[1]);
  const top4=famTop.slice(0,4);const resto=famTop.slice(4).reduce((s,f)=>s+f[1],0);
  if(resto>0)top4.push(['Otros',resto]);
  const colores=['#6E2430','#3E7A52','#C98A1B','#4A6FA5','#B8B2A6'];
  const d1=document.getElementById('dona');
  if(d1)charts.push(new Chart(d1,{type:'doughnut',data:{labels:top4.map(f=>f[0]),datasets:[{data:top4.map(f=>f[1]),backgroundColor:colores,borderWidth:2,borderColor:'#fff'}]},options:{cutout:'66%',plugins:{legend:{display:false}}}}));
  const ley=document.getElementById('dona-leyenda');
  if(ley)ley.innerHTML='<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8B867D;margin-bottom:6px">Valor por familia</div>'+top4.map((f,i)=>`<div style="display:flex;justify-content:space-between;padding:3px 0"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colores[i]};margin-right:6px"></span>${f[0]}</span><b class="num">${plata(f[1])}</b></div>`).join('');

  const meses={};
  movimientos.filter(m=>m.tipo==='aplicacion').forEach(m=>{
    if(!m.fechaRaw)return;
    const d=new Date(m.fechaRaw);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const p=products.find(x=>x.nombre===m.producto);
    meses[k]=(meses[k]||0)+(p?m.cantidad*p.precio:0);
  });
  const mk=Object.keys(meses).sort().slice(-8);
  const nombres={'01':'Ene','02':'Feb','03':'Mar','04':'Abr','05':'May','06':'Jun','07':'Jul','08':'Ago','09':'Sep','10':'Oct','11':'Nov','12':'Dic'};
  const c2=document.getElementById('cons');
  if(c2)charts.push(new Chart(c2,{type:'bar',data:{labels:mk.map(k=>nombres[k.slice(5)]+' '+k.slice(2,4)),datasets:[{data:mk.map(k=>meses[k]),backgroundColor:'#6E2430CC',borderRadius:5,barThickness:22}]},options:{plugins:{legend:{display:false},title:{display:true,text:'Consumo mensual en $',font:{size:11},color:'#8B867D'}},scales:{y:{ticks:{callback:v=>plata(v),font:{size:10}},grid:{color:'#F1EDE5'}},x:{grid:{display:false}}},responsive:true,maintainAspectRatio:false}}));
}

function renderOrdenes(){
  const ordenes=ordenesF();
  const ft=document.getElementById('f-tipo')?.value||'';
  const fca=document.getElementById('f-campo')?.value||'';
  const fcu=document.getElementById('f-cuartel')?.value||'';
  const chk=e=>document.getElementById(e)?document.getElementById(e).checked:true;
  const verCreadas=chk('ch-creadas'),verIni=chk('ch-ini'),verTerm=chk('ch-term'),verAnu=document.getElementById('ch-anu')?document.getElementById('ch-anu').checked:false;

  let lista=ordenes;
  if(ft)lista=lista.filter(o=>(o.detalle?.tipo||'fitosanitario')===ft);
  if(fca)lista=lista.filter(o=>String(o.detalle?.fundo||o.campo||'').toUpperCase()===fca);
  if(fcu)lista=lista.filter(o=>(o.detalle?.cuarteles||[]).some(c=>c.c===fcu));
  lista=lista.filter(o=>
    (o.estado==='EN CURSO'&&verCreadas)||(o.estado==='INICIADA'&&verIni)||
    (o.estado==='TERMINADA'&&verTerm)||(o.estado==='ANULADA'&&verAnu));

  const camposTodos=[...new Set(ordenes.map(o=>String(o.detalle?.fundo||o.campo||'').toUpperCase()).filter(Boolean))].sort();
  const cuartelesTodos=[...new Set(ordenes.flatMap(o=>(o.detalle?.cuarteles||[]).map(c=>c.c)))].sort();
  const dotCol={'EN CURSO':'#2f80ed','INICIADA':'#e0a800','TERMINADA':'#27ae60','ANULADA':'#d64545'};

  return `
  <div class="filters">
    <div class="fbox"><label>Tipo</label>
      <select id="f-tipo" onchange="render()">
        <option value="">todos</option>
        <option ${ft==='fitosanitario'?'selected':''} value="fitosanitario">Fitosanitario</option>
        <option ${ft==='herbicida'?'selected':''} value="herbicida">Herbicida</option>

    <div class="fbox"><label>Campo</label>
      <select id="f-campo" onchange="render()">

      </select></div>
    <div class="fbox"><label>Cuartel</label>
      <select id="f-cuartel" onchange="render()">

        ${cuartelesTodos.map(c=>`<option ${fcu===c?'selected':''}>${c}</option>`).join('')}

  </div>
  <div class="chks">
    <b>Estado</b>
    <label><input type="checkbox" id="ch-creadas" ${verCreadas?'checked':''} onchange="render()">creadas</label>
    <label><input type="checkbox" id="ch-ini" ${verIni?'checked':''} onchange="render()">iniciadas</label>
    <label><input type="checkbox" id="ch-term" ${verTerm?'checked':''} onchange="render()">terminadas</label>
    <label><input type="checkbox" id="ch-anu" ${verAnu?'checked':''} onchange="render()">anuladas</label>
  </div>
  ${lista.length?lista.map((o,i)=>{const d=o.detalle||{};return `
  <div class="ord-card" onclick="toggleDet(${i})">
    <div class="ord-num"><span class="dot" style="background:${dotCol[o.estado]||'#999'}"></span><b class="num">${numOrden(o)}</b></div>
    <div class="ord-mid">
      <div class="t">${d.tipo==='herbicida'?'Herbicida':'Fitosanitario'} · ${d.fundo||o.campo}</div>
      <div class="s">${(d.productos||[]).map(p=>p.nombre).join(', ')||'—'} &nbsp;·&nbsp; ${(d.cuarteles||[]).map(c=>c.c).join(', ')} · ${d.hectareas||'?'} ha · ${o.dosificador||''}</div>
    </div>
    <div class="ord-right">
      ${pasos(o)}
      <span class="fecha num">${fmtFecha(d.fecha||'')||o.fecha}</span>
      ${badge(o.estado)}
      <button class="btn line" style="padding:5px 10px;font-size:11.5px" onclick="event.stopPropagation();generarPDFOrden('${o.idOrden}')"><i class="ti ti-file-type-pdf"></i> PDF</button>
    </div>
  </div>
  <div id="det-${i}" class="ord-det hide">${desglose(o)}</div>`}).join('')
  :'<div style="text-align:center;color:#80868b;padding:40px;border:1px dashed #ddd;border-radius:10px">No hay órdenes con esos filtros</div>'}`;
}

function toggleDet(i){
  const el=document.getElementById('det-'+i);

}

// Desglose completo de una orden
function desglose(o){
  const d=o.detalle||{};
  const ia=d.infoAplicacion||null;
  const kv=(k,v)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #eee;font-size:12.5px"><span style="color:#8a8a8e">${k}</span><b>${v||'—'}</b></div>`;

  // tabla de productos: teórico y real
  const realDe=n=>{if(!ia||!ia.realAplicado)return null;const r=ia.realAplicado.find(x=>x.producto===n);return r?r.cantidad:null;};
  const prodRows=(d.productos||[]).map(p=>{
    const real=realDe(p.nombre);
    return`<tr><td>${p.nombre}</td><td>${p.dosis100||'—'}</td><td>${p.dosisHa||'—'}</td><td>${p.objetivo||'—'}</td><td>${p.totalTeorico!=null?p.totalTeorico:'—'}</td><td style="font-weight:700;color:${real!=null?'#2f7d4f':'#aaa'}">${real!=null?real:'—'}</td></tr>`;
  }).join('');

  return`
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:14px">
    <div>
      <div style="font-size:12px;font-weight:700;color:#7B2D2D;margin-bottom:6px">DATOS GENERALES</div>
      ${kv('Fecha de la orden',d.fecha)}
      ${kv('Fundo',d.fundo||o.campo)}
      ${kv('Cuarteles',(d.cuarteles||[]).map(c=>c.c+' ('+c.ha+' ha)').join(' · '))}
      ${kv('Hectáreas',d.hectareas)}
      ${kv('% Superficie',(d.pct||100)+'%')}
      ${kv('Mojamiento',d.mojamiento)}
      ${kv('Lts/kg máquina',d.ltsMaq)}
      ${kv('Total litros',d.totalLitros)}
      ${kv('Creada por',d.creadaPor||'—')}
      ${d.anuladaPor?kv('⛔ Anulada por',d.anuladaPor+' · '+(d.anuladaEn||'')):''}
      ${d.editadaPor?kv('✏️ Editada por',d.editadaPor+' · '+(d.editadaEn||'')):''}
      ${(d.auditoria&&d.auditoria.length)?`<div style="margin-top:8px;font-size:11px;color:#80868b"><b>Historial:</b><br>${d.auditoria.map(a=>`· ${a.accion} — ${a.usuario} (${a.fecha})`).join('<br>')}</div>`:''}
      ${d.observaciones?`<div style="background:#dc1e1e;color:#fff;font-weight:700;font-size:12px;padding:8px;border-radius:7px;margin-top:8px;text-transform:uppercase">⚠️ ${d.observaciones}</div>`:''}
    </div>
    <div>
      <div style="font-size:12px;font-weight:700;color:#7B2D2D;margin-bottom:6px">EJECUCIÓN</div>
      ${kv('▶️ Inicio real',d.inicioReal?(d.inicioReal.fecha+' a las '+d.inicioReal.hora):'Aún no iniciada')}
      ${kv('Fecha inicio (formulario)',ia?((ia.fechaInicio||'')+' '+(ia.horaInicio||'')).trim():'—')}
      ${kv('Fecha término',ia?((ia.fechaTermino||'')+' '+(ia.horaTermino||'')).trim():'—')}
      ${kv('Lavado de máquina',ia?ia.lavado:'—')}
      ${kv('Elim. excedente',ia?ia.excedente:'—')}
      ${kv('Tiempo',ia&&ia.clima?ia.clima.tiempo:'—')}
      ${kv('Viento',ia&&ia.clima?ia.clima.viento:'—')}
      ${kv('Traje completo',ia&&ia.clima?ia.clima.trajeCompleto:'—')}
      ${ia&&ia.equipos&&ia.equipos.length?`<div style="font-size:12px;margin-top:8px"><b>Equipos:</b> ${ia.equipos.map((e,j)=>`E${j+1}: ${e.tractorista||'—'} / ${e.tractor||'—'} / ${e.pistonero||'—'}`).join(' · ')}</div>`:''}
    </div>
  </div>
  <div style="font-size:12px;font-weight:700;color:#7B2D2D;margin-bottom:6px">PRODUCTOS</div>
  <table style="font-size:12.5px"><thead><tr><th>Producto</th><th>Dosis/100</th><th>Dosis/ha</th><th>Objetivo</th><th>Teórico</th><th>Real aplicado</th></tr></thead>
  <tbody>${prodRows||'<tr><td colspan="6" style="color:#8a8a8e">Sin detalle de productos</td></tr>'}</tbody></table>`;
}

let calMes=new Date().getMonth(), calAno=new Date().getFullYear();
function moverMes(n){
  calMes+=n;
  if(calMes<0){calMes=11;calAno--;}
  if(calMes>11){calMes=0;calAno++;}
  render();
}

// La fecha de la orden: detalle.fecha (aaaa-mm-dd) o creación (dd-mm-aaaa)
function fechaOrden(o){
  const d=o.detalle||{};
  if(d.fecha && /^\d{4}-\d{2}-\d{2}$/.test(d.fecha)) return d.fecha;
  const f=(o.fecha||'').split('-');
  if(f.length===3) return f[2]+'-'+f[1].padStart(2,'0')+'-'+f[0].padStart(2,'0');
  return '';
}

function renderCalendario(){
  const ordenes=ordenesF();
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const primerDia=new Date(calAno,calMes,1);
  const diasMes=new Date(calAno,calMes+1,0).getDate();
  let inicio=primerDia.getDay()-1; if(inicio<0)inicio=6;

  const porDia={};
  ordenes.forEach(o=>{
    const f=fechaOrden(o);
    if(!f)return;
    const[a,m,d]=f.split('-').map(Number);
    if(a===calAno&&m===calMes+1){ (porDia[d]=porDia[d]||[]).push(o); }
  });

  const colEst={'EN CURSO':'#2456a0','INICIADA':'#a87514','TERMINADA':'#2f7d4f','ANULADA':'#a32d2d'};
  const bgEst={'EN CURSO':'#e8f0fb','INICIADA':'#fdf3dc','TERMINADA':'#e8f5ec','ANULADA':'#fbecec'};
  const hoy=new Date();
  const esHoy=d=>hoy.getFullYear()===calAno&&hoy.getMonth()===calMes&&hoy.getDate()===d;

  let celdas='';
  for(let i=0;i<inicio;i++) celdas+='<div class="cal-dia vacio"></div>';
  for(let d=1;d<=diasMes;d++){
    const ords=porDia[d]||[];
    celdas+=`<div class="cal-dia ${esHoy(d)?'hoy':''}">
      <div class="cal-num">${d}</div>
      ${ords.map(o=>{const det=o.detalle||{};return`<div class="cal-orden" style="background:${bgEst[o.estado]||'#eee'};color:${colEst[o.estado]||'#555'}" title="${numOrden(o)} · ${det.fundo||o.campo} · ${o.estado}">
        <b>${numOrden(o)}</b> ${det.fundo||o.campo}
      </div>`}).join('')}
    </div>`;
  }

  return `
  <style>
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .cal-hdr{font-size:11px;color:#8a8a8e;font-weight:700;text-transform:uppercase;text-align:center;padding:4px 0}
    .cal-dia{background:#fff;border:1px solid #ececf0;border-radius:10px;min-height:86px;padding:6px}
    .cal-dia.vacio{background:transparent;border:none}
    .cal-dia.hoy{border:2px solid #2f7d4f}
    .cal-num{font-size:12px;font-weight:700;color:#555;margin-bottom:4px}
    .cal-dia.hoy .cal-num{color:#2f7d4f}
    .cal-orden{font-size:10.5px;padding:3px 6px;border-radius:6px;margin-bottom:3px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  </style>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <button class="btn line" onclick="moverMes(-1)"><i class="ti ti-chevron-left"></i></button>
      <h3 style="margin:0">${meses[calMes]} ${calAno}</h3>
      <button class="btn line" onclick="moverMes(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="cal-grid" style="margin-bottom:4px">
      ${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-hdr">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${celdas}</div>
    <div style="display:flex;gap:14px;margin-top:14px;font-size:12px;color:#666">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#e8f0fb;border:1px solid #2456a0"></span> Creada</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#fdf3dc;border:1px solid #a87514"></span> Iniciada</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#e8f5ec;border:1px solid #2f7d4f"></span> Terminada</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#fbecec;border:1px solid #a32d2d"></span> Anulada</span>
    </div>
  </div>`;
}

function generarPDFOrden(idOrden){
  const o = ordenes.find(x=>String(x.idOrden)===String(idOrden));
  if(!o || !o.detalle){ showToast('Esta orden no tiene datos para PDF','err'); return; }
  const d = o.detalle;
  if(typeof window.jspdf === 'undefined'){
    showToast('La librería de PDF no cargó. Revisa tu conexión y recarga la página.','err');
    return;
  }
  try{
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const W = 210;
  const VINO=[123,45,45], GRIS=[243,234,227], TX=[40,40,40], LBL=[130,130,130];
  const ia = d.infoAplicacion;

  // ── ENCABEZADO con logo ──
  doc.setFillColor(...VINO); doc.rect(0,0,W,22,'F');
  try{ if(typeof LOGO_PDF!=='undefined' && LOGO_PDF) doc.addImage(LOGO_PDF,'JPEG',10,5,42,12); }catch(e){}
  doc.setTextColor(255,255,255);
  doc.setFontSize(8); doc.setFont('helvetica','normal');
  const tipoTxt = (d.tipo==='herbicida') ? 'Aplicación de Herbicidas' : 'Aplicación de Productos Fitosanitarios';
  doc.text(tipoTxt + ' · Temp. 2026-2027', 56, 13);
  // recuadro N° orden
  doc.setDrawColor(255,255,255); doc.setFillColor(150,60,60);
  doc.roundedRect(W-42,5,32,12,2,2,'F');
  doc.setFontSize(6); doc.text('ORDEN N°', W-26, 9, {align:'center'});
  doc.setFontSize(15); doc.setFont('helvetica','bold'); doc.text(String(d.numeroOrden||o.idOrden), W-26, 15, {align:'center'});

  let y = 30;

  // ── DATOS GENERALES en 2 columnas ──
  const kv=(label,val,x,yy)=>{
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...LBL);doc.text(label,x,yy);
    doc.setTextColor(...TX);doc.setFont('helvetica','bold');doc.text(String(val||'—'),x+88,yy,{align:'right'});
    doc.setDrawColor(230,230,230);doc.line(x,yy+1.5,x+88,yy+1.5);
  };
  const L=10, R=112;
  kv('U. de Manejo','SJ-04',L,y); kv('Hectáreas a aplicar',(d.hectareas||0)+' ha',R,y); y+=6;
  kv('Fundo',d.fundo,L,y); kv('% Superficie',(d.pct||100)+'%',R,y); y+=6;
  kv('Especie',d.especie||'Uva de Mesa',L,y); kv('Mojamiento (lts/há)',d.mojamiento,R,y); y+=6;
  kv('Variedad',d.variedad,L,y); kv('Lts o Kg / máquina',d.ltsMaq,R,y); y+=6;
  kv('Cuartel(es)',(d.cuarteles||[]).map(c=>c.c).join(', '),L,y); kv('Total litros a aplic.', (d.totalLitros!=null?d.totalLitros:((d.hectareas||0)*(d.mojamiento||0)).toFixed(2)), R, y); y+=6;
  kv('Fecha',d.fecha,L,y); kv('Equipo a usar',d.equipo,R,y); y+=6;
  kv('Método',d.metodo,R,y); y+=9;

  // ── helper de sección ──
  const seccion=(titulo)=>{
    doc.setFillColor(...GRIS); doc.rect(10,y-4,W-20,6,'F');
    doc.setFillColor(...VINO); doc.rect(10,y-4,1.5,6,'F');
    doc.setTextColor(...VINO); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    doc.text(titulo.toUpperCase(),14,y); y+=5;
  };

  // ── PARA APLICACIÓN ──
  seccion('Para aplicación');
  const cols=['Producto','Dosis/100','Uni.','Dosis/maq','N°maq','Tot.prod','Dosis/ha','Objetivo','Car.','Tóx.'];
  const cx=[10,46,63,74,91,106,123,141,172,186];
  doc.setFillColor(...VINO); doc.setTextColor(255,255,255); doc.rect(10,y,W-20,5,'F'); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
  cols.forEach((c,i)=>doc.text(c,cx[i]+1,y+3.4)); y+=5;
  doc.setTextColor(...TX); doc.setFont('helvetica','normal'); doc.setFontSize(7);
  (d.productos||[]).forEach((p,idx)=>{
    const mojam=d.mojamiento||0, lm=d.ltsMaq||0, has=d.hectareas||0;
    const nMaq=lm?(has*mojam)/lm:0, dMaq=(lm*(p.dosis100||0))/100, tot=nMaq*dMaq;
    if(idx%2) { doc.setFillColor(250,247,245); doc.rect(10,y,W-20,5,'F'); }
    const vals=[p.nombre,(p.dosis100||0),'',dMaq.toFixed(2),nMaq.toFixed(1),tot.toFixed(2),(p.dosisHa||0),p.objetivo||'',p.carencia||''];
    vals.forEach((v,i)=>doc.text(String(v).substring(0,17),cx[i]+1,y+3.4));
    // Tóxico en rojo y negrita
    if(PRODUCTO_TOXICO[p.nombre]){
      doc.setTextColor(220,30,30); doc.setFont('helvetica','bold');
      doc.text('SÍ', cx[9]+1, y+3.4);
      doc.setTextColor(...TX); doc.setFont('helvetica','normal');
    }
    doc.setDrawColor(220,220,220); doc.rect(10,y,W-20,5); y+=5;
  });
  y+=5;

  // ── PARA BODEGA ──
  seccion('Para bodega — Real aplicado por cuartel');
  const cuarts=(d.cuarteles||[]).slice(0,5);
  const bh=['Producto','Real Aplic.',...cuarts.map(c=>c.c),'Total'];
  const bw=(W-20)/bh.length;
  doc.setFillColor(...VINO); doc.setTextColor(255,255,255); doc.rect(10,y,W-20,5,'F'); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
  bh.forEach((c,i)=>doc.text(String(c),10+bw*i+1,y+3.4)); y+=5;
  doc.setTextColor(...TX); doc.setFont('helvetica','normal'); doc.setFontSize(7);
  (d.productos||[]).forEach((p,idx)=>{
    if(idx%2){ doc.setFillColor(250,247,245); doc.rect(10,y,W-20,5,'F'); }
    let ra='';
    if(ia&&ia.realAplicado){ const f=ia.realAplicado.find(x=>x.producto===p.nombre); if(f) ra=f.cantidad; }
    doc.text(String(p.nombre).substring(0,16),11,y+3.4);
    doc.setFont('helvetica','bold'); doc.text(String(ra||'—'),10+bw+1,y+3.4); doc.setFont('helvetica','normal');
    (p.porCuartel||[]).slice(0,5).forEach((pc,j)=>doc.text(pc.val.toFixed(2),10+bw*(j+2)+1,y+3.4));
    doc.setFont('helvetica','bold'); doc.text(String((p.totalTeorico||0).toFixed(2)),10+bw*(bh.length-1)+1,y+3.4); doc.setFont('helvetica','normal');
    doc.setDrawColor(220,220,220); doc.rect(10,y,W-20,5); y+=5;
  });
  y+=5;

  // ── OBSERVACIONES DESTACADAS (aviso grande en rojo) ──
  if(d.observaciones){
    const obsTxt = String(d.observaciones).toUpperCase();
    doc.setFillColor(220,30,30);
    const lineas = doc.splitTextToSize(obsTxt, W-30);
    const altura = 6 + lineas.length*6;
    doc.rect(10,y,W-20,altura,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    lineas.forEach((ln,i)=>doc.text(ln, W/2, y+7+i*6, {align:'center'}));
    doc.setTextColor(...TX); doc.setFont('helvetica','normal');
    y += altura + 5;
  }

  // ── INFORMACIÓN DE LA APLICACIÓN ──
  seccion('Información de la aplicación');
  doc.setFontSize(8);
  const dato=(label,val,x,yy)=>{ doc.setTextColor(...LBL);doc.setFont('helvetica','normal');doc.text(label,x,yy);doc.setTextColor(...TX);doc.setFont('helvetica','bold');doc.text(String(val||'________'),x+44,yy);};
  const fi = ia ? ((ia.fechaInicio||'')+' '+(ia.horaInicio||'')).trim() : '';
  const ft = ia ? ((ia.fechaTermino||'')+' '+(ia.horaTermino||'')).trim() : '';
  dato('Inicio:',fi,L,y); dato('Término:',ft,R,y); y+=6;
  dato('Lavado máquina:',ia?ia.lavado:'',L,y); dato('Elim. excedente:',ia?ia.excedente:'',R,y); y+=6;
  dato('Tiempo:',ia&&ia.clima?ia.clima.tiempo:'',L,y); dato('Viento:',ia&&ia.clima?ia.clima.viento:'',R,y); y+=6;
  dato('Traje completo:',ia&&ia.clima?(ia.clima.trajeCompleto?'SÍ':'NO'):'',L,y); y+=8;

  // Tabla equipos
  doc.setFillColor(...VINO); doc.setTextColor(255,255,255); doc.rect(10,y,W-20,5,'F'); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
  ['Equipo','Tractorista','Tractor','Pistonero','Implemento'].forEach((c,i)=>doc.text(c,10+((W-20)/5)*i+1,y+3.4)); y+=5;
  doc.setTextColor(...TX); doc.setFont('helvetica','normal'); doc.setFontSize(7);
  // Hasta 5 equipos: los que llenó el aplicador, y el resto en blanco para lápiz
  const eqsBase = (ia&&ia.equipos)||[];
  const eqs = [];
  for(let i=0;i<5;i++) eqs.push(eqsBase[i]||{});
  eqs.forEach((e,idx)=>{
    const ew=(W-20)/5;
    doc.text(String(idx+1),10+1,y+3.4);
    if(e.tractorista) doc.text(String(e.tractorista).substring(0,18),10+ew+1,y+3.4);
    if(e.tractor) doc.text(String(e.tractor).substring(0,12),10+ew*2+1,y+3.4);
    if(e.pistonero) doc.text(String(e.pistonero).substring(0,18),10+ew*3+1,y+3.4);
    if(e.implemento) doc.text(String(e.implemento).substring(0,12),10+ew*4+1,y+3.4);
    doc.setDrawColor(220,220,220); doc.rect(10,y,W-20,6); y+=6;
  });
  y+=6;

  // ── CARENCIAS (en blanco) ──
  seccion('Fechas de carencia y reingreso');
  dato('Estimada cosecha:','',L,y); dato('Reingreso (hrs):','',R,y); y+=6;
  dato('Mínima cosecha:','',L,y); dato('Reingreso embaraz.:','',R,y); y+=12;

  // ── FIRMAS ──
  const fx=[35,105,175];
  fx.forEach(x=>{ doc.setDrawColor(80,80,80); doc.line(x-25,y,x+25,y); });
  y+=4; doc.setFontSize(7); doc.setTextColor(...LBL);
  doc.text('Responsable (Asesor)',fx[0],y,{align:'center'});
  doc.text('Responsable Aplicación',fx[1],y,{align:'center'});
  doc.text('Dosificador',fx[2],y,{align:'center'});

  // ── PÁGINA 2: CONSUMO REAL POR CUARTEL (solo si la orden está completada) ──
  if(ia && ia.realAplicado && ia.realAplicado.length){
    doc.addPage();
    let y2 = 14;
    doc.setFillColor(...VINO); doc.rect(0,0,W,16,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(11); doc.setFont('helvetica','bold');
    doc.text('CONSUMO REAL POR CUARTEL — Orden N°'+(d.numeroOrden||o.idOrden), W/2, 10, {align:'center'});
    y2 = 24;
    doc.setTextColor(...TX); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Reparto del consumo real de cada producto entre los cuarteles, proporcional a sus hectáreas.', 10, y2); y2+=7;

    const cuartsF = (d.cuartelesFinales||d.cuarteles||[]);
    const totHa = cuartsF.reduce((s,c)=>s+(c.ha||0),0) || 1;
    const bh2=['Producto','Real Total',...cuartsF.map(c=>c.c)];
    const bw2=(W-20)/bh2.length;
    doc.setFillColor(...VINO); doc.setTextColor(255,255,255); doc.rect(10,y2,W-20,6,'F'); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    bh2.forEach((c,i)=>doc.text(String(c),10+bw2*i+1,y2+4)); 
    // fila de hectáreas bajo el encabezado
    y2+=6;
    doc.setTextColor(...LBL); doc.setFontSize(6);
    doc.text('(hectáreas)',10+bw2+1,y2+3);
    cuartsF.forEach((c,i)=>doc.text((c.ha||0)+' ha',10+bw2*(i+2)+1,y2+3));
    doc.setDrawColor(220,220,220); doc.rect(10,y2,W-20,4.5); y2+=4.5;
    doc.setTextColor(...TX); doc.setFontSize(7); doc.setFont('helvetica','normal');
    ia.realAplicado.forEach((ra,idx)=>{
      if(idx%2){ doc.setFillColor(250,247,245); doc.rect(10,y2,W-20,5.5,'F'); }
      doc.text(String(ra.producto).substring(0,18),11,y2+3.8);
      doc.setFont('helvetica','bold'); doc.text(String(ra.cantidad),10+bw2+1,y2+3.8); doc.setFont('helvetica','normal');
      cuartsF.forEach((c,i)=>{
        const val = ra.cantidad*(c.ha||0)/totHa;
        doc.text(val.toFixed(2),10+bw2*(i+2)+1,y2+3.8);
      });
      doc.setDrawColor(220,220,220); doc.rect(10,y2,W-20,5.5); y2+=5.5;
    });
    y2+=6;
    doc.setFontSize(7); doc.setTextColor(...LBL);
    doc.text('Generado por el sistema de inventario · Agrícola San José', 10, y2);
  }

  doc.save('Orden_'+(d.numeroOrden||o.idOrden)+'_'+(d.fundo||'')+'.pdf');
  showToast('PDF generado');
  }catch(e){
    console.error(e);
    showToast('Error al generar PDF: '+(e.message||'desconocido'),'err');
  }
}

// ══ MAQUINARIA (lee maquinarias.xlsx del repositorio) ══
let maqData=null;
async function renderMaquinaria(){
  const el=document.getElementById('contenido');
  if(!maqData){
    try{
      const r=await fetch('maquinarias.xlsx');
      if(!r.ok)throw new Error('no encontrado');
      const buf=await r.arrayBuffer();
      maqData=parseMaq(XLSX.read(buf,{type:'array',cellDates:true}));
    }catch(e){
      el.innerHTML=`<div class="panel" style="text-align:center;padding:40px">
        <div style="font-size:15px;font-weight:700;margin-bottom:8px">Archivo de flota no encontrado</div>
        <div style="font-size:13px;color:#80868b;margin-bottom:16px">Sube tu Excel <b>maquinarias.xlsx</b> al repositorio de GitHub (junto a gerencia.html),<br>o cárgalo aquí para verlo ahora:</div>
        <input type="file" accept=".xlsx" onchange="cargarMaqLocal(this)" style="font-size:13px">
      </div>`;
      return;
    }
  }
  el.innerHTML=vistaMaq(maqData);
}
function cargarMaqLocal(inp){
  const f=inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{maqData=parseMaq(XLSX.read(e.target.result,{type:'array',cellDates:true}));document.getElementById('contenido').innerHTML=vistaMaq(maqData);};
  rd.readAsArrayBuffer(f);
}
function parseMaq(wb){
  const ws=wb.Sheets['CONTROL FLOTA'];
  const V=addr=>{if(!ws)return null;const c=ws[addr];return c?c.v:null;};
  const cols=['A','C','E','G','I','K','M','O','Q','S'];
  const estado=cols.map(c=>({lbl:V(c+'4'),val:V(c+'5'),sub:V(c+'6')})).filter(k=>k.lbl!=null);
  const cols2=['A','E','I','M','Q'];
  const costos=cols2.map(c=>({lbl:V(c+'8'),val:V(c+'9'),sub:V(c+'10')})).filter(k=>k.lbl!=null);
  const fecha=V('R2');
  // Hoja DATOS: detalle por máquina
  const datos=wb.Sheets['DATOS']?XLSX.utils.sheet_to_json(wb.Sheets['DATOS'],{defval:null}).filter(r=>r['MAQUINARIA']):[];
  return {estado,costos,fecha,datos};
}
function vistaMaq(D){
  if(!D) return '<div class="panel" style="text-align:center;padding:30px;color:#80868b">El archivo no tiene la hoja CONTROL FLOTA</div>';
  const fF=d=>{if(!d)return'';const x=d instanceof Date?d:new Date(d);return isNaN(x)?'':' · datos al '+x.toLocaleDateString('es-CL');};
  const M=D.datos||[];
  const num=v=>(+v||0);
  const est=e=>String(e||'').toUpperCase();

  // Alertas accionables
  const alertasList=M.filter(r=>{const a=est(r['ALERTAS']),e=est(r['ESTADO DE RT']),g=est(r['ESTADO GASES']);
    return (a&&a!=='OK')||e.includes('VENCID')||g.includes('VENCID')||est(r['ESTADO']).includes('MANTENCIÓN')||est(r['ESTADO']).includes('FUERA');});
  // Rankings
  const porCostoTotal=[...M].sort((a,b)=>num(b['COSTO TOTAL'])-num(a['COSTO TOTAL'])).slice(0,6);
  const porCostoKm=[...M].filter(r=>num(r['COSTO X KM'])>0).sort((a,b)=>num(b['COSTO X KM'])-num(a['COSTO X KM'])).slice(0,6);
  // Por ubicación
  const ubic={}; M.forEach(r=>{const u=r['UBICACIÓN']||'Sin ubic.';if(!ubic[u])ubic[u]={n:0,costo:0};ubic[u].n++;ubic[u].costo+=num(r['COSTO TOTAL']);});
  // Por responsable
  const resp={}; M.forEach(r=>{const p=r['RESPONSABLE']||'—';if(!resp[p])resp[p]={n:0,costo:0};resp[p].n++;resp[p].costo+=num(r['COSTO TOTAL']);});
  const respArr=Object.entries(resp).sort((a,b)=>b[1].costo-a[1].costo).slice(0,8);

  const colorEstado=k=>{const l=String(k.lbl).toUpperCase();if(l.includes('OPERATIVAS'))return'#27ae60';if(l.includes('VENCID'))return k.val>0?'#d64545':'#27ae60';if(l.includes('PRÓX'))return k.val>0?'#e0a800':'#27ae60';if(l.includes('MANTENCIÓN')||l.includes('FUERA'))return k.val>0?'#e0a800':'#212529';return'#212529';};
  const fmtCosto=k=>{const l=String(k.lbl).toUpperCase();if(l.includes('KM TOTALES'))return Math.round(k.val).toLocaleString('es-CL')+' km';if(l.includes('POR KM'))return plata(k.val)+'/km';return plata(k.val);};
  const tagEstado=e=>{const l=est(e);const col=l.includes('OPERATIVA')?'#27ae60':l.includes('MANTENCIÓN')?'#e0a800':l.includes('FUERA')?'#d64545':l.includes('ARRIENDO')?'#2f80ed':'#80868b';return`<span class="tag" style="background:${col}">${e||'—'}</span>`;};
  const semRT=(e)=>{const l=est(e);if(l.includes('VENCID'))return'#d64545';if(l.includes('PRÓX'))return'#e0a800';if(l.includes('VIGENTE')||l.includes('OK'))return'#27ae60';return'#80868b';};

  return `
  <div style="font-size:12.5px;color:#80868b;margin-bottom:12px">Control de flota${fF(D.fecha)}</div>

  <div class="eyebrow">Estado de la flota</div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:8px">
    ${D.estado.map(k=>`<div class="panel" style="padding:14px"><div style="font-size:10.5px;color:#80868b;font-weight:700;text-transform:uppercase">${k.lbl}</div><div class="num" style="font-size:26px;font-weight:800;color:${colorEstado(k)};margin-top:2px">${k.val!=null?k.val:'—'}</div><div style="font-size:11px;color:#80868b">${k.sub||''}</div></div>`).join('')}
  </div>

  <div class="eyebrow">Costos</div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">
    ${D.costos.map(k=>`<div class="panel" style="padding:14px"><div style="font-size:10.5px;color:#80868b;font-weight:700;text-transform:uppercase">${k.lbl}</div><div class="num" style="font-size:21px;font-weight:800;margin-top:2px">${k.val!=null?fmtCosto(k):'—'}</div><div style="font-size:11px;color:#80868b">${k.sub||''}</div></div>`).join('')}
  </div>

  ${alertasList.length?`<div class="eyebrow">Requieren atención</div>
  <div class="panel" style="border-left:3px solid #d64545">
    <table><thead><tr><th>Máquina</th><th>Estado</th><th>Rev. técnica</th><th>Gases</th><th>Ubicación</th><th>Responsable</th></tr></thead><tbody>
    ${alertasList.map(r=>`<tr><td><b>${r['MAQUINARIA']}</b> <span style="color:#80868b;font-size:11px">${r['PATENTE']||''}</span></td><td>${tagEstado(r['ESTADO'])}</td><td><span style="color:${semRT(r['ESTADO DE RT'])};font-weight:700;font-size:12px">${r['ESTADO DE RT']||'—'}</span></td><td><span style="color:${semRT(r['ESTADO GASES'])};font-weight:700;font-size:12px">${r['ESTADO GASES']||'—'}</span></td><td style="font-size:12px">${r['UBICACIÓN']||''}</td><td style="font-size:12px">${r['RESPONSABLE']||''}</td></tr>`).join('')}
    </tbody></table>
  </div>`:''}

  <div class="eyebrow">Máquinas más costosas</div>
  <div class="grid2">
    <div class="panel"><h3>Top por costo total (año)</h3>
      ${(()=>{const max=porCostoTotal.length?num(porCostoTotal[0]['COSTO TOTAL']):1;return porCostoTotal.map(r=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span style="font-weight:600">${r['MAQUINARIA']} · ${r['RESPONSABLE']||''}</span><span class="num" style="font-weight:700">${plata(num(r['COSTO TOTAL']))}</span></div><div style="height:7px;background:#f0f0f0;border-radius:4px"><div style="height:100%;width:${(num(r['COSTO TOTAL'])/max*100).toFixed(0)}%;background:#7B2D2D;border-radius:4px"></div></div></div>`).join('');})()}
    </div>
    <div class="panel"><h3>Top por costo/km (eficiencia)</h3>
      <table><thead><tr><th>Máquina</th><th class="num">Costo/km</th><th class="num">Costo total</th></tr></thead><tbody>
      ${porCostoKm.map(r=>`<tr><td><b>${r['MAQUINARIA']}</b></td><td class="num" style="color:#d64545;font-weight:700">${plata(num(r['COSTO X KM']))}</td><td class="num">${plata(num(r['COSTO TOTAL']))}</td></tr>`).join('')}
      </tbody></table>
    </div>
  </div>

  <div class="eyebrow">Distribución</div>
  <div class="grid2">
    <div class="panel"><h3>Por campo</h3>
      ${Object.entries(ubic).sort((a,b)=>b[1].costo-a[1].costo).map(([u,d])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #eee;font-size:13px"><span><b>${u}</b> <span style="color:#80868b;font-size:11px">${d.n} máq.</span></span><b class="num">${plata(d.costo)}</b></div>`).join('')}
    </div>
    <div class="panel"><h3>Costo por responsable</h3>
      ${respArr.map(([p,d])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #eee;font-size:13px"><span>${p} <span style="color:#80868b;font-size:11px">${d.n} máq.</span></span><b class="num">${plata(d.costo)}</b></div>`).join('')}
    </div>
  </div>

  <div class="eyebrow">Detalle por máquina</div>
  <div class="panel">
    <table><thead><tr><th>Máquina</th><th>Tipo</th><th>Marca/Modelo</th><th>Estado</th><th>RT</th><th>Gases</th><th>Ubicación</th><th class="num">Costo total</th><th class="num">$/km</th></tr></thead><tbody>
    ${M.map(r=>`<tr><td><b>${r['MAQUINARIA']}</b></td><td style="font-size:12px">${r['TIPO VEHICULO']||''}</td><td style="font-size:12px">${(r['MARCA']||'')+' '+(r['MODELO']||'')}</td><td>${tagEstado(r['ESTADO'])}</td><td><span style="color:${semRT(r['ESTADO DE RT'])};font-size:11.5px;font-weight:600">${r['ESTADO DE RT']||'—'}</span></td><td><span style="color:${semRT(r['ESTADO GASES'])};font-size:11.5px;font-weight:600">${r['ESTADO GASES']||'—'}</span></td><td style="font-size:12px">${r['UBICACIÓN']||''}</td><td class="num">${plata(num(r['COSTO TOTAL']))}</td><td class="num">${num(r['COSTO X KM'])>0?plata(num(r['COSTO X KM'])):'—'}</td></tr>`).join('')}
    </tbody></table>
  </div>
  <div style="font-size:12px;color:#80868b;margin-top:14px">Fuente: maquinarias.xlsx (hojas CONTROL FLOTA y DATOS) · para actualizar, reemplaza el archivo en GitHub</div>`;
}
