<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Gerencia · Agrícola San José</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;background:#f6f7f9;color:#1d1d1f;display:flex;min-height:100vh}
  .side{width:225px;background:#7B2D2D;color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
  .side .logo{background:#fff;margin:16px;padding:10px;border-radius:10px;text-align:center}
  .side .logo span{color:#7B2D2D;font-weight:800;font-size:14px;font-style:italic}
  .nav{flex:1;padding:6px 12px}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:9px;color:rgba(255,255,255,.75);text-decoration:none;font-size:13.5px;margin-bottom:2px;cursor:pointer}
  .nav a i{font-size:19px}
  .nav a.on{background:#2f7d4f;color:#fff;font-weight:600}
  .nav a:hover:not(.on){background:rgba(255,255,255,.08);color:#fff}
  .side .user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.15);display:flex;gap:10px;align-items:center}
  .side .user .av{width:34px;height:34px;border-radius:50%;background:#fff;color:#7B2D2D;display:flex;align-items:center;justify-content:center;font-weight:700}
  .main{flex:1;padding:22px 28px;min-width:0}
  .tophdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .tophdr h1{font-size:21px;font-weight:700}
  .tophdr .sub{font-size:12.5px;color:#8a8a8e;margin-top:2px}
  .btn{border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .btn.green{background:#2f7d4f;color:#fff}
  .btn.line{background:#fff;border:1px solid #e0e0e5;color:#444}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid #ececf0;border-radius:14px;padding:16px}
  .kpi .top{display:flex;gap:12px;align-items:center}
  .kpi .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .kpi .lbl{font-size:12.5px;color:#7a7a80}
  .kpi .val{font-size:22px;font-weight:800}
  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:16px}
  .panel{background:#fff;border:1px solid #ececf0;border-radius:14px;padding:18px}
  .panel h3{font-size:15px;font-weight:700;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:#8a8a8e;font-weight:600;text-align:left;padding:8px 10px;font-size:11.5px;border-bottom:1px solid #ececf0;text-transform:uppercase}
  td{padding:10px;border-bottom:1px solid #f4f4f7;vertical-align:middle}
  tr:last-child td{border:none}
  .tag{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap}
  .tag.creada{background:#e8f0fb;color:#2456a0}
  .tag.iniciada{background:#fdf3dc;color:#a87514}
  .tag.terminada{background:#e8f5ec;color:#2f7d4f}
  .tag.anulada{background:#fbecec;color:#a32d2d}
  .famrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
  .famrow .dotc{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
  .famrow .m{font-weight:700}
  .steps{display:flex;gap:3px;align-items:center}
  .step{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
  .step.ok{background:#2f7d4f;color:#fff}
  .step.no{background:#eceef1;color:#a0a0a5}
  .stline{width:16px;height:2px;background:#e0e0e5}
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filters select{padding:8px 12px;border:1px solid #e0e0e5;border-radius:8px;font-size:13px;background:#fff}
  #login{position:fixed;inset:0;background:#7B2D2D;display:flex;align-items:center;justify-content:center;z-index:99}
  #login .box{background:#fff;border-radius:16px;padding:34px;width:320px;text-align:center}
  #login h2{color:#7B2D2D;font-size:17px;margin-bottom:4px}
  #login p{font-size:12.5px;color:#8a8a8e;margin-bottom:16px}
  #login input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:20px;text-align:center;letter-spacing:8px;margin-bottom:12px}
  #login button{width:100%}
  .hide{display:none!important}
  .loading{text-align:center;padding:50px;color:#8a8a8e;font-size:14px}
  .err{color:#a32d2d;font-size:12px;min-height:16px;margin-bottom:8px}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div style="font-style:italic;font-weight:800;color:#7B2D2D;font-size:20px;margin-bottom:10px">Agrícola San José</div>
    <h2>Panel de Gerencia</h2>
    <p>Ingresa tu PIN para acceder</p>
    <input type="password" id="pin" maxlength="4" inputmode="numeric" placeholder="····" onkeydown="if(event.key==='Enter')entrar()">
    <div class="err" id="pin-err"></div>
    <button class="btn green" onclick="entrar()">Ingresar</button>
  </div>
</div>

<aside class="side hide" id="sidebar">
  <div class="logo"><span>Agrícola San José</span></div>
  <nav class="nav">
    <a class="on" data-v="dash" onclick="ver('dash')"><i class="ti ti-layout-dashboard"></i>Dashboard</a>
    <a data-v="ordenes" onclick="ver('ordenes')"><i class="ti ti-clipboard-list"></i>Control de órdenes</a>
    <a onclick="cargar()"><i class="ti ti-refresh"></i>Actualizar datos</a>
    <a href="index.html"><i class="ti ti-device-mobile"></i>Ir a la app</a>
  </nav>
  <div class="user"><div class="av" id="u-av">G</div><div><div style="font-size:13px;font-weight:600" id="u-nm">Gerencia</div><div style="font-size:11px;opacity:.7">Panel escritorio</div></div></div>
</aside>

<main class="main hide" id="main">
  <div class="tophdr">
    <div><h1 id="titulo">Dashboard Gerencial</h1><div class="sub" id="subfecha"></div></div>
    <button class="btn line" onclick="cargar()"><i class="ti ti-refresh"></i> Actualizar</button>
  </div>
  <div id="contenido"><div class="loading">Cargando datos...</div></div>
</main>

<script>
const SUPABASE_URL='https://cmfvnluppvqyqwpfjrbs.supabase.co';
const SUPABASE_KEY='sb_publishable_TvfWNvrb2AitDfwvW5YNww_QsR_gjD1';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ID_UBIC={1:'Bodega Central',2:'Caseta Cerrillos',3:'Rulo',4:'Paine'};
const PINS={'2511':'Felipe','5555':'Gerencia'};
const plata=n=>'$'+Math.round(n).toLocaleString('es-CL');

let products=[],stockByLoc={},movimientos=[],ordenes=[],vista='dash',charts=[];

function entrar(){
  const p=document.getElementById('pin').value.trim();
  if(!PINS[p]){document.getElementById('pin-err').textContent='PIN incorrecto';return;}
  document.getElementById('u-nm').textContent=PINS[p];
  document.getElementById('u-av').textContent=PINS[p][0];
  document.getElementById('login').classList.add('hide');
  document.getElementById('sidebar').classList.remove('hide');
  document.getElementById('main').classList.remove('hide');
  document.getElementById('subfecha').textContent=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  cargar();
}

async function cargar(){
  document.getElementById('contenido').innerHTML='<div class="loading">Cargando datos...</div>';
  try{
    const [{data:prods},{data:stk},{data:movs},{data:ords}]=await Promise.all([
      sb.from('productos').select('*').order('nombre'),
      sb.from('stock').select('*'),
      sb.from('movimientos').select('*').eq('estado','ACTIVO').order('fecha',{ascending:false}),
      sb.from('ordenes').select('*').order('creado_en',{ascending:false})
    ]);
    products=(prods||[]).map(r=>({id:r.id,nombre:String(r.nombre||'').trim(),familia:String(r.familia||'SIN FAMILIA').trim(),minimo:parseFloat(r.minimo_alerta)||5,precio:parseFloat(r.precio_unitario)||0}));
    stockByLoc={};
    products.forEach(p=>stockByLoc[p.id]={'Bodega Central':0,'Caseta Cerrillos':0,'Rulo':0,'Paine':0});
    (stk||[]).forEach(s=>{const l=ID_UBIC[s.ubicacion_id];if(stockByLoc[s.producto_id]&&l)stockByLoc[s.producto_id][l]=parseFloat(s.cantidad)||0;});
    movimientos=(movs||[]).map(m=>{const pr=(prods||[]).find(p=>p.id===m.producto_id);return{tipo:String(m.tipo||'').toLowerCase(),producto:pr?String(pr.nombre).trim():'',cantidad:parseFloat(m.cantidad)||0,origen:ID_UBIC[m.origen_id]||'',destino:ID_UBIC[m.destino_id]||'',usuario:m.usuario||'',ordenNum:m.orden_id||'',obs:m.observaciones||'',fechaRaw:m.fecha,fecha:m.fecha?new Date(m.fecha).toLocaleDateString('es-CL'):''};});
    ordenes=(ords||[]).map(o=>({idOrden:o.id,fecha:o.creado_en?new Date(o.creado_en).toLocaleDateString('es-CL'):'',campo:ID_UBIC[o.campo_id]||'',dosificador:o.dosificador||'',estado:String(o.estado||'EN CURSO').toUpperCase(),detalle:o.detalle||{}}));
    render();
  }catch(e){
    document.getElementById('contenido').innerHTML='<div class="loading" style="color:#a32d2d">Error al cargar: '+(e.message||e)+'</div>';
  }
}

function totalStock(pid){const s=stockByLoc[pid]||{};return Object.values(s).reduce((a,b)=>a+b,0);}

function ver(v){
  vista=v;
  document.querySelectorAll('.nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  document.getElementById('titulo').textContent=v==='dash'?'Dashboard Gerencial':'Control de órdenes';
  render();
}

function badge(est){
  const m={'EN CURSO':['creada','Creada'],'INICIADA':['iniciada','▶ Iniciada'],'TERMINADA':['terminada','✓ Terminada'],'ANULADA':['anulada','Anulada']};
  const[c,t]=m[est]||['creada',est];return`<span class="tag ${c}">${t}</span>`;
}
function pasos(o){
  const e=o.estado,d=o.detalle||{};
  const p1=true,p2=e==='INICIADA'||e==='TERMINADA',p3=e==='TERMINADA';
  return`<div class="steps" title="Creada${d.inicioReal?' · Iniciada '+d.inicioReal.fecha+' '+d.inicioReal.hora:''}${p3?' · Terminada':''}">
    <div class="step ok">✓</div><div class="stline"></div>
    <div class="step ${p2?'ok':'no'}">${p2?'✓':'·'}</div><div class="stline"></div>
    <div class="step ${p3?'ok':'no'}">${p3?'✓':'·'}</div></div>`;
}
function numOrden(o){const d=o.detalle||{};return(d.tipo==='herbicida'?'H':'F')+'-N°'+(d.numeroOrden||o.idOrden);}

function render(){
  charts.forEach(c=>c.destroy());charts=[];
  const el=document.getElementById('contenido');
  if(vista==='dash')el.innerHTML=renderDash();else el.innerHTML=renderOrdenes();
  if(vista==='dash')setTimeout(buildCharts,60);
}

function renderDash(){
  const creadas=ordenes.filter(o=>o.estado==='EN CURSO').length;
  const iniciadas=ordenes.filter(o=>o.estado==='INICIADA').length;
  const terminadas=ordenes.filter(o=>o.estado==='TERMINADA').length;
  const valorInv=products.reduce((s,p)=>s+totalStock(p.id)*p.precio,0);
  const bajo=products.filter(p=>{const t=totalStock(p.id);return t>0&&t<=p.minimo}).length;
  const agotados=products.filter(p=>totalStock(p.id)<=0).length;
  const perds=movimientos.filter(m=>m.tipo==='perdida');
  const valorPerd=perds.reduce((s,m)=>{const p=products.find(x=>x.nombre===m.producto);return s+(p?m.cantidad*p.precio:0)},0);

  // valor por familia
  const fam={};
  products.forEach(p=>{const v=totalStock(p.id)*p.precio;if(v>0)fam[p.familia]=(fam[p.familia]||0)+v;});
  const famTop=Object.entries(fam).sort((a,b)=>b[1]-a[1]);
  const top4=famTop.slice(0,4);const resto=famTop.slice(4).reduce((s,f)=>s+f[1],0);
  if(resto>0)top4.push(['Otros',resto]);
  const colores=['#2f7d4f','#2456a0','#e6a817','#7B2D2D','#9aa2ad'];

  const activas=[...ordenes.filter(o=>['EN CURSO','INICIADA'].includes(o.estado)),...ordenes.filter(o=>o.estado==='TERMINADA').slice(0,3)];

  return `
  <div class="kpis">
    <div class="kpi"><div class="top"><div class="ic" style="background:#e8f0fb;color:#2456a0"><i class="ti ti-file-plus"></i></div><div><div class="lbl">Órdenes creadas</div><div class="val">${creadas}</div></div></div></div>
    <div class="kpi"><div class="top"><div class="ic" style="background:#fdf3dc;color:#a87514"><i class="ti ti-player-play"></i></div><div><div class="lbl">Iniciadas</div><div class="val">${iniciadas}</div></div></div></div>
    <div class="kpi"><div class="top"><div class="ic" style="background:#e8f5ec;color:#2f7d4f"><i class="ti ti-circle-check"></i></div><div><div class="lbl">Terminadas</div><div class="val">${terminadas}</div></div></div></div>
    <div class="kpi"><div class="top"><div class="ic" style="background:#fbecec;color:#a32d2d"><i class="ti ti-currency-dollar"></i></div><div><div class="lbl">Valor inventario</div><div class="val">${plata(valorInv)}</div></div></div></div>
  </div>
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="top"><div class="ic" style="background:#fdf3dc;color:#a87514"><i class="ti ti-alert-triangle"></i></div><div><div class="lbl">Bajo stock / Agotados</div><div class="val">${bajo} / ${agotados}</div></div></div></div>
    <div class="kpi"><div class="top"><div class="ic" style="background:#fbecec;color:#a32d2d"><i class="ti ti-droplet-off"></i></div><div><div class="lbl">Pérdidas (${perds.length} reg.)</div><div class="val">${plata(valorPerd)}</div></div></div></div>
    <div class="kpi"><div class="top"><div class="ic" style="background:#e8f5ec;color:#2f7d4f"><i class="ti ti-packages"></i></div><div><div class="lbl">Productos</div><div class="val">${products.length}</div></div></div></div>
  </div>
  <div class="grid2">
    <div class="panel">
      <h3>Seguimiento de órdenes</h3>
      <table><thead><tr><th>Orden</th><th>Campo</th><th>Progreso</th><th>Estado</th><th>Inicio real</th></tr></thead><tbody>
      ${activas.length?activas.map(o=>{const d=o.detalle||{};return`<tr><td><b>${numOrden(o)}</b></td><td>${d.fundo||o.campo}</td><td>${pasos(o)}</td><td>${badge(o.estado)}</td><td style="font-size:12px;color:#8a8a8e">${d.inicioReal?d.inicioReal.fecha+' '+d.inicioReal.hora:'—'}</td></tr>`}).join(''):'<tr><td colspan="5" style="text-align:center;color:#8a8a8e">Sin órdenes</td></tr>'}
      </tbody></table>
    </div>
    <div class="panel">
      <h3>Valor por familia</h3>
      <div style="display:flex;gap:20px;align-items:center">
        <div style="width:140px;height:140px;flex-shrink:0"><canvas id="dona"></canvas></div>
        <div style="flex:1">
        ${top4.map((f,i)=>`<div class="famrow"><span><span class="dotc" style="background:${colores[i]}"></span>${f[0]}</span><span class="m">${plata(f[1])}</span></div>`).join('')}
        </div>
      </div>
    </div>
  </div>
  <div class="grid2">
    <div class="panel">
      <h3>Consumo mensual (aplicaciones)</h3>
      <div style="height:200px"><canvas id="cons"></canvas></div>
    </div>
    <div class="panel">
      <h3>Consumo por campo</h3>
      <div style="height:200px"><canvas id="campos"></canvas></div>
    </div>
  </div>`;
}

function buildCharts(){
  const fam={};
  products.forEach(p=>{const v=totalStock(p.id)*p.precio;if(v>0)fam[p.familia]=(fam[p.familia]||0)+v;});
  const famTop=Object.entries(fam).sort((a,b)=>b[1]-a[1]);
  const top4=famTop.slice(0,4);const resto=famTop.slice(4).reduce((s,f)=>s+f[1],0);
  if(resto>0)top4.push(['Otros',resto]);
  const colores=['#2f7d4f','#2456a0','#e6a817','#7B2D2D','#9aa2ad'];
  const d1=document.getElementById('dona');
  if(d1)charts.push(new Chart(d1,{type:'doughnut',data:{labels:top4.map(f=>f[0]),datasets:[{data:top4.map(f=>f[1]),backgroundColor:colores,borderWidth:0}]},options:{cutout:'62%',plugins:{legend:{display:false}}}}));

  // consumo mensual: aplicaciones en $ por mes
  const meses={};
  movimientos.filter(m=>m.tipo==='aplicacion').forEach(m=>{
    if(!m.fechaRaw)return;
    const d=new Date(m.fechaRaw);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const p=products.find(x=>x.nombre===m.producto);
    meses[k]=(meses[k]||0)+(p?m.cantidad*p.precio:0);
  });
  const mk=Object.keys(meses).sort().slice(-8);
  const nombres={'01':'Ene','02':'Feb','03':'Mar','04':'Abr','05':'May','06':'Jun','07':'Jul','08':'Ago','09':'Sep','10':'Oct','11':'Nov','12':'Dic'};
  const c2=document.getElementById('cons');
  if(c2)charts.push(new Chart(c2,{type:'bar',data:{labels:mk.map(k=>nombres[k.slice(5)]+' '+k.slice(2,4)),datasets:[{data:mk.map(k=>meses[k]),backgroundColor:'#2f7d4f99',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>plata(v)}},x:{grid:{display:false}}},responsive:true,maintainAspectRatio:false}}));

  // consumo por campo
  const campos={};
  movimientos.filter(m=>m.tipo==='aplicacion').forEach(m=>{
    const p=products.find(x=>x.nombre===m.producto);
    if(m.origen)campos[m.origen]=(campos[m.origen]||0)+(p?m.cantidad*p.precio:0);
  });
  const ck=Object.keys(campos);
  const c3=document.getElementById('campos');
  if(c3)charts.push(new Chart(c3,{type:'bar',data:{labels:ck,datasets:[{data:ck.map(k=>campos[k]),backgroundColor:'#7B2D2D99',borderRadius:6}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>plata(v)}},y:{grid:{display:false}}},responsive:true,maintainAspectRatio:false}}));
}

function renderOrdenes(){
  const fe=document.getElementById('f-est')?.value||'';
  const ft=document.getElementById('f-tipo')?.value||'';
  let lista=ordenes;
  if(fe)lista=lista.filter(o=>o.estado===fe);
  if(ft)lista=lista.filter(o=>(o.detalle?.tipo||'fitosanitario')===ft);
  return `
  <div class="panel">
    <div class="filters">
      <select id="f-est" onchange="render()">
        <option value="">Todos los estados</option>
        <option ${fe==='EN CURSO'?'selected':''} value="EN CURSO">Creadas</option>
        <option ${fe==='INICIADA'?'selected':''} value="INICIADA">Iniciadas</option>
        <option ${fe==='TERMINADA'?'selected':''} value="TERMINADA">Terminadas</option>
        <option ${fe==='ANULADA'?'selected':''} value="ANULADA">Anuladas</option>
      </select>
      <select id="f-tipo" onchange="render()">
        <option value="">Todos los tipos</option>
        <option ${ft==='fitosanitario'?'selected':''} value="fitosanitario">Fitosanitario</option>
        <option ${ft==='herbicida'?'selected':''} value="herbicida">Herbicida</option>
      </select>
      <span style="font-size:12.5px;color:#8a8a8e;align-self:center">${lista.length} órdenes</span>
    </div>
    <table><thead><tr><th>Orden</th><th>Tipo</th><th>Campo</th><th>Cuarteles</th><th>Ha</th><th>Creada</th><th>Progreso</th><th>Estado</th><th>Dosificador</th></tr></thead><tbody>
    ${lista.length?lista.map(o=>{const d=o.detalle||{};return`<tr>
      <td><b>${numOrden(o)}</b></td>
      <td style="font-size:12px">${d.tipo==='herbicida'?'Herbicida':'Fitosanitario'}</td>
      <td>${d.fundo||o.campo}</td>
      <td style="font-size:12px;color:#666">${(d.cuarteles||[]).map(c=>c.c).join(', ')||'—'}</td>
      <td>${d.hectareas||'—'}</td>
      <td style="font-size:12px">${d.fecha||o.fecha}</td>
      <td>${pasos(o)}</td>
      <td>${badge(o.estado)}</td>
      <td style="font-size:12px">${o.dosificador||'—'}</td>
    </tr>`}).join(''):'<tr><td colspan="9" style="text-align:center;color:#8a8a8e;padding:30px">No hay órdenes con esos filtros</td></tr>'}
    </tbody></table>
  </div>`;
}
</script>
</body>
</html>
