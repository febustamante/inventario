<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Gerencia · Agrícola San José</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;background:#f6f7f9;color:#1d1d1f;display:flex;min-height:100vh}
  .side{width:225px;background:#7B2D2D;color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
  .side .logo{background:#fff;margin:16px;padding:10px;border-radius:10px;text-align:center}
  .side .logo span{color:#7B2D2D;font-weight:800;font-size:14px;font-style:italic}
  .nav{flex:1;padding:6px 12px}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:9px;color:rgba(255,255,255,.75);text-decoration:none;font-size:13.5px;margin-bottom:2px;cursor:pointer}
  .nav a i{font-size:19px}
  .nav a.on{background:#2f7d4f;color:#fff;font-weight:600}
  .nav a:hover:not(.on){background:rgba(255,255,255,.08);color:#fff}
  .side .user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.15);display:flex;gap:10px;align-items:center}
  .side .user .av{width:34px;height:34px;border-radius:50%;background:#fff;color:#7B2D2D;display:flex;align-items:center;justify-content:center;font-weight:700}
  .main{flex:1;padding:22px 28px;min-width:0}
  .tophdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .tophdr h1{font-size:21px;font-weight:700}
  .tophdr .sub{font-size:12.5px;color:#8a8a8e;margin-top:2px}
  .btn{border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .btn.green{background:#2f7d4f;color:#fff}
  .btn.line{background:#fff;border:1px solid #e0e0e5;color:#444}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid #ececf0;border-radius:14px;padding:16px}
  .kpi .top{display:flex;gap:12px;align-items:center}
  .kpi .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .kpi .lbl{font-size:12.5px;color:#7a7a80}
  .kpi .val{font-size:22px;font-weight:800}
  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:16px}
  .panel{background:#fff;border:1px solid #ececf0;border-radius:14px;padding:18px}
  .panel h3{font-size:15px;font-weight:700;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:#8a8a8e;font-weight:600;text-align:left;padding:8px 10px;font-size:11.5px;border-bottom:1px solid #ececf0;text-transform:uppercase}
  td{padding:10px;border-bottom:1px solid #f4f4f7;vertical-align:middle}
  tr:last-child td{border:none}
  .tag{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap}
  .tag.creada{background:#e8f0fb;color:#2456a0}
  .tag.iniciada{background:#fdf3dc;color:#a87514}
  .tag.terminada{background:#e8f5ec;color:#2f7d4f}
  .tag.anulada{background:#fbecec;color:#a32d2d}
  .famrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
  .famrow .dotc{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
  .famrow .m{font-weight:700}
  .steps{display:flex;gap:3px;align-items:center}
  .step{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
  .step.ok{background:#2f7d4f;color:#fff}
  .step.no{background:#eceef1;color:#a0a0a5}
  .stline{width:16px;height:2px;background:#e0e0e5}
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filters select{padding:8px 12px;border:1px solid #e0e0e5;border-radius:8px;font-size:13px;background:#fff}
  #login{position:fixed;inset:0;background:#7B2D2D;display:flex;align-items:center;justify-content:center;z-index:99}
  #login .box{background:#fff;border-radius:16px;padding:34px;width:320px;text-align:center}
  #login h2{color:#7B2D2D;font-size:17px;margin-bottom:4px}
  #login p{font-size:12.5px;color:#8a8a8e;margin-bottom:16px}
  #login input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:20px;text-align:center;letter-spacing:8px;margin-bottom:12px}
  #login button{width:100%}
  .hide{display:none!important}
  .loading{text-align:center;padding:50px;color:#8a8a8e;font-size:14px}
  .err{color:#a32d2d;font-size:12px;min-height:16px;margin-bottom:8px}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div style="font-style:italic;font-weight:800;color:#7B2D2D;font-size:20px;margin-bottom:10px">Agrícola San José</div>
    <h2>Panel de Gerencia</h2>
    <p>Ingresa tu PIN para acceder</p>
    <input type="password" id="pin" maxlength="4" inputmode="numeric" placeholder="····" onkeydown="if(event.key==='Enter')entrar()">
    <div class="err" id="pin-err"></div>
    <button class="btn green" onclick="entrar()">Ingresar</button>
  </div>
</div>

<aside class="side hide" id="sidebar">
  <div class="logo"><span>Agrícola San José</span></div>
  <nav class="nav">
    <a class="on" data-v="dash" onclick="ver('dash')"><i class="ti ti-layout-dashboard"></i>Dashboard</a>
    <a data-v="ordenes" onclick="ver('ordenes')"><i class="ti ti-clipboard-list"></i>Control de órdenes</a>
    <a data-v="calendario" onclick="ver('calendario')"><i class="ti ti-calendar"></i>Calendario</a>
    <a onclick="cargar()"><i class="ti ti-refresh"></i>Actualizar datos</a>
    <a href="index.html"><i class="ti ti-device-mobile"></i>Ir a la app</a>
  </nav>
  <div class="user"><div class="av" id="u-av">G</div><div><div style="font-size:13px;font-weight:600" id="u-nm">Gerencia</div><div style="font-size:11px;opacity:.7">Panel escritorio</div></div></div>
</aside>

<main class="main hide" id="main">
  <div class="tophdr">
    <div><h1 id="titulo">Dashboard Gerencial</h1><div class="sub" id="subfecha"></div></div>
    <button class="btn line" onclick="cargar()"><i class="ti ti-refresh"></i> Actualizar</button>
  </div>
  <div id="contenido"><div class="loading">Cargando datos...</div></div>
</main>

<script>
const SUPABASE_URL='https://cmfvnluppvqyqwpfjrbs.supabase.co';
const SUPABASE_KEY='sb_publishable_TvfWNvrb2AitDfwvW5YNww_QsR_gjD1';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ID_UBIC={1:'Bodega Central',2:'Caseta Cerrillos',3:'Rulo',4:'Paine'};
const PINS={'2511':'Felipe','5555':'Gerencia'};
const plata=n=>'$'+Math.round(n).toLocaleString('es-CL');

let products=[],stockByLoc={},movimientos=[],ordenes=[],vista='dash',charts=[];

function entrar(){
  const p=document.getElementById('pin').value.trim();
  if(!PINS[p]){document.getElementById('pin-err').textContent='PIN incorrecto';return;}
  document.getElementById('u-nm').textContent=PINS[p];
  document.getElementById('u-av').textContent=PINS[p][0];
  document.getElementById('login').classList.add('hide');
  document.getElementById('sidebar').classList.remove('hide');
  document.getElementById('main').classList.remove('hide');
  document.getElementById('subfecha').textContent=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  cargar();
}

async function cargar(){
  document.getElementById('contenido').innerHTML='<div class="loading">Cargando datos...</div>';
  try{
    const [{data:prods},{data:stk},{data:movs},{data:ords}]=await Promise.all([
      sb.from('productos').select('*').order('nombre'),
      sb.from('stock').select('*'),
      sb.from('movimientos').select('*').eq('estado','ACTIVO').order('fecha',{ascending:false}),
      sb.from('ordenes').select('*').order('creado_en',{ascending:false})
    ]);
    products=(prods||[]).map(r=>({id:r.id,nombre:String(r.nombre||'').trim(),familia:String(r.familia||'SIN FAMILIA').trim(),minimo:parseFloat(r.minimo_alerta)||5,precio:parseFloat(r.precio_unitario)||0}));
    stockByLoc={};
    products.forEach(p=>stockByLoc[p.id]={'Bodega Central':0,'Caseta Cerrillos':0,'Rulo':0,'Paine':0});
    (stk||[]).forEach(s=>{const l=ID_UBIC[s.ubicacion_id];if(stockByLoc[s.producto_id]&&l)stockByLoc[s.producto_id][l]=parseFloat(s.cantidad)||0;});
    movimientos=(movs||[]).map(m=>{const pr=(prods||[]).find(p=>p.id===m.producto_id);return{tipo:String(m.tipo||'').toLowerCase(),producto:pr?String(pr.nombre).trim():'',cantidad:parseFloat(m.cantidad)||0,origen:ID_UBIC[m.origen_id]||'',destino:ID_UBIC[m.destino_id]||'',usuario:m.usuario||'',ordenNum:m.orden_id||'',obs:m.observaciones||'',fechaRaw:m.fecha,fecha:m.fecha?new Date(m.fecha).toLocaleDateString('es-CL'):''};});
    ordenes=(ords||[]).map(o=>({idOrden:o.id,fecha:o.creado_en?new Date(o.creado_en).toLocaleDateString('es-CL'):'',campo:ID_UBIC[o.campo_id]||'',dosificador:o.dosificador||'',estado:String(o.estado||'EN CURSO').toUpperCase(),detalle:o.detalle||{}}));
    render();
  }catch(e){
    document.getElementById('contenido').innerHTML='<div class="loading" style="color:#a32d2d">Error al cargar: '+(e.message||e)+'</div>';
  }
}

function totalStock(pid){const s=stockByLoc[pid]||{};return Object.values(s).reduce((a,b)=>a+b,0);}

function ver(v){
  vista=v;
  document.querySelectorAll('.nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  document.getElementById('titulo').textContent=v==='dash'?'Dashboard Gerencial':v==='calendario'?'Calendario de órdenes':'Control de órdenes';
  render();
}

function badge(est){
  const m={'EN CURSO':['creada','Creada'],'INICIADA':['iniciada','▶ Iniciada'],'TERMINADA':['terminada','✓ Terminada'],'ANULADA':['anulada','Anulada']};
  const[c,t]=m[est]||['creada',est];return`<span class="tag ${c}">${t}</span>`;
}
function pasos(o){
  const e=o.estado,d=o.detalle||{};
  const p1=true,p2=e==='INICIADA'||e==='TERMINADA',p3=e==='TERMINADA';
  return`<div class="steps" title="Creada${d.inicioReal?' · Iniciada '+d.inicioReal.fecha+' '+d.inicioReal.hora:''}${p3?' · Terminada':''}">
    <div class="step ok">✓</div><div class="stline"></div>
    <div class="step ${p2?'ok':'no'}">${p2?'✓':'·'}</div><div class="stline"></div>
    <div class="step ${p3?'ok':'no'}">${p3?'✓':'·'}</div></div>`;
}
function numOrden(o){const d=o.detalle||{};return(d.tipo==='herbicida'?'H':'F')+'-N°'+(d.numeroOrden||o.idOrden);}

function render(){
  charts.forEach(c=>c.destroy());charts=[];
  const el=document.getElementById('contenido');
  if(vista==='dash')el.innerHTML=renderDash();
  else if(vista==='calendario')el.innerHTML=renderCalendario();
  else el.innerHTML=renderOrdenes();
  if(vista==='dash')setTimeout(buildCharts,60);
}

function renderDash(){
  const creadas=ordenes.filter(o=>o.estado==='EN CURSO').length;
  const iniciadas=ordenes.filter(o=>o.estado==='INICIADA').length;
  const terminadas=ordenes.filter(o=>o.estado==='TERMINADA').length;
  const valorInv=products.reduce((s,p)=>s+totalStock(p.id)*p.precio,0);
  const bajo=products.filter(p=>{const t=totalStock(p.id);return t>0&&t<=p.minimo}).length;
  const agotados=products.filter(p=>totalStock(p.id)<=0).length;
  const perds=movimientos.filter(m=>m.tipo==='perdida');
  const valorPerd=perds.reduce((s,m)=>{const p=products.find(x=>x.nombre===m.producto);return s+(p?m.cantidad*p.precio:0)},0);

  // valor por familia
  const fam={};
  products.forEach(p=>{const v=totalStock(p.id)*p.precio;if(v>0)fam[p.familia]=(fam[p.familia]||0)+v;});
  const famTop=Object.entries(fam).sort((a,b)=>b[1]-a[1]);
  const top4=famTop.slice(0,4);const resto=famTop.slice(4).reduce((s,f)=>s+f[1],0);
  if(resto>0)top4.push(['Otros',resto]);
  const colores=['#2f7d4f','#2456a0','#e6a817','#7B2D2D','#9aa2ad'];

  const activas=[...ordenes.filter(o=>['EN CURSO','INICIADA'].includes(o.estado)),...ordenes.filter(o=>o.estado==='TERMINADA').slice(0,3)];

  return `
  <div class="kpis">
    <div class="kpi"><div class="top"><div class="ic" style="background:#e8f0fb;color:#2456a0"><i class="ti ti-file-plus"></i></div><div><div class="lbl">Órdenes creadas</div><div class="val">${creadas}</div></div></div></div>
    <div class="kpi"><div class="top"><div class="ic" style="background:#fdf3dc;color:#a87514"><i class="ti ti-player-play"></i></div><div><div class="lbl">Iniciadas</div><div class="val">${iniciadas}</div></div></div></div>
    <div class="kpi"><div class="top"><div class="ic" style="background:#e8f5ec;color:#2f7d4f"><i class="ti ti-circle-check"></i></div><div><div class="lbl">Terminadas</div><div class="val">${terminadas}</div></div></div></div>
    <div class="kpi"><div class="top"><div class="ic" style="background:#fbecec;color:#a32d2d"><i class="ti ti-currency-dollar"></i></div><div><div class="lbl">Valor inventario</div><div class="val">${plata(valorInv)}</div></div></div></div>
  </div>
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="top"><div class="ic" style="background:#fdf3dc;color:#a87514"><i class="ti ti-alert-triangle"></i></div><div><div class="lbl">Bajo stock / Agotados</div><div class="val">${bajo} / ${agotados}</div></div></div></div>
    <div class="kpi"><div class="top"><div class="ic" style="background:#fbecec;color:#a32d2d"><i class="ti ti-droplet-off"></i></div><div><div class="lbl">Pérdidas (${perds.length} reg.)</div><div class="val">${plata(valorPerd)}</div></div></div></div>
    <div class="kpi"><div class="top"><div class="ic" style="background:#e8f5ec;color:#2f7d4f"><i class="ti ti-packages"></i></div><div><div class="lbl">Productos</div><div class="val">${products.length}</div></div></div></div>
  </div>
  <div class="grid2">
    <div class="panel">
      <h3>Seguimiento de órdenes</h3>
      <table><thead><tr><th>Orden</th><th>Campo</th><th>Progreso</th><th>Estado</th><th>Inicio real</th></tr></thead><tbody>
      ${activas.length?activas.map(o=>{const d=o.detalle||{};return`<tr><td><b>${numOrden(o)}</b></td><td>${d.fundo||o.campo}</td><td>${pasos(o)}</td><td>${badge(o.estado)}</td><td style="font-size:12px;color:#8a8a8e">${d.inicioReal?d.inicioReal.fecha+' '+d.inicioReal.hora:'—'}</td></tr>`}).join(''):'<tr><td colspan="5" style="text-align:center;color:#8a8a8e">Sin órdenes</td></tr>'}
      </tbody></table>
    </div>
    <div class="panel">
      <h3>Valor por familia</h3>
      <div style="display:flex;gap:20px;align-items:center">
        <div style="width:140px;height:140px;flex-shrink:0"><canvas id="dona"></canvas></div>
        <div style="flex:1">
        ${top4.map((f,i)=>`<div class="famrow"><span><span class="dotc" style="background:${colores[i]}"></span>${f[0]}</span><span class="m">${plata(f[1])}</span></div>`).join('')}
        </div>
      </div>
    </div>
  </div>
  <div class="grid2">
    <div class="panel">
      <h3>Consumo mensual (aplicaciones)</h3>
      <div style="height:200px"><canvas id="cons"></canvas></div>
    </div>
    <div class="panel">
      <h3>Consumo por campo</h3>
      <div style="height:200px"><canvas id="campos"></canvas></div>
    </div>
  </div>`;
}

function buildCharts(){
  const fam={};
  products.forEach(p=>{const v=totalStock(p.id)*p.precio;if(v>0)fam[p.familia]=(fam[p.familia]||0)+v;});
  const famTop=Object.entries(fam).sort((a,b)=>b[1]-a[1]);
  const top4=famTop.slice(0,4);const resto=famTop.slice(4).reduce((s,f)=>s+f[1],0);
  if(resto>0)top4.push(['Otros',resto]);
  const colores=['#2f7d4f','#2456a0','#e6a817','#7B2D2D','#9aa2ad'];
  const d1=document.getElementById('dona');
  if(d1)charts.push(new Chart(d1,{type:'doughnut',data:{labels:top4.map(f=>f[0]),datasets:[{data:top4.map(f=>f[1]),backgroundColor:colores,borderWidth:0}]},options:{cutout:'62%',plugins:{legend:{display:false}}}}));

  // consumo mensual: aplicaciones en $ por mes
  const meses={};
  movimientos.filter(m=>m.tipo==='aplicacion').forEach(m=>{
    if(!m.fechaRaw)return;
    const d=new Date(m.fechaRaw);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const p=products.find(x=>x.nombre===m.producto);
    meses[k]=(meses[k]||0)+(p?m.cantidad*p.precio:0);
  });
  const mk=Object.keys(meses).sort().slice(-8);
  const nombres={'01':'Ene','02':'Feb','03':'Mar','04':'Abr','05':'May','06':'Jun','07':'Jul','08':'Ago','09':'Sep','10':'Oct','11':'Nov','12':'Dic'};
  const c2=document.getElementById('cons');
  if(c2)charts.push(new Chart(c2,{type:'bar',data:{labels:mk.map(k=>nombres[k.slice(5)]+' '+k.slice(2,4)),datasets:[{data:mk.map(k=>meses[k]),backgroundColor:'#2f7d4f99',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>plata(v)}},x:{grid:{display:false}}},responsive:true,maintainAspectRatio:false}}));

  // consumo por campo
  const campos={};
  movimientos.filter(m=>m.tipo==='aplicacion').forEach(m=>{
    const p=products.find(x=>x.nombre===m.producto);
    if(m.origen)campos[m.origen]=(campos[m.origen]||0)+(p?m.cantidad*p.precio:0);
  });
  const ck=Object.keys(campos);
  const c3=document.getElementById('campos');
  if(c3)charts.push(new Chart(c3,{type:'bar',data:{labels:ck,datasets:[{data:ck.map(k=>campos[k]),backgroundColor:'#7B2D2D99',borderRadius:6}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>plata(v)}},y:{grid:{display:false}}},responsive:true,maintainAspectRatio:false}}));
}

function renderOrdenes(){
  const fe=document.getElementById('f-est')?.value||'';
  const ft=document.getElementById('f-tipo')?.value||'';
  const fc=document.getElementById('f-campo')?.value||'';
  let lista=ordenes;
  if(fe)lista=lista.filter(o=>o.estado===fe);
  if(ft)lista=lista.filter(o=>(o.detalle?.tipo||'fitosanitario')===ft);
  if(fc)lista=lista.filter(o=>o.campo===fc);
  return `
  <div class="panel">
    <div class="filters">
      <select id="f-est" onchange="render()">
        <option value="">Todos los estados</option>
        <option ${fe==='EN CURSO'?'selected':''} value="EN CURSO">Creadas</option>
        <option ${fe==='INICIADA'?'selected':''} value="INICIADA">Iniciadas</option>
        <option ${fe==='TERMINADA'?'selected':''} value="TERMINADA">Terminadas</option>
        <option ${fe==='ANULADA'?'selected':''} value="ANULADA">Anuladas</option>
      </select>
      <select id="f-tipo" onchange="render()">
        <option value="">Todos los tipos</option>
        <option ${ft==='fitosanitario'?'selected':''} value="fitosanitario">Fitosanitario</option>
        <option ${ft==='herbicida'?'selected':''} value="herbicida">Herbicida</option>
      </select>
      <select id="f-campo" onchange="render()">
        <option value="">Todos los campos</option>
        ${['Caseta Cerrillos','Rulo','Paine'].map(c=>`<option ${fc===c?'selected':''} value="${c}">${c}</option>`).join('')}
      </select>
      <span style="font-size:12.5px;color:#8a8a8e;align-self:center">${lista.length} órdenes</span>
    </div>
    <table><thead><tr><th>Orden</th><th>Tipo</th><th>Campo</th><th>Cuarteles</th><th>Ha</th><th>Creada</th><th>Progreso</th><th>Estado</th><th>Dosificador</th><th>PDF</th></tr></thead><tbody>
    ${lista.length?lista.map((o,i)=>{const d=o.detalle||{};return`<tr onclick="toggleDet(${i})" style="cursor:pointer" title="Clic para ver el desglose">
      <td><b>${numOrden(o)}</b></td>
      <td style="font-size:12px">${d.tipo==='herbicida'?'Herbicida':'Fitosanitario'}</td>
      <td>${d.fundo||o.campo}</td>

      <td>${d.hectareas||'—'}</td>
      <td style="font-size:12px">${d.fecha||o.fecha}</td>
      <td>${pasos(o)}</td>
      <td>${badge(o.estado)}</td>
      <td style="font-size:12px">${o.dosificador||'—'}</td>
      <td><button class="btn line" style="padding:5px 10px;font-size:11.5px" onclick="event.stopPropagation();generarPDFOrden('${o.idOrden}')" title="Descargar PDF"><i class="ti ti-file-type-pdf"></i> PDF</button></td>
    </tr>
    <tr id="det-${i}" class="hide"><td colspan="10" style="background:#faf9f7;padding:16px 20px">${desglose(o)}</td></tr>`}).join(''):'<tr><td colspan="10" style="text-align:center;color:#8a8a8e;padding:30px">No hay órdenes con esos filtros</td></tr>'}
    </tbody></table>

}

function toggleDet(i){
  const el=document.getElementById('det-'+i);
  if(el)el.classList.toggle('hide');
}

// Desglose completo de una orden
function desglose(o){
  const d=o.detalle||{};
  const ia=d.infoAplicacion||null;
  const kv=(k,v)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #eee;font-size:12.5px"><span style="color:#8a8a8e">${k}</span><b>${v||'—'}</b></div>`;

  // tabla de productos: teórico y real
  const realDe=n=>{if(!ia||!ia.realAplicado)return null;const r=ia.realAplicado.find(x=>x.producto===n);return r?r.cantidad:null;};
  const prodRows=(d.productos||[]).map(p=>{
    const real=realDe(p.nombre);
    return`<tr><td>${p.nombre}</td><td>${p.dosis100||'—'}</td><td>${p.dosisHa||'—'}</td><td>${p.objetivo||'—'}</td><td>${p.totalTeorico!=null?p.totalTeorico:'—'}</td><td style="font-weight:700;color:${real!=null?'#2f7d4f':'#aaa'}">${real!=null?real:'—'}</td></tr>`;
  }).join('');

  return`
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:14px">
    <div>
      <div style="font-size:12px;font-weight:700;color:#7B2D2D;margin-bottom:6px">DATOS GENERALES</div>
      ${kv('Fecha de la orden',d.fecha)}
      ${kv('Fundo',d.fundo||o.campo)}
      ${kv('Cuarteles',(d.cuarteles||[]).map(c=>c.c+' ('+c.ha+' ha)').join(' · '))}
      ${kv('Hectáreas',d.hectareas)}
      ${kv('% Superficie',(d.pct||100)+'%')}
      ${kv('Mojamiento',d.mojamiento)}
      ${kv('Lts/kg máquina',d.ltsMaq)}
      ${kv('Total litros',d.totalLitros)}
      ${kv('Creada por',d.creadaPor||'—')}
      ${d.observaciones?`<div style="background:#dc1e1e;color:#fff;font-weight:700;font-size:12px;padding:8px;border-radius:7px;margin-top:8px;text-transform:uppercase">⚠️ ${d.observaciones}</div>`:''}
    </div>
    <div>
      <div style="font-size:12px;font-weight:700;color:#7B2D2D;margin-bottom:6px">EJECUCIÓN</div>
      ${kv('▶️ Inicio real',d.inicioReal?(d.inicioReal.fecha+' a las '+d.inicioReal.hora):'Aún no iniciada')}
      ${kv('Fecha inicio (formulario)',ia?((ia.fechaInicio||'')+' '+(ia.horaInicio||'')).trim():'—')}
      ${kv('Fecha término',ia?((ia.fechaTermino||'')+' '+(ia.horaTermino||'')).trim():'—')}
      ${kv('Lavado de máquina',ia?ia.lavado:'—')}
      ${kv('Elim. excedente',ia?ia.excedente:'—')}
      ${kv('Tiempo',ia&&ia.clima?ia.clima.tiempo:'—')}
      ${kv('Viento',ia&&ia.clima?ia.clima.viento:'—')}
      ${kv('Traje completo',ia&&ia.clima?ia.clima.trajeCompleto:'—')}
      ${ia&&ia.equipos&&ia.equipos.length?`<div style="font-size:12px;margin-top:8px"><b>Equipos:</b> ${ia.equipos.map((e,j)=>`E${j+1}: ${e.tractorista||'—'} / ${e.tractor||'—'} / ${e.pistonero||'—'}`).join(' · ')}</div>`:''}
    </div>
  </div>
  <div style="font-size:12px;font-weight:700;color:#7B2D2D;margin-bottom:6px">PRODUCTOS</div>
  <table style="font-size:12.5px"><thead><tr><th>Producto</th><th>Dosis/100</th><th>Dosis/ha</th><th>Objetivo</th><th>Teórico</th><th>Real aplicado</th></tr></thead>
  <tbody>${prodRows||'<tr><td colspan="6" style="color:#8a8a8e">Sin detalle de productos</td></tr>'}</tbody></table>`;
}

// ── CALENDARIO MENSUAL DE ÓRDENES ──
let calMes=new Date().getMonth(), calAno=new Date().getFullYear();
function moverMes(n){
  calMes+=n;
  if(calMes<0){calMes=11;calAno--;}
  if(calMes>11){calMes=0;calAno++;}
  render();
}

// La fecha de la orden: detalle.fecha (aaaa-mm-dd) o creación (dd-mm-aaaa)
function fechaOrden(o){
  const d=o.detalle||{};
  if(d.fecha && /^\d{4}-\d{2}-\d{2}$/.test(d.fecha)) return d.fecha;
  const f=(o.fecha||'').split('-');
  if(f.length===3) return f[2]+'-'+f[1].padStart(2,'0')+'-'+f[0].padStart(2,'0');
  return '';
}

function renderCalendario(){
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const primerDia=new Date(calAno,calMes,1);
  const diasMes=new Date(calAno,calMes+1,0).getDate();
  let inicio=primerDia.getDay()-1; if(inicio<0)inicio=6;

  const porDia={};
  ordenes.forEach(o=>{
    const f=fechaOrden(o);
    if(!f)return;
    const[a,m,d]=f.split('-').map(Number);
    if(a===calAno&&m===calMes+1){ (porDia[d]=porDia[d]||[]).push(o); }
  });

  const colEst={'EN CURSO':'#2456a0','INICIADA':'#a87514','TERMINADA':'#2f7d4f','ANULADA':'#a32d2d'};
  const bgEst={'EN CURSO':'#e8f0fb','INICIADA':'#fdf3dc','TERMINADA':'#e8f5ec','ANULADA':'#fbecec'};
  const hoy=new Date();
  const esHoy=d=>hoy.getFullYear()===calAno&&hoy.getMonth()===calMes&&hoy.getDate()===d;

  let celdas='';
  for(let i=0;i<inicio;i++) celdas+='<div class="cal-dia vacio"></div>';
  for(let d=1;d<=diasMes;d++){
    const ords=porDia[d]||[];
    celdas+=`<div class="cal-dia ${esHoy(d)?'hoy':''}">
      <div class="cal-num">${d}</div>
      ${ords.map(o=>{const det=o.detalle||{};return`<div class="cal-orden" style="background:${bgEst[o.estado]||'#eee'};color:${colEst[o.estado]||'#555'}" title="${numOrden(o)} · ${det.fundo||o.campo} · ${o.estado}">
        <b>${numOrden(o)}</b> ${det.fundo||o.campo}
      </div>`}).join('')}
    </div>`;
  }

  return `
  <style>
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .cal-hdr{font-size:11px;color:#8a8a8e;font-weight:700;text-transform:uppercase;text-align:center;padding:4px 0}
    .cal-dia{background:#fff;border:1px solid #ececf0;border-radius:10px;min-height:86px;padding:6px}
    .cal-dia.vacio{background:transparent;border:none}
    .cal-dia.hoy{border:2px solid #2f7d4f}
    .cal-num{font-size:12px;font-weight:700;color:#555;margin-bottom:4px}
    .cal-dia.hoy .cal-num{color:#2f7d4f}
    .cal-orden{font-size:10.5px;padding:3px 6px;border-radius:6px;margin-bottom:3px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  </style>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <button class="btn line" onclick="moverMes(-1)"><i class="ti ti-chevron-left"></i></button>
      <h3 style="margin:0">${meses[calMes]} ${calAno}</h3>
      <button class="btn line" onclick="moverMes(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="cal-grid" style="margin-bottom:4px">
      ${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-hdr">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${celdas}</div>
    <div style="display:flex;gap:14px;margin-top:14px;font-size:12px;color:#666">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#e8f0fb;border:1px solid #2456a0"></span> Creada</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#fdf3dc;border:1px solid #a87514"></span> Iniciada</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#e8f5ec;border:1px solid #2f7d4f"></span> Terminada</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#fbecec;border:1px solid #a32d2d"></span> Anulada</span>
    </div>
  </div>`;
}

const PRODUCTO_TOXICO = {"BELENUS 30 WG": true, "DELEGATE ( 0,3 KGS )": true, "IMIDAN 70 WP": true, "KARATE ZEON 1 LT.": true, "MILBEKNOCK": true, "ORTHENE 75 PS": true, "RUFAST 75 EW 1 L": true, "SANMITE WP ( 1 KG )": true, "SELECRON 720 EC": true, "TRIPP": true, "TWINGUARD RTU ( 2 KG )": true};
function generarPDFOrden(idOrden){
  const o = ordenes.find(x=>String(x.idOrden)===String(idOrden));
  if(!o || !o.detalle){ showToast('Esta orden no tiene datos para PDF','err'); return; }
  const d = o.detalle;
  if(typeof window.jspdf === 'undefined'){
    showToast('La librería de PDF no cargó. Revisa tu conexión y recarga la página.','err');
    return;
  }
  try{
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const W = 210;
  const VINO=[123,45,45], GRIS=[243,234,227], TX=[40,40,40], LBL=[130,130,130];
  const ia = d.infoAplicacion;

  // ── ENCABEZADO con logo ──
  doc.setFillColor(...VINO); doc.rect(0,0,W,22,'F');
  try{ if(typeof LOGO_PDF!=='undefined' && LOGO_PDF) doc.addImage(LOGO_PDF,'JPEG',10,5,42,12); }catch(e){}
  doc.setTextColor(255,255,255);
  doc.setFontSize(8); doc.setFont('helvetica','normal');
  const tipoTxt = (d.tipo==='herbicida') ? 'Aplicación de Herbicidas' : 'Aplicación de Productos Fitosanitarios';
  doc.text(tipoTxt + ' · Temp. 2026-2027', 56, 13);
  // recuadro N° orden
  doc.setDrawColor(255,255,255); doc.setFillColor(150,60,60);
  doc.roundedRect(W-42,5,32,12,2,2,'F');
  doc.setFontSize(6); doc.text('ORDEN N°', W-26, 9, {align:'center'});
  doc.setFontSize(15); doc.setFont('helvetica','bold'); doc.text(String(d.numeroOrden||o.idOrden), W-26, 15, {align:'center'});

  let y = 30;

  // ── DATOS GENERALES en 2 columnas ──
  const kv=(label,val,x,yy)=>{
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...LBL);doc.text(label,x,yy);
    doc.setTextColor(...TX);doc.setFont('helvetica','bold');doc.text(String(val||'—'),x+88,yy,{align:'right'});
    doc.setDrawColor(230,230,230);doc.line(x,yy+1.5,x+88,yy+1.5);
  };
  const L=10, R=112;
  kv('U. de Manejo','SJ-04',L,y); kv('Hectáreas a aplicar',(d.hectareas||0)+' ha',R,y); y+=6;
  kv('Fundo',d.fundo,L,y); kv('% Superficie',(d.pct||100)+'%',R,y); y+=6;
  kv('Especie',d.especie||'Uva de Mesa',L,y); kv('Mojamiento (lts/há)',d.mojamiento,R,y); y+=6;
  kv('Variedad',d.variedad,L,y); kv('Lts o Kg / máquina',d.ltsMaq,R,y); y+=6;
  kv('Cuartel(es)',(d.cuarteles||[]).map(c=>c.c).join(', '),L,y); kv('Total litros a aplic.', (d.totalLitros!=null?d.totalLitros:((d.hectareas||0)*(d.mojamiento||0)).toFixed(2)), R, y); y+=6;
  kv('Fecha',d.fecha,L,y); kv('Equipo a usar',d.equipo,R,y); y+=6;
  kv('Método',d.metodo,R,y); y+=9;

  // ── helper de sección ──
  const seccion=(titulo)=>{
    doc.setFillColor(...GRIS); doc.rect(10,y-4,W-20,6,'F');
    doc.setFillColor(...VINO); doc.rect(10,y-4,1.5,6,'F');
    doc.setTextColor(...VINO); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    doc.text(titulo.toUpperCase(),14,y); y+=5;
  };

  // ── PARA APLICACIÓN ──
  seccion('Para aplicación');
  const cols=['Producto','Dosis/100','Uni.','Dosis/maq','N°maq','Tot.prod','Dosis/ha','Objetivo','Car.','Tóx.'];
  const cx=[10,46,63,74,91,106,123,141,172,186];
  doc.setFillColor(...VINO); doc.setTextColor(255,255,255); doc.rect(10,y,W-20,5,'F'); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
  cols.forEach((c,i)=>doc.text(c,cx[i]+1,y+3.4)); y+=5;
  doc.setTextColor(...TX); doc.setFont('helvetica','normal'); doc.setFontSize(7);
  (d.productos||[]).forEach((p,idx)=>{
    const mojam=d.mojamiento||0, lm=d.ltsMaq||0, has=d.hectareas||0;
    const nMaq=lm?(has*mojam)/lm:0, dMaq=(lm*(p.dosis100||0))/100, tot=nMaq*dMaq;
    if(idx%2) { doc.setFillColor(250,247,245); doc.rect(10,y,W-20,5,'F'); }
    const vals=[p.nombre,(p.dosis100||0),'',dMaq.toFixed(2),nMaq.toFixed(1),tot.toFixed(2),(p.dosisHa||0),p.objetivo||'',p.carencia||''];
    vals.forEach((v,i)=>doc.text(String(v).substring(0,17),cx[i]+1,y+3.4));
    // Tóxico en rojo y negrita
    if(PRODUCTO_TOXICO[p.nombre]){
      doc.setTextColor(220,30,30); doc.setFont('helvetica','bold');
      doc.text('SÍ', cx[9]+1, y+3.4);
      doc.setTextColor(...TX); doc.setFont('helvetica','normal');
    }
    doc.setDrawColor(220,220,220); doc.rect(10,y,W-20,5); y+=5;
  });
  y+=5;

  // ── PARA BODEGA ──
  seccion('Para bodega — Real aplicado por cuartel');
  const cuarts=(d.cuarteles||[]).slice(0,5);
  const bh=['Producto','Real Aplic.',...cuarts.map(c=>c.c),'Total'];
  const bw=(W-20)/bh.length;
  doc.setFillColor(...VINO); doc.setTextColor(255,255,255); doc.rect(10,y,W-20,5,'F'); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
  bh.forEach((c,i)=>doc.text(String(c),10+bw*i+1,y+3.4)); y+=5;
  doc.setTextColor(...TX); doc.setFont('helvetica','normal'); doc.setFontSize(7);
  (d.productos||[]).forEach((p,idx)=>{
    if(idx%2){ doc.setFillColor(250,247,245); doc.rect(10,y,W-20,5,'F'); }
    let ra='';
    if(ia&&ia.realAplicado){ const f=ia.realAplicado.find(x=>x.producto===p.nombre); if(f) ra=f.cantidad; }
    doc.text(String(p.nombre).substring(0,16),11,y+3.4);
    doc.setFont('helvetica','bold'); doc.text(String(ra||'—'),10+bw+1,y+3.4); doc.setFont('helvetica','normal');
    (p.porCuartel||[]).slice(0,5).forEach((pc,j)=>doc.text(pc.val.toFixed(2),10+bw*(j+2)+1,y+3.4));
    doc.setFont('helvetica','bold'); doc.text(String((p.totalTeorico||0).toFixed(2)),10+bw*(bh.length-1)+1,y+3.4); doc.setFont('helvetica','normal');
    doc.setDrawColor(220,220,220); doc.rect(10,y,W-20,5); y+=5;
  });
  y+=5;

  // ── OBSERVACIONES DESTACADAS (aviso grande en rojo) ──
  if(d.observaciones){
    const obsTxt = String(d.observaciones).toUpperCase();
    doc.setFillColor(220,30,30);
    const lineas = doc.splitTextToSize(obsTxt, W-30);
    const altura = 6 + lineas.length*6;
    doc.rect(10,y,W-20,altura,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    lineas.forEach((ln,i)=>doc.text(ln, W/2, y+7+i*6, {align:'center'}));
    doc.setTextColor(...TX); doc.setFont('helvetica','normal');
    y += altura + 5;
  }

  // ── INFORMACIÓN DE LA APLICACIÓN ──
  seccion('Información de la aplicación');
  doc.setFontSize(8);
  const dato=(label,val,x,yy)=>{ doc.setTextColor(...LBL);doc.setFont('helvetica','normal');doc.text(label,x,yy);doc.setTextColor(...TX);doc.setFont('helvetica','bold');doc.text(String(val||'________'),x+44,yy);};
  const fi = ia ? ((ia.fechaInicio||'')+' '+(ia.horaInicio||'')).trim() : '';
  const ft = ia ? ((ia.fechaTermino||'')+' '+(ia.horaTermino||'')).trim() : '';
  dato('Inicio:',fi,L,y); dato('Término:',ft,R,y); y+=6;
  dato('Lavado máquina:',ia?ia.lavado:'',L,y); dato('Elim. excedente:',ia?ia.excedente:'',R,y); y+=6;
  dato('Tiempo:',ia&&ia.clima?ia.clima.tiempo:'',L,y); dato('Viento:',ia&&ia.clima?ia.clima.viento:'',R,y); y+=6;
  dato('Traje completo:',ia&&ia.clima?(ia.clima.trajeCompleto?'SÍ':'NO'):'',L,y); y+=8;

  // Tabla equipos
  doc.setFillColor(...VINO); doc.setTextColor(255,255,255); doc.rect(10,y,W-20,5,'F'); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
  ['Equipo','Tractorista','Tractor','Pistonero','Implemento'].forEach((c,i)=>doc.text(c,10+((W-20)/5)*i+1,y+3.4)); y+=5;
  doc.setTextColor(...TX); doc.setFont('helvetica','normal'); doc.setFontSize(7);
  // Hasta 5 equipos: los que llenó el aplicador, y el resto en blanco para lápiz
  const eqsBase = (ia&&ia.equipos)||[];
  const eqs = [];
  for(let i=0;i<5;i++) eqs.push(eqsBase[i]||{});
  eqs.forEach((e,idx)=>{
    const ew=(W-20)/5;
    doc.text(String(idx+1),10+1,y+3.4);
    if(e.tractorista) doc.text(String(e.tractorista).substring(0,18),10+ew+1,y+3.4);
    if(e.tractor) doc.text(String(e.tractor).substring(0,12),10+ew*2+1,y+3.4);
    if(e.pistonero) doc.text(String(e.pistonero).substring(0,18),10+ew*3+1,y+3.4);
    if(e.implemento) doc.text(String(e.implemento).substring(0,12),10+ew*4+1,y+3.4);
    doc.setDrawColor(220,220,220); doc.rect(10,y,W-20,6); y+=6;
  });
  y+=6;

  // ── CARENCIAS (en blanco) ──
  seccion('Fechas de carencia y reingreso');
  dato('Estimada cosecha:','',L,y); dato('Reingreso (hrs):','',R,y); y+=6;
  dato('Mínima cosecha:','',L,y); dato('Reingreso embaraz.:','',R,y); y+=12;

  // ── FIRMAS ──
  const fx=[35,105,175];
  fx.forEach(x=>{ doc.setDrawColor(80,80,80); doc.line(x-25,y,x+25,y); });
  y+=4; doc.setFontSize(7); doc.setTextColor(...LBL);
  doc.text('Responsable (Asesor)',fx[0],y,{align:'center'});
  doc.text('Responsable Aplicación',fx[1],y,{align:'center'});
  doc.text('Dosificador',fx[2],y,{align:'center'});

  // ── PÁGINA 2: CONSUMO REAL POR CUARTEL (solo si la orden está completada) ──
  if(ia && ia.realAplicado && ia.realAplicado.length){
    doc.addPage();
    let y2 = 14;
    doc.setFillColor(...VINO); doc.rect(0,0,W,16,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(11); doc.setFont('helvetica','bold');
    doc.text('CONSUMO REAL POR CUARTEL — Orden N°'+(d.numeroOrden||o.idOrden), W/2, 10, {align:'center'});
    y2 = 24;
    doc.setTextColor(...TX); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Reparto del consumo real de cada producto entre los cuarteles, proporcional a sus hectáreas.', 10, y2); y2+=7;

    const cuartsF = (d.cuartelesFinales||d.cuarteles||[]);
    const totHa = cuartsF.reduce((s,c)=>s+(c.ha||0),0) || 1;
    const bh2=['Producto','Real Total',...cuartsF.map(c=>c.c)];
    const bw2=(W-20)/bh2.length;
    doc.setFillColor(...VINO); doc.setTextColor(255,255,255); doc.rect(10,y2,W-20,6,'F'); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    bh2.forEach((c,i)=>doc.text(String(c),10+bw2*i+1,y2+4)); 
    // fila de hectáreas bajo el encabezado
    y2+=6;
    doc.setTextColor(...LBL); doc.setFontSize(6);
    doc.text('(hectáreas)',10+bw2+1,y2+3);
    cuartsF.forEach((c,i)=>doc.text((c.ha||0)+' ha',10+bw2*(i+2)+1,y2+3));
    doc.setDrawColor(220,220,220); doc.rect(10,y2,W-20,4.5); y2+=4.5;
    doc.setTextColor(...TX); doc.setFontSize(7); doc.setFont('helvetica','normal');
    ia.realAplicado.forEach((ra,idx)=>{
      if(idx%2){ doc.setFillColor(250,247,245); doc.rect(10,y2,W-20,5.5,'F'); }
      doc.text(String(ra.producto).substring(0,18),11,y2+3.8);
      doc.setFont('helvetica','bold'); doc.text(String(ra.cantidad),10+bw2+1,y2+3.8); doc.setFont('helvetica','normal');
      cuartsF.forEach((c,i)=>{
        const val = ra.cantidad*(c.ha||0)/totHa;
        doc.text(val.toFixed(2),10+bw2*(i+2)+1,y2+3.8);
      });
      doc.setDrawColor(220,220,220); doc.rect(10,y2,W-20,5.5); y2+=5.5;
    });
    y2+=6;
    doc.setFontSize(7); doc.setTextColor(...LBL);
    doc.text('Generado por el sistema de inventario · Agrícola San José', 10, y2);
  }

  doc.save('Orden_'+(d.numeroOrden||o.idOrden)+'_'+(d.fundo||'')+'.pdf');
  showToast('PDF generado');
  }catch(e){
    console.error(e);
    showToast('Error al generar PDF: '+(e.message||'desconocido'),'err');
  }
}
</script>
</body>
</html>
