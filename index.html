<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>San Jose Inventario</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --vino:#7B2D2D;--vino2:#5e2121;--vino3:#9d3b3b;
  --vino-glow:rgba(123,45,45,.15);--gold:#C4933F;
  --bg:#f7f3f0;--surf:#fff;--surf2:#faf7f5;--surf3:#f2ece8;
  --bd:#e8ddd8;--bd2:#d4c4bc;
  --tx:#1a0f0f;--tx2:#6b4f4f;--tx3:#a8908a;
  --green:#2d6b2d;--green-bg:#e8f5e8;
  --amber:#8a5e00;--amber-bg:#fff3d4;
  --red:#8a1a1a;--red-bg:#fce8e8;
  --blue:#1a4a8a;--blue-bg:#e8f0fc;
  --purple:#9d6b4f;--purple-bg:#f3eae3;
  --r:10px;--rl:16px;--rx:20px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(123,45,45,.06);
  --shadow-lg:0 4px 24px rgba(0,0,0,.12),0 12px 40px rgba(123,45,45,.1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html{height:100%;background:var(--vino)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;min-height:100%;overflow-x:hidden}
input,select,textarea,button{font-family:'Inter',system-ui,sans-serif;font-size:16px}

.screen{display:none;min-height:100vh}.screen.active{display:block}
.screen:not(.active){display:none !important}
/* Con el login visible, la página no debe hacer scroll; el login queda fijo y centrado */
body.login-activo{overflow:hidden;position:fixed;width:100%;height:100%}

/* LOGIN */
#sl{height:100vh;height:100dvh;overflow:hidden;background:#f3eee9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 1rem) 1.25rem 1rem}
.login-box{background:var(--surf);border:1px solid #e8e0d8;border-radius:18px;padding:1.1rem 1.25rem;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(110,40,40,.08)}
.login-logo{display:block;width:120px;max-width:48%;margin:0 auto .5rem}
.login-welcome{font-size:18px;font-weight:600;color:var(--tx);text-align:center}
.login-sub{font-size:12.5px;color:var(--tx3);text-align:center;margin-bottom:.7rem}
.user-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;border:1px solid #e8e0d8;background:var(--surf);cursor:pointer;width:100%;margin-bottom:7px;text-align:left;transition:all .15s;min-height:52px}
.user-btn:active,.user-btn:hover{border-color:var(--vino);background:var(--vino-glow)}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;color:#fff}
.av-m{background:var(--vino)}
.av-b{background:#3d5a80}
.av-d{background:#2d6b3a}
.av-g{background:var(--gold)}
.user-name{font-size:14px;font-weight:600;color:var(--tx)}
.user-desc{font-size:12px;color:var(--tx3);margin-top:1px}
.user-arrow{margin-left:auto;color:#cbbfb5;font-size:18px}
.pin-header{text-align:center;margin-bottom:.6rem}
.pin-avatar{width:40px;height:40px;border-radius:50%;background:var(--vino);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;margin:0 auto 4px}
.pin-username{font-size:15px;font-weight:600;color:var(--tx)}
.pin-userrole{font-size:12px;color:var(--tx3)}
.pin-dots{display:flex;gap:11px;justify-content:center;margin-bottom:.5rem}
.pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--bd2);background:transparent;transition:all .2s}
.pin-dot.filled{background:var(--vino);border-color:var(--vino);transform:scale(1.1)}
.pin-numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:.5rem;max-width:255px;margin-left:auto;margin-right:auto}
.pin-key{padding:10px;border-radius:10px;border:1px solid #ece6e0;background:#f9f6f3;font-size:18px;font-weight:500;cursor:pointer;text-align:center;color:var(--tx);transition:all .1s;min-height:43px;display:flex;align-items:center;justify-content:center}
.pin-key:active{background:var(--vino-glow);border-color:var(--vino);transform:scale(.96)}
.pin-key.del{font-size:18px;color:var(--tx2);background:transparent;border-color:transparent}
.pin-key.empty{background:transparent;border:none;cursor:default}
.pin-error{font-size:13px;color:var(--red);text-align:center;min-height:18px;font-weight:500;margin-bottom:.4rem}
.pin-volver{display:block;margin:0 auto;background:none;border:none;color:var(--tx3);font-size:12px;cursor:pointer;padding:6px}
.topbar-logo{height:28px;width:auto;background:#fff;padding:4px 8px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.15)}



/* APP */
#sa{display:none;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;overflow:hidden}
#sa.active{display:flex;flex-direction:column}
.main-area{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0;overflow:hidden}
/* Sidebar oculto en móvil */
.side-nav{display:none}
/* En móvil, garantizar que la barra inferior siempre se vea */
@media(max-width:899px){
/* En móvil, barra inferior flotante siempre visible (estilo app nativa) */
@media(max-width:899px){
  .bottom-nav{
    position:fixed;
    left:10px;right:10px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
    z-index:60;
    border-radius:20px;
    border:1px solid var(--bd);
    box-shadow:0 6px 24px rgba(0,0,0,.15);
    padding:6px 0;
  }
  .app-scroll{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .menu-mas{bottom:calc(env(safe-area-inset-bottom,0px) + 76px)}
}
}

/* ══ ESCRITORIO: sidebar lateral ══ */
@media(min-width:900px){
  #sa.active{flex-direction:row}
  .side-nav{display:flex;flex-direction:column;width:240px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--bd);height:100vh;height:100dvh}
  .side-brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
  .side-logo-badge{width:38px;height:38px;border-radius:11px;background:var(--vino);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-style:italic;font-size:16px;flex-shrink:0}
  .side-title{font-weight:800;font-size:16px;color:var(--tx);line-height:1.1}
  .side-sub{font-size:11px;color:var(--tx3)}
  .side-section{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--tx3);padding:6px 20px 8px}
  #side-menu{flex:1;overflow-y:auto;padding:0 10px}
  .side-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;color:var(--tx2);font-size:14px;font-weight:500;cursor:pointer;margin-bottom:3px;border:none;background:none;width:100%;text-align:left;transition:all .12s}
  .side-item i{font-size:20px;color:var(--tx3);flex-shrink:0}
  .side-item:hover{background:var(--surf2)}
  .side-item.active{background:var(--vino);color:#fff;font-weight:700}
  .side-item.active i{color:#fff}
  .side-user{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--bd);cursor:pointer;margin:6px 10px}
  .side-user:hover{background:var(--surf2);border-radius:10px}
  .side-av{width:34px;height:34px;border-radius:50%;background:var(--vino);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
  .side-uname{font-size:13.5px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-urole{font-size:11px;color:var(--tx3)}
  /* En escritorio: ocultar la barra inferior y compactar el topbar */
  .bottom-nav{display:none !important}
  .topbar-brand{display:none}
  .topbar{justify-content:flex-end}
  .app-scroll{padding:1.5rem 2rem 2rem}
  #panels-container{max-width:1100px;margin:0 auto}
}
.topbar{background:var(--vino);padding:calc(var(--safe-t) + .75rem) 1rem .75rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-grape{font-size:22px;color:rgba(255,255,255,.9)}
.topbar-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-user{font-size:11px;color:rgba(255,255,255,.65);margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.role-chip{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-out{padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer;font-weight:500;min-height:34px;display:flex;align-items:center;justify-content:center}
.btn-out:active{background:rgba(255,255,255,.2)}

/* SYNC BAR */
.sync-bar{background:#1e3320;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;border-bottom:1px solid #2f5233}
.sync-status{display:flex;align-items:center;gap:8px;font-size:12px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#e74c3c;flex-shrink:0;transition:background .3s}
.sync-dot.on{background:#3ddc84}
.sync-dot.loading{background:#f39c12;animation:pulse 1s infinite}
.sync-txt{color:#cdd8ce}
.sync-txt.on{color:#7ee0a0}
.btn-sync{padding:5px 12px;border-radius:6px;border:1px solid #2ecc71;background:transparent;color:#2ecc71;font-size:11px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn-sync:active{background:#2ecc7120}
.btn-sync:disabled{opacity:.4;cursor:not-allowed}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.app-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1rem calc(80px + var(--safe-b)) 1rem}
.panel{display:none}.panel.active{display:block}

.bottom-nav{background:var(--surf);border-top:1px solid var(--bd);padding:6px 0 calc(6px + var(--safe-b));display:flex;flex-shrink:0;position:relative;z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;cursor:pointer;border:none;background:transparent;color:var(--tx3);min-height:52px;position:relative;transition:color .15s}
.nav-item:active{background:var(--surf3)}
.nav-item.active{color:var(--vino)}
.nav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--vino);border-radius:0 0 3px 3px}
.nav-icon{font-size:22px;line-height:1;transition:transform .15s}
.nav-item.active .nav-icon{transform:scale(1.1)}
.menu-mas{display:none;position:fixed;bottom:calc(60px + var(--safe-b));right:12px;background:var(--surf);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:6px;z-index:200;min-width:190px}
.menu-mas-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px 4px}
.menu-mas-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:none;background:transparent;color:var(--tx);font-size:14px;text-align:left;cursor:pointer;border-radius:9px}
.menu-mas-item:active,.menu-mas-item:hover{background:var(--vino-glow);color:var(--vino)}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}

.section-header{margin-bottom:1rem}
.section-title{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.3px}
.section-sub{font-size:13px;color:var(--tx3);margin-top:2px}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.25rem}
.stat-card{background:var(--surf);border-radius:var(--rl);padding:1rem;box-shadow:var(--shadow);border:1px solid var(--bd)}
.stat-icon{font-size:20px;margin-bottom:6px}
.stat-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin-bottom:4px}
.stat-value{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.5px}
.sv-vino{color:var(--vino)}.sv-green{color:var(--green)}.sv-amber{color:var(--amber)}.sv-red{color:var(--red)}.sv-blue{color:var(--blue)}.sv-purple{color:var(--purple)}

.loc-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1.25rem}
.loc-card{background:var(--surf);border-radius:var(--r);padding:.875rem 1rem;box-shadow:var(--shadow);border:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.loc-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.loc-name{font-size:11px;font-weight:500;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
.loc-val{font-size:18px;font-weight:700;color:var(--tx);letter-spacing:-.3px}

.card{background:var(--surf);border-radius:var(--rl);border:1px solid var(--bd);box-shadow:var(--shadow);overflow:hidden;margin-bottom:1rem}
.card-header{padding:12px 14px;background:var(--surf2);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-title{font-size:13px;font-weight:600;color:var(--vino);display:flex;align-items:center;gap:6px}

.prod-item{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.prod-item:last-child{border-bottom:none}
.prod-item:active{background:var(--surf2)}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:14px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2item{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--bd)}
.v2item:last-child{border-bottom:none}
.v2name{font-size:15px;font-weight:500;color:var(--tx)}
.v2fam{font-size:12px;color:var(--tx3);margin-top:2px}
.v2qty{font-size:17px;font-weight:600;color:var(--tx)}
.prod-fam{font-size:11px;color:var(--tx3);margin-top:1px}
.prod-stocks{display:flex;gap:6px;align-items:center;flex-shrink:0}
.prod-total{font-size:16px;font-weight:700;color:var(--tx);min-width:40px;text-align:right}

.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--green-bg);color:var(--green)}
.b-low{background:var(--amber-bg);color:var(--amber)}
.b-out{background:var(--red-bg);color:var(--red)}
.b-venc{background:var(--purple-bg);color:var(--purple)}
.b-info{background:var(--blue-bg);color:var(--blue)}

.search-wrap{position:relative;margin-bottom:10px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:16px;pointer-events:none}
.search-input{width:100%;padding:12px 12px 12px 38px;border:1.5px solid var(--bd2);border-radius:var(--r);background:var(--surf);color:var(--tx);font-size:15px;outline:none}
.search-input:focus{border-color:var(--vino)}
.filter-row{display:flex;gap:8px;margin-bottom:1rem;overflow-x:auto;padding-bottom:2px}
.filter-chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--bd2);background:var(--surf);color:var(--tx2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
.filter-chip.active{background:var(--vino);color:#fff;border-color:var(--vino)}

.form-box{background:var(--surf);border-radius:var(--rl);padding:1.25rem;box-shadow:var(--shadow);border:1px solid var(--bd);margin-bottom:1rem}
.form-title{font-size:16px;font-weight:600;color:var(--tx);margin-bottom:1.25rem;display:flex;align-items:center;gap:8px}
.form-title-icon{width:32px;height:32px;border-radius:8px;background:var(--vino-glow);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.form-group{margin-bottom:12px}
.form-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);display:block;margin-bottom:6px}
.required{color:var(--red)}
.form-control{width:100%;padding:13px 14px;border:1.5px solid var(--bd2);border-radius:var(--r);background:var(--surf3);color:var(--tx);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
.form-control:focus{border-color:var(--vino);box-shadow:0 0 0 3px var(--vino-glow);background:var(--surf)}
.form-control::placeholder{color:var(--tx3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-avail{font-size:13px;color:var(--green);font-weight:500;margin-top:4px}
.form-avail.warn{color:var(--amber)}
.form-avail.err{color:var(--red)}

.btn-primary{width:100%;padding:16px;border-radius:var(--r);border:none;background:var(--vino);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:1rem;box-shadow:0 4px 12px rgba(123,45,45,.3);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.btn-primary:active{background:var(--vino2);transform:scale(.98)}
.btn-sec{padding:10px 16px;border-radius:var(--r);border:1.5px solid var(--bd2);background:var(--surf);color:var(--tx2);font-size:14px;font-weight:500;cursor:pointer}
.btn-sec:active{background:var(--surf3)}

.orden-line{background:var(--surf3);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:minmax(0,1fr) 78px 40px;gap:8px;align-items:center}
.orden-line select,.orden-line input{min-width:0;width:100%;box-sizing:border-box;padding:11px 10px;border:1px solid var(--bd2);border-radius:9px;font-size:14px;background:#fff}
.orden-line input[type=number]{text-align:center}
.orden-line select,.orden-line input{padding:10px;border:1.5px solid var(--bd2);border-radius:8px;background:var(--surf);color:var(--tx);font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
.orden-line select:focus,.orden-line input:focus{border-color:var(--vino)}

.orden-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--rl);padding:1rem;margin-bottom:10px;box-shadow:var(--shadow)}
.orden-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.75rem}
.ord-tabla{width:100%;min-width:600px;border-collapse:collapse;font-size:11px;table-layout:fixed}
.ord-tabla th{background:var(--vino);color:#fff;padding:5px 4px;text-align:center;font-size:10px;font-weight:600;line-height:1.1;border:1px solid #6a2525}
.ord-tabla td{padding:3px;border:1px solid var(--bd);text-align:center;vertical-align:middle;overflow:hidden}
.ord-tabla input,.ord-tabla select{width:100%;padding:5px 4px;border:1px solid var(--bd2);border-radius:5px;font-size:11px;background:var(--surf);color:var(--tx);outline:none;-webkit-appearance:none;appearance:none;box-sizing:border-box}
.ord-tabla select{text-overflow:ellipsis}
.ord-tabla input:focus,.ord-tabla select:focus{border-color:var(--vino)}
.ord-tabla .calc-cell{font-weight:700;color:var(--vino);background:var(--surf2)}
.ord-tabla .del-btn{padding:3px 7px;border:1px solid var(--bd2);border-radius:5px;background:var(--surf2);color:var(--tx2);font-size:11px;cursor:pointer}
.orden-num-badge{background:var(--vino);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.orden-date{font-size:12px;color:var(--tx3)}
.orden-campo-chip{display:inline-flex;align-items:center;gap:4px;background:var(--vino-glow);color:var(--vino);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;margin-bottom:.5rem}
.orden-prod-line{font-size:13px;color:var(--tx2);padding:3px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px}
.orden-prod-line:last-child{border-bottom:none}
.orden-prod-qty{font-weight:600;color:var(--tx);min-width:30px}

.move-item{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px}
.move-item:last-child{border-bottom:none}
.move-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.move-body{flex:1;min-width:0}
.move-prod{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.move-detail{font-size:11px;color:var(--tx3);margin-top:1px}
.move-right{text-align:right;flex-shrink:0}
.move-qty{font-size:14px;font-weight:600}
.move-date{font-size:10px;color:var(--tx3);margin-top:2px}

.alert-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);margin-bottom:6px;border:1px solid}
.alert-item.crit{background:var(--red-bg);border-color:#f0a0a0;color:var(--red)}
.alert-item.warn{background:var(--amber-bg);border-color:#f0c878;color:var(--amber)}

.chart-container{padding:1rem;position:relative}
.chart-wrap{position:relative;width:100%;height:200px}
.chart-wrap-sm{position:relative;width:100%;height:160px}

.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1rem}
.kpi-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--rl);padding:1rem;box-shadow:var(--shadow)}
.kpi-icon{font-size:20px;margin-bottom:.5rem}
.kpi-val{font-size:24px;font-weight:700;letter-spacing:-.5px}
.kpi-label{font-size:11px;color:var(--tx3);margin-top:2px}

#toast{position:fixed;bottom:calc(72px + var(--safe-b));left:1rem;right:1rem;padding:14px 16px;border-radius:var(--r);font-size:14px;font-weight:500;z-index:9999;display:none;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.2)}
#toast.ok{background:var(--green-bg);border:1.5px solid #78b878;color:var(--green)}
#toast.err{background:var(--red-bg);border:1.5px solid #e07070;color:var(--red)}
#toast.info{background:var(--blue-bg);border:1.5px solid #78a0e0;color:var(--blue)}

.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--tx3)}
.empty-icon{font-size:40px;margin-bottom:.75rem;opacity:.4}
.empty-text{font-size:14px}
.divider{height:1px;background:var(--bd);margin:1rem 0}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:.75rem}

/* LOADING OVERLAY */
.loading-overlay{position:fixed;inset:0;background:rgba(123,45,45,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
.loading-spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.loading-text{color:#fff;font-size:14px;font-weight:500}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

// ── CACHE LOCAL (carga instantanea, sin esperar a Sheets) ──
const CACHE_KEY = 'sanjose_cache_v1';

function guardarCacheLocal() {
  try {
    const payload = {
      products,
      stockByLoc,
      movimientos,
      ordenes,
      guardadoEn: Date.now()
    };
    localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
  } catch (e) {
    console.warn('No se pudo guardar cache local:', e);
  }
}

function cargarCacheLocal() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return false;
    const payload = JSON.parse(raw);
    products    = payload.products    || [];
    stockByLoc  = payload.stockByLoc   || {};
    movimientos = payload.movimientos  || [];
    ordenes     = payload.ordenes      || [];
    return products.length > 0;
  } catch (e) {
    console.warn('No se pudo leer cache local:', e);
    return false;
  }
}

function edadCacheTexto() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return '';
    const payload = JSON.parse(raw);
    const segs = Math.floor((Date.now() - payload.guardadoEn) / 1000);
    if (segs < 60) return 'hace ' + segs + 's';
    const mins = Math.floor(segs / 60);
    if (mins < 60) return 'hace ' + mins + ' min';
    const horas = Math.floor(mins / 60);
    return 'hace ' + horas + ' h';
  } catch (e) {
    return '';
  }
}

// ── HELPERS ──
function totalStock(pid){return Object.values(stockByLoc[pid]||{}).reduce((a,b)=>a+b,0)}
function stockAt(pid,loc){return(stockByLoc[pid]||{})[loc]||0}
// El bodeguero ve SOLO Bodega Central; maestro y gerencia ven el total de los 4 campos
function esBodeguero(){return typeof curUser!=='undefined'&&curUser&&curUser.role==='bodeguero';}
function stockVisible(pid){return esBodeguero()?stockAt(pid,'Bodega Central'):totalStock(pid);}
function addStock(pid,loc,delta){
  if(!stockByLoc[pid])stockByLoc[pid]={};
  stockByLoc[pid][loc]=(stockByLoc[pid][loc]||0)+delta;
  if(stockByLoc[pid][loc]<0)stockByLoc[pid][loc]=0;
}

  const p=products.find(x=>x.id===pid);
  if(!p)return['?',''];
  if(p.vencido)return['Vencido','b-venc'];
  const t=stockVisible(pid);
  if(t<=0)return['Agotado','b-out'];
  if(t<=p.minimo)return['Stock bajo','b-low'];
  return['En stock','b-ok'];
}

  const x=parseFloat(parseFloat(n||0).toFixed(2));
  // Separador de miles chileno, sin decimales si es entero, con hasta 2 si tiene
  return x.toLocaleString('es-CL',{minimumFractionDigits:0, maximumFractionDigits:2});
}

// Traduce el nombre del producto a su ID en la base de datos.
function pidPorNombre(nombre){
  const p = products.find(x => String(x.nombre).toUpperCase().trim() === String(nombre).toUpperCase().trim());
  return p ? p.id : null;
}

// Lee todo el estado actual desde Supabase (productos + stock + movimientos + ordenes)
// ── AVISO DE ÓRDENES NUEVAS al dosificador (notificación + sonido) ──
function notificarOrdenesNuevas(){
  if(!curUser || curUser.role!=='dosificador') return;
  const clave = 'ordenesVistas:'+curUser.id;
  const mias = ordenes.filter(o=>
    String(o.dosificador).toLowerCase()===String(curUser.id).toLowerCase() &&
    ['EN CURSO','INICIADA'].includes(String(o.estado).toUpperCase())
  );
  let vistas;
  try{ vistas = JSON.parse(localStorage.getItem(clave)||'null'); }catch(_){ vistas=null; }
  const idsActuales = mias.map(o=>String(o.idOrden));
  if(vistas===null){
    // primera vez: registrar sin avisar (evita avalancha al entrar)
    try{ localStorage.setItem(clave, JSON.stringify(idsActuales)); }catch(_){}
    return;
  }
  const nuevas = mias.filter(o=>!vistas.includes(String(o.idOrden)));
  if(nuevas.length){
    nuevas.forEach(o=>{
      const d=o.detalle||{};
      const titulo = '📋 Nueva orden N°'+(d.numeroOrden||o.idOrden);
      const cuerpo = (d.tipo==='herbicida'?'Herbicida':'Fitosanitario')+' · '+(d.fundo||o.campo)+' · '+(d.hectareas||'?')+' ha';
      // Notificación del sistema (si dio permiso)
      if('Notification' in window && Notification.permission==='granted'){
        try{ new Notification(titulo,{body:cuerpo,icon:'',tag:'orden-'+o.idOrden}); }catch(_){}
      }
      // Aviso dentro de la app siempre
      showToast(titulo+' · '+cuerpo);
    });
    // vibrar si el teléfono lo permite
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }
  try{ localStorage.setItem(clave, JSON.stringify(idsActuales)); }catch(_){}
}

async function syncData() {
  setSyncStatus('loading', 'Sincronizando...');
  const btn = document.getElementById('btn-sync');
  if (btn) btn.disabled = true;

  try {
    // 1) Productos
    const { data: prods, error: e1 } = await sb
      .from('productos').select('*').order('nombre');
    if (e1) throw e1;

    // 2) Stock (todas las filas producto+ubicacion)
    const { data: stk, error: e2 } = await sb
      .from('stock').select('*');
    if (e2) throw e2;

    // 3) Movimientos activos (historial)
    const { data: movs, error: e3 } = await sb
      .from('movimientos').select('*')
      .eq('estado','ACTIVO').order('id', {ascending:false});
    if (e3) throw e3;

    // 4) Ordenes
    const { data: ords, error: e4 } = await sb
      .from('ordenes').select('*').order('creado_en', {ascending:false});
    if (e4) throw e4;

    // 5) Órdenes de compra (tabla nueva; si no existe, no rompe)
    let ocs=[];
    try{
      const { data: ocData, error: e5 } = await sb
        .from('ordenes_compra').select('*').order('creado_en',{ascending:false});
      if(!e5) ocs = ocData||[];
    }catch(_){ ocs=[]; }

    // 6) Materiales de campo (tablas nuevas; si no existen, no rompe)
    let mats=[], matsMov=[];
    try{
      const { data: mData, error: e6 } = await sb.from('materiales').select('*').order('categoria');
      if(!e6) mats = mData||[];
      const { data: mmData, error: e7 } = await sb.from('materiales_mov').select('*').order('fecha',{ascending:false});
      if(!e7) matsMov = mmData||[];
    }catch(_){ mats=[]; matsMov=[]; }

    // ── Armar products y stockByLoc con el formato que usa la app ──
    const nuevosProducts = [];
    const nuevoStockByLoc = {};

    prods.forEach(row => {
      nuevosProducts.push({
        id: row.id,
        nombre: String(row.nombre || '').trim(),
        familia: String(row.familia || 'SIN FAMILIA').trim(),
        ingActivo: String(row.ingrediente_activo || '').trim(),
        vencido: row.vencido === true,
        minimo: parseFloat(row.minimo_alerta) || 5,
        precio: parseFloat(row.precio_unitario) || 0
      });
      nuevoStockByLoc[row.id] = {
        'Bodega Central':0,'Caseta Cerrillos':0,'Rulo':0,'Paine':0
      };
    });

    stk.forEach(s => {
      const loc = ID_UBIC[s.ubicacion_id];
      if (nuevoStockByLoc[s.producto_id] && loc) {
        nuevoStockByLoc[s.producto_id][loc] = parseFloat(s.cantidad) || 0;
      }
    });

    // ── Movimientos al formato de la app ──
    const nuevosMovimientos = movs.map((m,i) => {
      const prod = prods.find(p => p.id === m.producto_id);
      return {
        id: i+1,
        idRegistro: m.id,
        tipo: String(m.tipo || '').toLowerCase(),
        producto: prod ? prod.nombre : '',
        cantidad: parseFloat(m.cantidad) || 0,
        origen: ID_UBIC[m.origen_id] || '',
        destino: ID_UBIC[m.destino_id] || '',
        usuario: m.usuario || '',
        ordenNum: m.orden_id || '',
        obs: m.observaciones || '',
        fecha: m.fecha ? new Date(m.fecha).toLocaleDateString('es-CL') : '',
        fechaRaw: m.fecha ? isoLocal(new Date(m.fecha)) : '',
        estado: m.estado || 'ACTIVO'
      };
    });

    // ── Ordenes al formato de la app ──
    const nuevasOrdenes = ords.map(o => ({
      idOrden: o.id,
      fecha: o.creado_en ? new Date(o.creado_en).toLocaleDateString('es-CL') : '',
      campo: ID_UBIC[o.campo_id] || '',
      dosificador: o.dosificador || '',
      productos: o.productos_txt || '',
      estado: o.estado || 'EN CURSO',
      usuarioCrea: o.usuario_crea || '',
      usuarioCierra: o.usuario_cierra || '',
      fechaCierre: o.cerrado_en ? new Date(o.cerrado_en).toLocaleDateString('es-CL') : '',
      obs: o.observaciones || '',
      detalle: o.detalle || null
    }));

    products = nuevosProducts;
    stockByLoc = nuevoStockByLoc;
    movimientos = nuevosMovimientos;
    ordenes = nuevasOrdenes;
    compras = ocs;
    materiales = mats;
    materialesMov = matsMov;

    sheetsConnected = true;
    setSyncStatus('on', 'Conectado · ' + products.length + ' productos');
    guardarCacheLocal();
    notificarOrdenesNuevas();
    refresh();

  } catch(e) {
    console.error(e);
    if (products.length) {
      setSyncStatus('off', 'Sin conexion · usando datos ' + edadCacheTexto());
      showToast('No se pudo sincronizar. Mostrando datos guardados.', 'info');
    } else {
      setSyncStatus('off', 'Error de conexion');
      showToast((e.message || 'No se pudo conectar con la base de datos.'), 'err');
    }
  }

  if (btn) btn.disabled = false;
}

// Registra un movimiento usando la funcion transaccional de la base de datos.
// Recibe el MISMO objeto "body" que antes mandaba la app a Sheets, y lo traduce.
async function postSheets(body) {
  try {
    const accion = body.action;

    if (accion === 'entrada') {
      const pid = pidPorNombre(body.producto);
      if (!pid) throw new Error('Producto no encontrado: ' + body.producto);
      const { error } = await sb.rpc('registrar_movimiento', {
        p_tipo:'entrada', p_producto_id:pid, p_cantidad:Number(body.cantidad)||0,
        p_origen_id:null, p_destino_id:UBIC_ID[body.destino], p_usuario:body.usuario||'',
        p_orden_id:null, p_obs:body.obs||''
      });
      if (error) throw error;

    } else if (accion === 'transferencia') {
      const pid = pidPorNombre(body.producto);
      if (!pid) throw new Error('Producto no encontrado: ' + body.producto);
      const { error } = await sb.rpc('registrar_movimiento', {
        p_tipo:'transferencia', p_producto_id:pid, p_cantidad:Number(body.cantidad)||0,
        p_origen_id:UBIC_ID[body.origen], p_destino_id:UBIC_ID[body.destino],
        p_usuario:body.usuario||'', p_orden_id:null, p_obs:body.instrucciones||''
      });
      if (error) throw error;

    } else if (accion === 'devolucion') {
      const pid = pidPorNombre(body.producto);
      if (!pid) throw new Error('Producto no encontrado: ' + body.producto);
      const { error } = await sb.rpc('registrar_movimiento', {
        p_tipo:'devolucion', p_producto_id:pid, p_cantidad:Number(body.cantidad)||0,
        p_origen_id:UBIC_ID[body.origen], p_destino_id:UBIC_ID['Bodega Central'],
        p_usuario:body.usuario||'', p_orden_id:null, p_obs:body.motivo||''
      });
      if (error) throw error;

    } else if (accion === 'perdida') {
      const pid = pidPorNombre(body.producto);
      if (!pid) throw new Error('Producto no encontrado: ' + body.producto);
      const { error } = await sb.rpc('registrar_movimiento', {
        p_tipo:'perdida', p_producto_id:pid, p_cantidad:Number(body.cantidad)||0,
        p_origen_id:UBIC_ID[body.origen], p_destino_id:null,
        p_usuario:body.usuario||'', p_orden_id:null, p_obs:body.motivo||''
      });
      if (error) throw error;

    } else if (accion === 'aplicacion') {
      // body.lineas = [{producto, cantidad}]
      const lineas = body.lineas || [];
      for (const l of lineas) {
        const pid = pidPorNombre(l.producto);
        if (!pid) throw new Error('Producto no encontrado: ' + l.producto);
        const { error } = await sb.rpc('registrar_movimiento', {
          p_tipo:'aplicacion', p_producto_id:pid, p_cantidad:Number(l.cantidad)||0,
          p_origen_id:UBIC_ID[body.campo], p_destino_id:null,
          p_usuario:body.usuario||'', p_orden_id:body.ordenNum||null, p_obs:body.obs||''
        });
        if (error) throw error;
      }

    } else if (accion === 'crearOrden') {
      const { error } = await sb.from('ordenes').insert({
        campo_id: UBIC_ID[body.campo] || null,
        dosificador: body.dosificador || '',
        productos_txt: Array.isArray(body.productos) ? body.productos.join(', ') : (body.productos||''),
        estado: 'EN CURSO',
        usuario_crea: body.usuario || '',
        observaciones: body.obs || '',
        detalle: body.detalle || null
      });
      if (error) throw error;

    } else if (accion === 'cerrarOrden') {
      // Registrar cada linea como aplicacion
      const lineas = body.lineas || [];
      for (const l of lineas) {
        const pid = pidPorNombre(l.producto);
        if (!pid) continue;
        const { error } = await sb.rpc('registrar_movimiento', {
          p_tipo:'aplicacion', p_producto_id:pid, p_cantidad:Number(l.cantidad)||0,
          p_origen_id:UBIC_ID[body.campo], p_destino_id:null,
          p_usuario:body.usuario||'', p_orden_id:body.idOrden||null, p_obs:body.obs||''
        });
        if (error) throw error;
      }
      // Marcar la orden como terminada
      const { error: e2 } = await sb.from('ordenes').update({
        estado:'TERMINADA', usuario_cierra:body.usuario||'',
        cerrado_en:new Date().toISOString(), observaciones:body.obs||''
      }).eq('id', body.idOrden);
      if (e2) throw e2;

    } else if (accion === 'anular') {
      // body.idRegistro = id del movimiento. Revertir su efecto y marcar anulado.
      await anularMovimientoSupabase(body.idRegistro);

    } else if (accion === 'editar') {
      // Editar = anular el viejo y crear uno nuevo con la cantidad corregida.
      await editarMovimientoSupabase(body.idRegistro, body.datos);
    }

    await syncData();
    return true;

  } catch(e) {
    console.error('Error guardando:', e);
    showToast('Error guardando: ' + (e.message || 'desconocido'), 'err');
    return false;
  }
}

// Anula un movimiento usando la funcion de la base de datos (revierte stock, atomico)
async function anularMovimientoSupabase(movId){
  const { error } = await sb.rpc('anular_movimiento', { p_mov_id: Number(movId) });
  if (error) throw error;
}

// Editar = anular el viejo y crear uno nuevo con la cantidad corregida
async function editarMovimientoSupabase(movId, datos){
  const { data: m, error } = await sb.from('movimientos').select('*').eq('id', movId).single();
  if (error) throw error;
  if (!m) throw new Error('Movimiento no encontrado');

  const nuevaCant = Number(datos.CANTIDAD || datos.CANTIDAD_APLICADA || m.cantidad);

  // Primero revertir/anular el original
  await anularMovimientoSupabase(movId);

  // Crear el nuevo con la cantidad corregida, mismo tipo y ubicaciones
  await sb.rpc('registrar_movimiento', {
    p_tipo: m.tipo, p_producto_id: m.producto_id, p_cantidad: nuevaCant,
    p_origen_id: m.origen_id, p_destino_id: m.destino_id,
    p_usuario:'SISTEMA-EDITA', p_orden_id: m.orden_id, p_obs:(m.observaciones||'')+' (editado)'
  });

  // Si es una APLICACIÓN ligada a una orden, actualizar también el real aplicado
  // guardado en el detalle de la orden (de ahí leen el PDF, el panel de gerencia y costos).
  if (String(m.tipo).toLowerCase() === 'aplicacion' && m.orden_id) {
    try {
      const { data: ord, error: eOrd } = await sb.from('ordenes').select('id,detalle').eq('id', m.orden_id).single();
      if (!eOrd && ord && ord.detalle && ord.detalle.infoAplicacion && Array.isArray(ord.detalle.infoAplicacion.realAplicado)) {
        const prodNombre = (products.find(p => p.id === m.producto_id)?.nombre || '').trim();
        const det = ord.detalle;
        const linea = det.infoAplicacion.realAplicado.find(x => String(x.producto).trim() === prodNombre);
        if (linea) {
          const antes = linea.cantidad;
          linea.cantidad = nuevaCant;
          det.auditoria = det.auditoria || [];
          det.auditoria.push({
            accion: 'Real aplicado editado: ' + prodNombre + ' ' + antes + ' → ' + nuevaCant,
            usuario: (typeof curUser !== 'undefined' && curUser) ? curUser.id : 'sistema',
            fecha: new Date().toLocaleString('es-CL')
          });
          const { error: eUp } = await sb.from('ordenes').update({ detalle: det }).eq('id', ord.id);
          if (eUp) console.error('No se pudo actualizar el real de la orden:', eUp);
        }
      }
    } catch(e2) {
      console.error('Edición de movimiento OK, pero falló la actualización del real en la orden:', e2);
    }
  }

  // Si es una recepción de orden de compra, ajustar el "recibido" de la OC por la diferencia
  if (String(m.tipo).toLowerCase() === 'entrada' && /Recepci[oó]n OC/i.test(m.observaciones||'')) {
    try {
      const prodNombre = (products.find(p => p.id === m.producto_id)?.nombre || '').trim();
      const diff = Number(m.cantidad) - nuevaCant; // lo que hay que descontar del recibido
      if (diff !== 0) {
        await revertirRecepcionOC({obs:m.observaciones, producto:prodNombre}, diff);
      }
    } catch(e3) {
      console.error('Edición OK, pero falló el ajuste de la orden de compra:', e3);
    }
  }
}

function selectUser(id) {

function volverUsuarios(){
  selUser = null; pinBuffer=''; updatePinDots();
  document.getElementById('paso-pin').style.display = 'none';
  document.getElementById('paso-usuarios').style.display = 'block';
}

function buildNumpad() {
  const keys = ['1','2','3','4','5','6','7','8','9','empty','0','X'];
  document.getElementById('numpad').innerHTML = keys.map(k=>{
    if(k==='empty') return `<div class="pin-key empty"></div>`;
    return `<button class="pin-key${k==='X'?' del':''}" onclick="pinKey('${k}')">${k==='X'?'&#9003;':k}</button>`;
  }).join('');
}

function pinKey(k) {
  if(k==='X'){ pinBuffer=pinBuffer.slice(0,-1); }
  else if(pinBuffer.length<4){ pinBuffer+=k; }
  updatePinDots();
  if(pinBuffer.length===4) setTimeout(attemptLogin,150);
}

function updatePinDots() {
  for(let i=0;i<4;i++) document.getElementById('d'+i)?.classList.toggle('filled',i<pinBuffer.length);
}

function attemptLogin() {
  if(!selUser) return;
  if(pinBuffer===selUser.pin) {
    curUser = selUser;

    // Señal visual inmediata de PIN correcto: los puntos se ponen verdes
    document.querySelectorAll('.pin-dot').forEach(d=>{d.style.background='#2f7d4f';d.style.borderColor='#2f7d4f';});
    const okMsg=document.getElementById('pin-error');
    if(okMsg){ okMsg.style.color='#2f7d4f'; okMsg.textContent='✓ Ingresando...'; }

    // Pequeña pausa para que se vea el "✓" y luego abrir la app
    setTimeout(()=>{
      document.body.classList.remove('login-activo');
      document.getElementById('sl').classList.remove('active');
      document.getElementById('sa').classList.add('active');
      document.getElementById('topbar-name').textContent = curUser.name;
      document.getElementById('topbar-user').textContent = (curUser.full||'').split('·').slice(1).join('·').trim() || curUser.desc;
      document.getElementById('role-chip').textContent = curUser.desc;
      // Asegurar que la app empiece arriba del todo (no a media página)
      window.scrollTo(0,0);
      document.getElementById('sa').scrollTop = 0;

      // Restaurar el mensaje del PIN para la próxima vez
      if(okMsg){ okMsg.style.color=''; okMsg.textContent=''; }
      document.querySelectorAll('.pin-dot').forEach(d=>{d.style.background='';d.style.borderColor='';});

      // Pedir permiso de notificaciones a los dosificadores
      if(curUser.role==='dosificador' && 'Notification' in window && Notification.permission==='default'){
        setTimeout(()=>Notification.requestPermission(), 1500);
      }

      // 1. Cargar cache local al instante
      const hayCache = cargarCacheLocal();
      buildApp();
      document.getElementById('btn-sync').disabled = false;
      window.scrollTo(0,0);

      if (hayCache) {
        sheetsConnected = true;
        setSyncStatus('on', 'Datos locales (' + edadCacheTexto() + ') · actualizando...');
      } else {
        setSyncStatus('loading', 'Cargando por primera vez...');
      }

      // 2. Sincronizar en segundo plano
      syncData();
      // 3. Tiempo real
      activarTiempoReal();
    }, 280);
  } else {
    document.getElementById('pin-error').textContent = 'PIN incorrecto. Intenta de nuevo.';
    pinBuffer = '';
    updatePinDots();
    setTimeout(()=>{ document.getElementById('pin-error').textContent=''; },2000);
  }
}

function doLogout() {
  curUser=null; selUser=null; pinBuffer='';
  document.body.classList.add('login-activo');
  document.getElementById('sa').classList.remove('active');
  document.getElementById('sl').classList.add('active');
  document.getElementById('paso-pin').style.display='none';
  document.getElementById('paso-usuarios').style.display='block';
  updatePinDots();
  Object.values(chartInst).forEach(c=>{try{c.destroy()}catch(e){}});
  chartInst={};
  setSyncStatus('off','Sin conectar');
  sheetsConnected=false;
}

function buildApp() {
  const tabs = getTabs(curUser.role);
  curTab = 0;
  // Paneles para TODAS las tabs (principales y secundarias)
  document.getElementById('panels-container').innerHTML = tabs.map((t,i)=>`<div class="panel${i===0?' active':''}" id="p-${i}"></div>`).join('');

  // Indices de principales y secundarias
  const prim = tabs.map((t,i)=>({t,i})).filter(x=>x.t.prim);
  const sec  = tabs.map((t,i)=>({t,i})).filter(x=>!x.t.prim);

  let nav = prim.map(({t,i})=>`
    <button class="nav-item${i===0?' active':''}" onclick="switchTab(${i})" aria-label="${t.label}" style="position:relative">
      <span class="nav-icon"><i class="ti ${t.icon}"></i>${t.k==='orden'&&curUser.role==='dosificador'?`<span id="badge-ordenes" style="display:none;position:absolute;top:2px;right:14px;background:#d33;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:16px"></span>`:''}</span>
      <span class="nav-label">${t.label}</span>
    </button>`).join('');

  // Boton "Mas" solo si hay secundarias
  if(sec.length){
    nav += `
    <button class="nav-item" onclick="toggleMenuMas(event)" aria-label="Más">
      <span class="nav-icon"><i class="ti ti-dots"></i></span>
      <span class="nav-label">Más</span>
    </button>`;
  }
  document.getElementById('bottom-nav').innerHTML = nav;

  // Sidebar de escritorio: TODAS las tabs (principales + secundarias), sin botón "Más"
  const sideMenu = document.getElementById('side-menu');
  if(sideMenu){
    sideMenu.innerHTML = tabs.map((t,i)=>`
      <button class="side-item${i===0?' active':''}" id="side-item-${i}" onclick="switchTab(${i})">
        <i class="ti ${t.icon}"></i><span>${t.label}</span>
      </button>`).join('');
  }
  // Datos de usuario en el sidebar
  const av=document.getElementById('side-av'); if(av) av.textContent=(curUser.name||'?')[0];
  const un=document.getElementById('side-uname'); if(un) un.textContent=curUser.name||'';
  const ur=document.getElementById('side-urole'); if(ur) ur.textContent=curUser.desc||'';

  // Menu desplegable de secundarias
  const menuMas = document.getElementById('menu-mas');
  if(sec.length){
    menuMas.innerHTML = `<div class="menu-mas-label">Más opciones</div>` + sec.map(({t,i})=>`
      <button class="menu-mas-item" onclick="switchTab(${i});cerrarMenuMas()">
        <i class="ti ${t.icon}" style="font-size:20px;color:var(--vino);width:24px;text-align:center"></i><span>${t.label}</span>
      </button>`).join('');
  } else {
    menuMas.innerHTML = '';
  }

  renderPanel(0);
}

function toggleMenuMas(e){
  if(e) e.stopPropagation();
  const m = document.getElementById('menu-mas');
  m.style.display = m.style.display==='block' ? 'none' : 'block';
}
function cerrarMenuMas(){
  const m = document.getElementById('menu-mas');
  if(m) m.style.display='none';
}
document.addEventListener('click', (e)=>{
  const m = document.getElementById('menu-mas');
  if(m && m.style.display==='block' && !m.contains(e.target) && !e.target.closest('[onclick*="toggleMenuMas"]')){
    m.style.display='none';
  }
});

function switchTab(i) {
  curTab=i;
  const tabs=getTabs(curUser.role);
  // Marcar activo solo si es principal; si es secundaria, ninguno de la barra se marca
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const prim = tabs.map((t,idx)=>({t,idx})).filter(x=>x.t.prim);
  const posEnBarra = prim.findIndex(x=>x.idx===i);
  if(posEnBarra>=0){
    const botones=document.querySelectorAll('#bottom-nav .nav-item');
    if(botones[posEnBarra]) botones[posEnBarra].classList.add('active');
  }
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));
  // Sidebar de escritorio: marcar el item activo (existe uno por cada tab)
  document.querySelectorAll('.side-item').forEach(b=>b.classList.remove('active'));
  const si=document.getElementById('side-item-'+i);
  if(si) si.classList.add('active');
  document.getElementById('app-scroll').scrollTop=0;
  renderPanel(i);
}

function renderPanel(i) {
  const tabs=getTabs(curUser.role);
  if(!tabs[i]) return;
  const el=document.getElementById('p-'+i);
  if(el){
    el.innerHTML=tabs[i].render();
    if(tabs[i].k==='gerencia') setTimeout(buildCharts,150);
    setTimeout(restaurarBorradores,80);
    if(tabs[i].k==='orden' && (curUser.role==='maestro'||curUser.role==='gerencia')) setTimeout(initOrdenForm,100);
  }
}

// Calcula el siguiente número correlativo según el tipo de orden
// Bases de partida: fitosanitario desde 7, herbicida desde 2
function siguienteCorrelativo(tipo){
  const base = tipo==='herbicida' ? 2 : 7;
  const usados = ordenes
    .filter(o => (o.detalle?.tipo||'fitosanitario') === tipo && String(o.estado||'').toUpperCase()!=='ANULADA')
    .map(o => parseInt(o.detalle?.numeroOrden)).filter(n=>!isNaN(n));
  return usados.length ? Math.max(Math.max(...usados)+1, base) : base;
}

function onTipoOrdenChange(){
  const tipo = document.getElementById('ord-tipo')?.value || 'fitosanitario';
  // Actualizar título grande
  const titulo = document.getElementById('ord-titulo');
  if(titulo) titulo.textContent = tipo==='herbicida' ? 'Aplicación de Herbicidas' : 'Aplicación de Productos Fitosanitarios';
  // Poner el correlativo automático (solo si no fue editado a mano)
  const numEl = document.getElementById('ord-num');
  if(numEl && !numEl.dataset.editado) numEl.value = siguienteCorrelativo(tipo);
}
function marcarNumEditado(){ const e=document.getElementById('ord-num'); if(e) e.dataset.editado='1'; }

document.addEventListener('input', e=>{
  const id = e.target.id;
  if(!/^(ra-|ap-|exa-)/.test(id)) return;
  const val = e.target.type==='checkbox' ? (e.target.checked?'1':'') : e.target.value;
  try{ localStorage.setItem('draft:'+id, val); }catch(_){}
});
document.addEventListener('change', e=>{
  const id = e.target.id;
  if(!/^(ra-|ap-|exa-)/.test(id)) return;
  const val = e.target.type==='checkbox' ? (e.target.checked?'1':'') : e.target.value;
  try{ localStorage.setItem('draft:'+id, val); }catch(_){}
});

function restaurarBorradores(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k || !k.startsWith('draft:')) continue;
      const el = document.getElementById(k.slice(6));
      if(!el) continue;
      const v = localStorage.getItem(k);
      if(el.type==='checkbox'){ el.checked = v==='1'; }
      else if(!el.value){ el.value = v; }
    }
  }catch(_){}
}

function limpiarBorrador(idOrden){
  try{
    const borrar=[];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('draft:') && k.slice(6).split('-').includes(String(idOrden))) borrar.push(k);
    }
    borrar.forEach(k=>localStorage.removeItem(k));
  }catch(_){}
}

function estadoOCb(oc){
  const items=(oc.detalle||[]);
  const tp=items.reduce((s,i)=>s+(+i.pedido||0),0);
  const tr=items.reduce((s,i)=>s+(+i.recibido||0),0);
  if(tr<=0)return 'PENDIENTE'; if(tr>=tp)return 'COMPLETA'; return 'PARCIAL';
}
let cbDesde=null, cbHasta=null;
function renderComprasBodega(){
  const hoyD=new Date(), hace15=new Date(); hace15.setDate(hace15.getDate()-14);
  if(cbDesde===null)cbDesde=isoLocal(hace15);
  if(cbHasta===null)cbHasta=isoLocal(hoyD);

  const pend=compras.filter(o=>estadoOCb(o)!=='COMPLETA');
  const hist=compras.filter(o=>{
    const f=o.fecha||(o.creado_en?isoLocal(new Date(o.creado_en)):'');
    return f>=cbDesde && f<=cbHasta;
  });

  const tag=e=>{const m={'PENDIENTE':['#8a5e00','#fdf3dc','Pendiente'],'PARCIAL':['#1a4a8a','#e8f0fb','Parcial'],'COMPLETA':['#2d6b2d','#e8f5ec','Completa']};const[c,b,t]=m[e]||['#555','#eee',e];return`<span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:11px;color:${c};background:${b}">${t}</span>`;};

  const card=(oc,editable)=>{
    const e=estadoOCb(oc); const items=oc.detalle||[];
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">

      </div>
      <div style="font-size:11.5px;color:var(--tx3);margin-bottom:8px">${(oc.fecha||'').split('-').reverse().join('/')}</div>
      ${items.map((it,idx)=>{
        const falta=(+it.pedido||0)-(+it.recibido||0);
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${it.producto}</div>
            <div style="font-size:11px;color:var(--tx3)">Pedido ${it.pedido} · recibido ${it.recibido||0}${falta>0?` · <b style="color:var(--red)">faltan ${falta}</b>`:' · <b style="color:var(--green)">completo</b>'}</div>
          </div>
          ${editable&&falta>0?`<input type="number" min="0" max="${falta}" id="rc-${oc.id}-${idx}" placeholder="0" style="width:70px;text-align:center;padding:6px;border:1px solid var(--bd2);border-radius:7px" inputmode="decimal">`:''}
        </div>`;
      }).join('')}
      ${editable&&e!=='COMPLETA'?`<button class="btn-primary" style="margin-top:10px" onclick="recibirOC('${oc.id}')">✓ Confirmar lo recibido</button>`:''}
    </div>`;
  };

  return `
  <div class="section-header"><div class="section-title">Compras por recibir</div><div class="section-sub">Suma directo a Bodega Central</div></div>
  ${pend.length?pend.map(o=>card(o,true)).join(''):'<div class="card" style="text-align:center;color:var(--green);font-weight:600">✓ No hay compras pendientes</div>'}

      <div><label style="font-size:11px;color:var(--tx3);font-weight:600;display:block;margin-bottom:3px">Hasta</label><input type="date" id="cb-hasta" value="${cbHasta}" min="${cbDesde}" onchange="cbFechas()" style="font-size:12px;padding:6px"></div>

function cbFechas(){const d=document.getElementById('cb-desde'),h=document.getElementById('cb-hasta');if(d&&d.value)cbDesde=d.value;if(h&&h.value)cbHasta=h.value;if(cbDesde>cbHasta){const t=cbDesde;cbDesde=cbHasta;cbHasta=t;}refresh();}
function cbRango(dias){const hoyD=new Date(),desde=new Date();desde.setDate(desde.getDate()-(dias-1));cbDesde=isoLocal(desde);cbHasta=isoLocal(hoyD);refresh();}

async function recibirOC(ocId){
  const oc=compras.find(o=>String(o.id)===String(ocId));
  if(!oc){showToast('Orden no encontrada','err');return;}
  const items=oc.detalle||[];
  const recibidos=[]; // {idx, cant, producto}
  items.forEach((it,idx)=>{
    const el=document.getElementById('rc-'+ocId+'-'+idx);
    if(!el)return;
    let v=parseFloat(el.value)||0;
    const falta=(+it.pedido||0)-(+it.recibido||0);
    if(v>0){ if(v>falta)v=falta; recibidos.push({idx,cant:v,producto:it.producto}); }
  });
  if(!recibidos.length){showToast('Ingresa al menos una cantidad recibida','err');return;}

  showToast('Registrando recepción...','info');
  try{
    // 1) Sumar stock a Bodega Central + registrar entrada + actualizar precio promedio ponderado
    for(const r of recibidos){
      const prod=products.find(p=>p.nombre===r.producto);
      if(!prod)continue;

      // Precio de este producto en la OC
      const lineaOC=(oc.detalle||[]).find(x=>String(x.producto).trim()===String(r.producto).trim());
      const precioCompra=lineaOC?(+lineaOC.precio||0):0;

      // Promedio ponderado: (stock_actual × precio_actual + cant × precio_compra) / (stock_actual + cant)
      const stockAntes=totalStock(prod.id);
      const precioAntes=(+prod.precio||0);
      if(precioCompra>0){
        const valorAntes=stockAntes*precioAntes;
        const valorNuevo=r.cant*precioCompra;
        const stockDespues=stockAntes+r.cant;
        const precioProm=stockDespues>0?((valorAntes+valorNuevo)/stockDespues):precioCompra;
        // Guardar en la base y en memoria (redondeado a 2 decimales)
        const precioFinal=Math.round(precioProm*100)/100;
        try{
          await sb.from('productos').update({precio_unitario:precioFinal}).eq('id',prod.id);
          prod.precio=precioFinal;
        }catch(ep){ console.error('No se pudo actualizar el precio promedio:',ep); }
      }

      addStock(prod.id,'Bodega Central',r.cant);
      await postSheets({action:'entrada',fecha:hoy(),producto:r.producto,cantidad:r.cant,destino:'Bodega Central',proveedor:oc.proveedor,factura:('OC '+(oc.numero_oc||oc.id)),usuario:curUser.id,obs:'Recepción OC '+(oc.numero_oc||oc.id)});
      oc.detalle[r.idx].recibido=(+oc.detalle[r.idx].recibido||0)+r.cant;
    }
    // 2) Actualizar la orden de compra (detalle + estado)
    const nuevoEstado=estadoOCb(oc);
    const { error } = await sb.from('ordenes_compra').update({detalle:oc.detalle,estado:nuevoEstado}).eq('id',oc.id);
    if(error)throw error;
    showToast(nuevoEstado==='COMPLETA'?'✓ Compra completa. Stock y precio actualizados.':'Recepción parcial guardada. Queda pendiente el resto.');
    refresh();
  }catch(e){
    console.error(e);
    showToast('Error al recibir: '+(e.message||''),'err');
  }
}

function exportarMaterialesExcel(){
  if(typeof XLSX==='undefined'){ showToast('La librería Excel no cargó','err'); return; }
  if(!materiales.length){ showToast('No hay materiales para exportar','err'); return; }
  // Hoja 1: catálogo actual
  const cat = materiales.map(m=>({
    'Material':m.nombre, 'Categoría':m.categoria||'Otros', 'Unidad':m.unidad,
    'Cantidad':m.cantidad, 'Mínimo':m.minimo||0,
    'Estado': m.cantidad<=0?'Agotado':(m.minimo>0&&m.cantidad<=m.minimo?'Stock bajo':'En stock')
  }));
  // Hoja 2: movimientos
  const movs = materialesMov.map(mv=>({
    'Fecha': mv.fecha?new Date(mv.fecha).toLocaleString('es-CL'):'',
    'Material': mv.material_nom||'',
    'Tipo': mv.tipo==='entrada'?'Entrada':'Salida',
    'Cantidad': mv.cantidad,
    'Motivo/Referencia': mv.motivo||'',
    'Usuario': mv.usuario||''
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cat), 'Materiales');
  if(movs.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movs), 'Movimientos');
  XLSX.writeFile(wb, 'Materiales_San_Jose_'+isoLocal(new Date())+'.xlsx');
  showToast('Excel generado');
}

async function guardarEdicionMaterial(matId){
  const m = materiales.find(x=>String(x.id)===String(matId));
  if(!m) return;
  const nombre = (document.getElementById('nm-nombre').value||'').trim();
  if(!nombre){ showToast('El nombre no puede quedar vacío','err'); return; }
  const nuevaCant = parseFloat(document.getElementById('nm-cant').value);
  const cantFinal = isNaN(nuevaCant) ? m.cantidad : nuevaCant;
  const huboAjuste = cantFinal !== m.cantidad;
  document.getElementById('modal-material').remove();
  showToast('Guardando cambios...','info');
  try{
    const { error } = await sb.from('materiales').update({
      nombre, categoria:window._nmCat||'Otros', unidad:window._nmUni||'unidad', cantidad:cantFinal
    }).eq('id',m.id);
    if(error) throw error;
    // Si cambió la cantidad, dejar rastro en el historial
    if(huboAjuste){
      const dif = cantFinal - m.cantidad;
      await sb.from('materiales_mov').insert({
        material_id:m.id, material_nom:nombre, tipo: dif>=0?'entrada':'salida',
        cantidad:Math.abs(dif), motivo:'Corrección de inventario', usuario:curUser.id
      });
    }
    showToast('Material actualizado');
    await syncData();
  }catch(e){
    showToast('Error: '+(e.message||''),'err');
  }
}

async function eliminarMaterial(matId){
  const m = materiales.find(x=>String(x.id)===String(matId));
  if(!m) return;
  if(!confirm('¿Eliminar "'+m.nombre+'"?\n\nEsto quita el material del catálogo. Su historial de movimientos se conserva.')) return;

}

async function movMaterial(matId, tipo){
  const m = materiales.find(x=>String(x.id)===String(matId));
  if(!m) return;
  const verbo = tipo==='entrada'?'ingresar':'sacar';
  const txt = prompt(`¿Cuánto ${verbo} de ${m.nombre}? (en ${m.unidad})`);
  if(txt===null) return;
  const cant = parseFloat(txt)||0;
  if(cant<=0){ showToast('Cantidad inválida','err'); return; }
  if(tipo==='salida' && cant>m.cantidad){ showToast('No puedes sacar más de lo que hay ('+fmt(m.cantidad)+' '+m.unidad+')','err'); return; }
  const motivo = tipo==='salida' ? (prompt('¿Para qué o para quién? (opcional)')||'') : (prompt('Proveedor / referencia (opcional)')||'');

  const nuevaCant = tipo==='entrada' ? m.cantidad+cant : m.cantidad-cant;
  showToast('Guardando...','info');
  try{
    const { error: e1 } = await sb.from('materiales').update({cantidad:nuevaCant}).eq('id',m.id);
    if(e1) throw e1;
    const { error: e2 } = await sb.from('materiales_mov').insert({
      material_id:m.id, material_nom:m.nombre, tipo, cantidad:cant, motivo, usuario:curUser.id
    });
    if(e2) throw e2;
    m.cantidad = nuevaCant; // reflejar en memoria
    showToast((tipo==='entrada'?'+':'-')+cant+' '+m.unidad+' · '+m.nombre);
    await syncData();
  }catch(e){
    showToast('Error: '+(e.message||''),'err');
  }
}

function updRecibir(){
  const pid=parseInt(document.getElementById('r-p')?.value);
  const loc=document.getElementById('r-loc')?.value;
  const cant=parseFloat(document.getElementById('r-c')?.value)||0;
  const el=document.getElementById('r-av');
  if(!el)return;
  if(!pid||!loc){el.className='form-avail';el.textContent='Elige producto y cantidad';return;}
  const actual=stockAt(pid,loc);
  if(cant>0){
    el.className='form-avail';
    el.textContent=`En ${loc}: ${fmt(actual)} → quedará ${fmt(actual+cant)}`;
  }else{
    el.className='form-avail';
    el.textContent=`En ${loc} hay actualmente ${fmt(actual)}`;
  }
}
// Promedio de entradas previas de un producto (para detectar cantidad anómala)
function promedioEntradas(nombre){
  const ents=movimientos.filter(m=>m.tipo==='entrada'&&m.producto===nombre&&m.cantidad>0).map(m=>m.cantidad);
  if(ents.length<2)return null;
  return ents.reduce((a,b)=>a+b,0)/ents.length;
}
async function doRecibir(){
  const pid=parseInt(document.getElementById('r-p').value);
  const cant=parseFloat(document.getElementById('r-c').value)||0;
  const loc=document.getElementById('r-loc').value;
  const p=products.find(x=>x.id===pid);
  // Validaciones de cantidad
  if(!p) return showToast('Elige un producto','err');
  if(isNaN(cant)||cant<=0) return showToast('Ingresa una cantidad válida (mayor a 0)','err');
  if(cant>100000) return showToast('Cantidad demasiado alta, revisa el valor','err');
  // ¿Cantidad anómala vs historial? (posible cero de más)
  const prom=promedioEntradas(p.nombre);
  if(prom&&cant>prom*10){
    const ok=confirm('⚠️ Cantidad inusual\n\nVas a ingresar '+fmt(cant)+' de '+p.nombre+'.\nNormalmente recibes alrededor de '+fmt(Math.round(prom))+'.\n\n¿El valor es correcto?');
    if(!ok){ showToast('Entrada cancelada, corrige la cantidad','info'); return; }
  }
  if(!bloquearAccion('recibir')){ return; } // evita doble envío
  try{
    addStock(pid,loc,cant);
    const mov={id:nextMov++,tipo:'entrada',producto:p.nombre,cantidad:cant,destino:loc,proveedor:document.getElementById('r-pv').value.trim(),obs:document.getElementById('r-f').value.trim(),fecha:hoy(),usuario:curUser.id};
    movimientos.push(mov);
    showToast('Guardando...','info');
    const ok=await postSheets({action:'entrada',fecha:mov.fecha,producto:p.nombre,cantidad:cant,destino:loc,proveedor:mov.proveedor,factura:mov.obs,usuario:curUser.id,obs:mov.obs});
    if(!ok){ showToast('No se pudo guardar. Revisa tu conexión y reintenta.','err'); return; }
    showToast('+'+cant+' de '+p.nombre+' guardado');
    refresh();
  } finally {
    liberarAccion('recibir');
  }
}

async function doTransferir(){
  const origen = document.getElementById('t-or').value;
  const dest = document.getElementById('t-dst').value;

  if(origen === dest) {
    return showToast('Origen y destino deben ser distintos', 'err');
  }

  const lineas = [];

  document.querySelectorAll('[id^="tr-prod-"]').forEach(sel => {
    const idx = sel.id.replace('tr-prod-', '');
    const pid = parseInt(sel.value);
    const cant = parseFloat(document.getElementById('tr-cant-' + idx)?.value || 0);

    if(pid && cant > 0){
      const p = products.find(x => x.id === pid);
      if(p){
        lineas.push({
          pid: pid,
          producto: p.nombre,
          cantidad: cant
        });
      }
    }
  });

  if(!lineas.length) {
    return showToast('Agrega al menos un producto con cantidad', 'err');
  }

  for(const l of lineas){
    const disp = stockAt(l.pid, origen);

    if(l.cantidad > disp){
      return showToast(
        'Insuficiente en ' + origen + ' para ' + l.producto +
        '. Disponible: ' + fmt(disp) +
        ', ingresado: ' + fmt(l.cantidad),
        'err'
      );
    }
  }

  // Aviso: transferencias que vacían casi todo el stock (posible dedo pegado)
  const sospechosas = lineas.filter(l => {
    const disp = stockAt(l.pid, origen);
    return disp > 0 && l.cantidad >= disp * 0.9 && l.cantidad !== disp;
  });
  if(sospechosas.length){
    const txt = sospechosas.map(l=>'• '+l.producto+': mueves '+fmt(l.cantidad)+' de '+fmt(stockAt(l.pid,origen))+' disponibles').join('\n');
    const ok = confirm('⚠️ Vas a transferir casi todo el stock de:\n\n'+txt+'\n\n¿Es correcto?');
    if(!ok){ showToast('Transferencia cancelada, revisa las cantidades','info'); return; }
  }

  if(!bloquearAccion('transferir')){ return; } // evita doble envío
  showToast('Guardando transferencias...', 'info');

  let _falloTransfer = false;
  for(const l of lineas){
    addStock(l.pid, origen, -l.cantidad);
    addStock(l.pid, dest, l.cantidad);

    movimientos.push({
      id: nextMov++,
      tipo: 'transferencia',
      producto: l.producto,
      cantidad: l.cantidad,
      origen: origen,
      destino: dest,
      fecha: hoy(),
      usuario: curUser.id
    });

    const okTr=await postSheets({
      action: 'transferencia',
      fecha: hoy(),
      producto: l.producto,
      cantidad: l.cantidad,
      origen: origen,
      destino: dest,
      usuario: curUser.id,
      instrucciones: ''
    });
    if(!okTr){ _falloTransfer = true; }
  }
  if(_falloTransfer){
    liberarAccion('transferir');
    showToast('Algún producto no se guardó. Revisa tu conexión y el historial.','err');
    await syncData();
    return;
  }

  // Alerta: productos movidos que NO tienen ninguna orden de aplicación pendiente
  try{
    const productosConOrden = new Set();
    ordenes.forEach(o=>{
      const est = String(o.estado||'').toUpperCase();
      if(est==='EN CURSO' || est==='INICIADA'){
        (o.detalle?.productos||[]).forEach(p=>{ if(p&&p.nombre) productosConOrden.add(p.nombre.trim()); });
      }
    });

    // AVISO (nuevo): UN SOLO correo con todos los productos del despacho
    const itemsAviso = lineas.map(l=>({ producto:l.producto, cantidad:fmt(l.cantidad) }));
    fetch('https://cmfvnluppvqyqwpfjrbs.supabase.co/functions/v1/via-despacho', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer '+SUPABASE_KEY
      },
      body: JSON.stringify({
        tipo: 'despacho',
        items: itemsAviso,
        origen: origen,
        destino: dest,
        usuario: curUser.name || curUser.id,
        fecha: hoy()
      })
    }).then(r=>r.json()).then(d=>console.log('via-despacho:',d)).catch(e=>console.error('via-despacho ERROR:',e));

    // ALERTA (existente): solo a gerencia, los productos SIN orden pendiente, en un solo correo
    const sinOrden = lineas.filter(l=>!productosConOrden.has(l.producto.trim()));
    if(sinOrden.length){
      fetch('https://cmfvnluppvqyqwpfjrbs.supabase.co/functions/v1/alerta-despacho', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer '+SUPABASE_KEY
        },
        body: JSON.stringify({
          items: sinOrden.map(l=>({producto:l.producto, cantidad:fmt(l.cantidad)})),
          origen: origen,
          destino: dest,
          usuario: curUser.name || curUser.id,
          fecha: hoy()
        })
      }).catch(()=>{});
    }
  }catch(_){ /* la alerta nunca debe romper la transferencia */ }

  liberarAccion('transferir');
  showToast('Transferencia guardada correctamente');
  await syncData();
}

async function doDevolucion(){
  const pid=parseInt(document.getElementById('dv-p').value);
  const cant=parseFloat(document.getElementById('dv-c').value)||0;
  const origen=document.getElementById('dv-or').value;
  const obs=document.getElementById('dv-obs').value.trim();
  if(cant<=0) return showToast('Ingresa una cantidad valida','err');
  const disp=stockAt(pid,origen);
  if(cant>disp) return showToast('Insuficiente en '+origen+': '+fmt(disp)+' disp.','err');
  const p=products.find(x=>x.id===pid);
  if(!bloquearAccion('devolucion')){ return; } // evita doble envío
  addStock(pid,origen,-cant); addStock(pid,'Bodega Central',cant);
  movimientos.push({id:nextMov++,tipo:'devolucion',producto:p.nombre,cantidad:cant,origen,destino:'Bodega Central',obs,fecha:hoy(),usuario:curUser.id});
  showToast('Guardando...','info');
  const okDev=await postSheets({action:'devolucion',fecha:hoy(),producto:p.nombre,cantidad:cant,origen,usuario:curUser.id,motivo:obs});
  if(!okDev){ liberarAccion('devolucion'); showToast('No se pudo guardar la devolución. Revisa tu conexión y reintenta.','err'); return; }
  // Aviso por correo: devolución -> Freddy + dosificador que devuelve (según origen)
  fetch('https://cmfvnluppvqyqwpfjrbs.supabase.co/functions/v1/via-despacho', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer '+SUPABASE_KEY
    },
    body: JSON.stringify({
      tipo: 'devolucion',
      items: [{ producto:p.nombre, cantidad:fmt(cant) }],
      origen: origen,
      destino: 'Bodega Central',
      usuario: curUser.name || curUser.id,
      fecha: hoy()
    })
  }).then(r=>r.json()).then(d=>console.log('via-devolucion:',d)).catch(e=>console.error('via-devolucion ERROR:',e));
  liberarAccion('devolucion');
  showToast('Devuelto '+cant+' de '+p.nombre+' a Bodega');
  refresh();
}

async function doPerdida(){
  const pid=parseInt(document.getElementById('pr-p').value);
  const cant=parseFloat(document.getElementById('pr-c').value)||0;
  const ubic=document.getElementById('pr-ub').value;
  const motivo=document.getElementById('pr-motivo').value;
  const obs=document.getElementById('pr-obs').value.trim();
  if(cant<=0) return showToast('Ingresa una cantidad válida','err');
  if(!motivo) return showToast('Elige el motivo de la pérdida','err');
  const disp=stockAt(pid,ubic);
  if(cant>disp) return showToast('Insuficiente en '+ubic+': '+fmt(disp)+' disp.','err');
  const p=products.find(x=>x.id===pid);
  const costo=cant*(p.precio||0);
  if(!confirm(`Vas a registrar como PÉRDIDA:\n\n${p.nombre}: ${cant} (${motivo})\nUbicación: ${ubic}\nValor: ${plata(costo)}\n\nEsto DESCONTARÁ el stock. ¿Confirmar?`)) return;
  addStock(pid,ubic,-cant);
  movimientos.push({id:nextMov++,tipo:'perdida',producto:p.nombre,cantidad:cant,origen:ubic,destino:'',obs:motivo+(obs?' · '+obs:''),fecha:hoy(),usuario:curUser.id});
  showToast('Guardando...','info');
  const okPer=await postSheets({action:'perdida',fecha:hoy(),producto:p.nombre,cantidad:cant,origen:ubic,usuario:curUser.id,motivo:motivo+(obs?' · '+obs:'')});
  if(!okPer){ showToast('No se pudo guardar. Revisa tu conexión y reintenta.','err'); return; }
  showToast('Pérdida registrada: '+cant+' de '+p.nombre);
  refresh();
}
