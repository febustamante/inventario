<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>San Jose Inventario</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --vino:#7B2D2D;--vino2:#5e2121;--vino3:#9d3b3b;
  --vino-glow:rgba(123,45,45,.15);--gold:#C4933F;
  --bg:#f7f3f0;--surf:#fff;--surf2:#faf7f5;--surf3:#f2ece8;
  --bd:#e8ddd8;--bd2:#d4c4bc;
  --tx:#1a0f0f;--tx2:#6b4f4f;--tx3:#a8908a;
  --green:#2d6b2d;--green-bg:#e8f5e8;
  --amber:#8a5e00;--amber-bg:#fff3d4;
  --red:#8a1a1a;--red-bg:#fce8e8;
  --blue:#1a4a8a;--blue-bg:#e8f0fc;
  --purple:#9d6b4f;--purple-bg:#f3eae3;
  --r:10px;--rl:16px;--rx:20px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(123,45,45,.06);
  --shadow-lg:0 4px 24px rgba(0,0,0,.12),0 12px 40px rgba(123,45,45,.1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html{height:100%;background:var(--vino)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;min-height:100%;overflow-x:hidden}
input,select,textarea,button{font-family:'Inter',system-ui,sans-serif;font-size:16px}

.screen{display:none;min-height:100vh}.screen.active{display:block}

/* LOGIN */
#sl{height:100vh;height:100dvh;overflow:hidden;background:#f3eee9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 1rem) 1.25rem 1rem}
.login-box{background:var(--surf);border:1px solid #e8e0d8;border-radius:18px;padding:1.5rem 1.5rem;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(110,40,40,.08);max-height:100%;overflow-y:auto}
.login-logo{display:block;width:190px;max-width:68%;margin:0 auto 1rem}
.login-welcome{font-size:20px;font-weight:600;color:var(--tx);text-align:center}
.login-sub{font-size:13px;color:var(--tx3);text-align:center;margin-bottom:1rem}
.user-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;border:1px solid #e8e0d8;background:var(--surf);cursor:pointer;width:100%;margin-bottom:7px;text-align:left;transition:all .15s;min-height:52px}
.user-btn:active,.user-btn:hover{border-color:var(--vino);background:var(--vino-glow)}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;color:#fff}
.av-m{background:var(--vino)}
.av-b{background:#3d5a80}
.av-d{background:#2d6b3a}
.av-g{background:var(--gold)}
.user-name{font-size:14px;font-weight:600;color:var(--tx)}
.user-desc{font-size:12px;color:var(--tx3);margin-top:1px}
.user-arrow{margin-left:auto;color:#cbbfb5;font-size:18px}
.pin-header{text-align:center;margin-bottom:1rem}
.pin-avatar{width:50px;height:50px;border-radius:50%;background:var(--vino);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;margin:0 auto 6px}
.pin-username{font-size:16px;font-weight:600;color:var(--tx)}
.pin-userrole{font-size:12px;color:var(--tx3)}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:.6rem}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--bd2);background:transparent;transition:all .2s}
.pin-dot.filled{background:var(--vino);border-color:var(--vino);transform:scale(1.1)}
.pin-numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:.75rem;max-width:270px;margin-left:auto;margin-right:auto}
.pin-key{padding:13px;border-radius:11px;border:1px solid #ece6e0;background:#f9f6f3;font-size:19px;font-weight:500;cursor:pointer;text-align:center;color:var(--tx);transition:all .1s;min-height:50px;display:flex;align-items:center;justify-content:center}
.pin-key:active{background:var(--vino-glow);border-color:var(--vino);transform:scale(.96)}
.pin-key.del{font-size:18px;color:var(--tx2);background:transparent;border-color:transparent}
.pin-key.empty{background:transparent;border:none;cursor:default}
.pin-error{font-size:13px;color:var(--red);text-align:center;min-height:18px;font-weight:500;margin-bottom:.4rem}
.pin-volver{display:block;margin:0 auto;background:none;border:none;color:var(--tx3);font-size:12px;cursor:pointer;padding:6px}
.topbar-logo{height:30px;width:auto;background:#fff;padding:3px 6px;border-radius:6px}



/* APP */
#sa{display:none;flex-direction:column;height:100vh;max-height:100vh;overflow:hidden}
#sa.active{display:flex}
.topbar{background:var(--vino);padding:calc(var(--safe-t) + .75rem) 1rem .75rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-grape{font-size:22px;color:rgba(255,255,255,.9)}
.topbar-name{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.3px}
.topbar-user{font-size:11px;color:rgba(255,255,255,.6);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:8px}
.role-chip{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-out{padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer;font-weight:500;min-height:34px}
.btn-out:active{background:rgba(255,255,255,.2)}

/* SYNC BAR */
.sync-bar{background:#1a2a1a;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;border-bottom:1px solid #2a4a2a}
.sync-status{display:flex;align-items:center;gap:8px;font-size:12px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#e74c3c;flex-shrink:0;transition:background .3s}
.sync-dot.on{background:#2ecc71}
.sync-dot.loading{background:#f39c12;animation:pulse 1s infinite}
.sync-txt{color:#aaa}
.sync-txt.on{color:#2ecc71}
.btn-sync{padding:5px 12px;border-radius:6px;border:1px solid #2ecc71;background:transparent;color:#2ecc71;font-size:11px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn-sync:active{background:#2ecc7120}
.btn-sync:disabled{opacity:.4;cursor:not-allowed}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.app-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1rem calc(80px + var(--safe-b)) 1rem}
.panel{display:none}.panel.active{display:block}

.bottom-nav{background:var(--surf);border-top:1px solid var(--bd);padding:6px 0 calc(6px + var(--safe-b));display:flex;flex-shrink:0;position:relative;z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;cursor:pointer;border:none;background:transparent;color:var(--tx3);min-height:52px;position:relative;transition:color .15s}
.nav-item:active{background:var(--surf3)}
.nav-item.active{color:var(--vino)}
.nav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--vino);border-radius:0 0 3px 3px}
.nav-icon{font-size:22px;line-height:1;transition:transform .15s}
.nav-item.active .nav-icon{transform:scale(1.1)}
.menu-mas{display:none;position:fixed;bottom:calc(60px + var(--safe-b));right:12px;background:var(--surf);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:6px;z-index:200;min-width:190px}
.menu-mas-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px 4px}
.menu-mas-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:none;background:transparent;color:var(--tx);font-size:14px;text-align:left;cursor:pointer;border-radius:9px}
.menu-mas-item:active,.menu-mas-item:hover{background:var(--vino-glow);color:var(--vino)}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}

.section-header{margin-bottom:1rem}
.section-title{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.3px}
.section-sub{font-size:13px;color:var(--tx3);margin-top:2px}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.25rem}
.stat-card{background:var(--surf);border-radius:var(--rl);padding:1rem;box-shadow:var(--shadow);border:1px solid var(--bd)}
.stat-icon{font-size:20px;margin-bottom:6px}
.stat-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin-bottom:4px}
.stat-value{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.5px}
.sv-vino{color:var(--vino)}.sv-green{color:var(--green)}.sv-amber{color:var(--amber)}.sv-red{color:var(--red)}.sv-blue{color:var(--blue)}.sv-purple{color:var(--purple)}

.loc-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1.25rem}
.loc-card{background:var(--surf);border-radius:var(--r);padding:.875rem 1rem;box-shadow:var(--shadow);border:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.loc-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.loc-name{font-size:11px;font-weight:500;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
.loc-val{font-size:18px;font-weight:700;color:var(--tx);letter-spacing:-.3px}

.card{background:var(--surf);border-radius:var(--rl);border:1px solid var(--bd);box-shadow:var(--shadow);overflow:hidden;margin-bottom:1rem}
.card-header{padding:12px 14px;background:var(--surf2);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-title{font-size:13px;font-weight:600;color:var(--vino);display:flex;align-items:center;gap:6px}

.prod-item{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.prod-item:last-child{border-bottom:none}
.prod-item:active{background:var(--surf2)}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:14px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2item{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--bd)}
.v2item:last-child{border-bottom:none}
.v2name{font-size:15px;font-weight:500;color:var(--tx)}
.v2fam{font-size:12px;color:var(--tx3);margin-top:2px}
.v2qty{font-size:17px;font-weight:600;color:var(--tx)}
.prod-fam{font-size:11px;color:var(--tx3);margin-top:1px}
.prod-stocks{display:flex;gap:6px;align-items:center;flex-shrink:0}
.prod-total{font-size:16px;font-weight:700;color:var(--tx);min-width:40px;text-align:right}

.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--green-bg);color:var(--green)}
.b-low{background:var(--amber-bg);color:var(--amber)}
.b-out{background:var(--red-bg);color:var(--red)}
.b-venc{background:var(--purple-bg);color:var(--purple)}
.b-info{background:var(--blue-bg);color:var(--blue)}

.search-wrap{position:relative;margin-bottom:10px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:16px;pointer-events:none}
.search-input{width:100%;padding:12px 12px 12px 38px;border:1.5px solid var(--bd2);border-radius:var(--r);background:var(--surf);color:var(--tx);font-size:15px;outline:none}
.search-input:focus{border-color:var(--vino)}
.filter-row{display:flex;gap:8px;margin-bottom:1rem;overflow-x:auto;padding-bottom:2px}
.filter-chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--bd2);background:var(--surf);color:var(--tx2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
.filter-chip.active{background:var(--vino);color:#fff;border-color:var(--vino)}

.form-box{background:var(--surf);border-radius:var(--rl);padding:1.25rem;box-shadow:var(--shadow);border:1px solid var(--bd);margin-bottom:1rem}
.form-title{font-size:16px;font-weight:600;color:var(--tx);margin-bottom:1.25rem;display:flex;align-items:center;gap:8px}
.form-title-icon{width:32px;height:32px;border-radius:8px;background:var(--vino-glow);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.form-group{margin-bottom:12px}
.form-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);display:block;margin-bottom:6px}
.required{color:var(--red)}
.form-control{width:100%;padding:13px 14px;border:1.5px solid var(--bd2);border-radius:var(--r);background:var(--surf3);color:var(--tx);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
.form-control:focus{border-color:var(--vino);box-shadow:0 0 0 3px var(--vino-glow);background:var(--surf)}
.form-control::placeholder{color:var(--tx3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-avail{font-size:13px;color:var(--green);font-weight:500;margin-top:4px}
.form-avail.warn{color:var(--amber)}
.form-avail.err{color:var(--red)}

.btn-primary{width:100%;padding:16px;border-radius:var(--r);border:none;background:var(--vino);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:1rem;box-shadow:0 4px 12px rgba(123,45,45,.3);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.btn-primary:active{background:var(--vino2);transform:scale(.98)}
.btn-sec{padding:10px 16px;border-radius:var(--r);border:1.5px solid var(--bd2);background:var(--surf);color:var(--tx2);font-size:14px;font-weight:500;cursor:pointer}
.btn-sec:active{background:var(--surf3)}

.orden-line{background:var(--surf3);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr 90px 36px;gap:8px;align-items:center}
.orden-line select,.orden-line input{padding:10px;border:1.5px solid var(--bd2);border-radius:8px;background:var(--surf);color:var(--tx);font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
.orden-line select:focus,.orden-line input:focus{border-color:var(--vino)}

.orden-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--rl);padding:1rem;margin-bottom:10px;box-shadow:var(--shadow)}
.orden-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.75rem}
.ord-tabla{width:100%;border-collapse:collapse;font-size:11px}
.ord-tabla th{background:var(--vino);color:#fff;padding:5px 4px;text-align:center;font-size:10px;font-weight:600;line-height:1.1;border:1px solid #6a2525}
.ord-tabla td{padding:3px;border:1px solid var(--bd);text-align:center;vertical-align:middle}
.ord-tabla input,.ord-tabla select{width:100%;padding:5px 4px;border:1px solid var(--bd2);border-radius:5px;font-size:11px;background:var(--surf);color:var(--tx);outline:none;-webkit-appearance:none;appearance:none}
.ord-tabla input:focus,.ord-tabla select:focus{border-color:var(--vino)}
.ord-tabla .calc-cell{font-weight:700;color:var(--vino);background:var(--surf2)}
.ord-tabla .del-btn{padding:3px 7px;border:1px solid var(--bd2);border-radius:5px;background:var(--surf2);color:var(--tx2);font-size:11px;cursor:pointer}
.orden-num-badge{background:var(--vino);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.orden-date{font-size:12px;color:var(--tx3)}
.orden-campo-chip{display:inline-flex;align-items:center;gap:4px;background:var(--vino-glow);color:var(--vino);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;margin-bottom:.5rem}
.orden-prod-line{font-size:13px;color:var(--tx2);padding:3px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px}
.orden-prod-line:last-child{border-bottom:none}
.orden-prod-qty{font-weight:600;color:var(--tx);min-width:30px}

.move-item{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px}
.move-item:last-child{border-bottom:none}
.move-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.move-body{flex:1;min-width:0}
.move-prod{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.move-detail{font-size:11px;color:var(--tx3);margin-top:1px}
.move-right{text-align:right;flex-shrink:0}
.move-qty{font-size:14px;font-weight:600}
.move-date{font-size:10px;color:var(--tx3);margin-top:2px}

.alert-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);margin-bottom:6px;border:1px solid}
.alert-item.crit{background:var(--red-bg);border-color:#f0a0a0;color:var(--red)}
.alert-item.warn{background:var(--amber-bg);border-color:#f0c878;color:var(--amber)}

.chart-container{padding:1rem;position:relative}
.chart-wrap{position:relative;width:100%;height:200px}
.chart-wrap-sm{position:relative;width:100%;height:160px}

.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1rem}
.kpi-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--rl);padding:1rem;box-shadow:var(--shadow)}
.kpi-icon{font-size:20px;margin-bottom:.5rem}
.kpi-val{font-size:24px;font-weight:700;letter-spacing:-.5px}
.kpi-label{font-size:11px;color:var(--tx3);margin-top:2px}

#toast{position:fixed;bottom:calc(72px + var(--safe-b));left:1rem;right:1rem;padding:14px 16px;border-radius:var(--r);font-size:14px;font-weight:500;z-index:9999;display:none;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.2)}
#toast.ok{background:var(--green-bg);border:1.5px solid #78b878;color:var(--green)}
#toast.err{background:var(--red-bg);border:1.5px solid #e07070;color:var(--red)}
#toast.info{background:var(--blue-bg);border:1.5px solid #78a0e0;color:var(--blue)}

.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--tx3)}
.empty-icon{font-size:40px;margin-bottom:.75rem;opacity:.4}
.empty-text{font-size:14px}
.divider{height:1px;background:var(--bd);margin:1rem 0}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:.75rem}

/* LOADING OVERLAY */
.loading-overlay{position:fixed;inset:0;background:rgba(123,45,45,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
.loading-spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.loading-text{color:#fff;font-size:14px;font-weight:500}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="sl" class="screen active">

// ── CACHE LOCAL (carga instantanea, sin esperar a Sheets) ──
const CACHE_KEY = 'sanjose_cache_v1';

function guardarCacheLocal() {
  try {
    const payload = {
      products,
      stockByLoc,
      movimientos,
      ordenes,
      guardadoEn: Date.now()
    };
    localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
  } catch (e) {
    console.warn('No se pudo guardar cache local:', e);
  }
}

function cargarCacheLocal() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return false;
    const payload = JSON.parse(raw);
    products    = payload.products    || [];
    stockByLoc  = payload.stockByLoc   || {};
    movimientos = payload.movimientos  || [];
    ordenes     = payload.ordenes      || [];
    return products.length > 0;
  } catch (e) {
    console.warn('No se pudo leer cache local:', e);
    return false;
  }
}

function edadCacheTexto() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return '';
    const payload = JSON.parse(raw);
    const segs = Math.floor((Date.now() - payload.guardadoEn) / 1000);
    if (segs < 60) return 'hace ' + segs + 's';
    const mins = Math.floor(segs / 60);
    if (mins < 60) return 'hace ' + mins + ' min';
    const horas = Math.floor(mins / 60);
    return 'hace ' + horas + ' h';
  } catch (e) {
    return '';
  }
}

// ── HELPERS ──
function totalStock(pid){return Object.values(stockByLoc[pid]||{}).reduce((a,b)=>a+b,0)}
function stockAt(pid,loc){return(stockByLoc[pid]||{})[loc]||0}
function addStock(pid,loc,delta){
  if(!stockByLoc[pid])stockByLoc[pid]={};
  stockByLoc[pid][loc]=(stockByLoc[pid][loc]||0)+delta;
  if(stockByLoc[pid][loc]<0)stockByLoc[pid][loc]=0;
}
function statusOf(pid){
  const p=products.find(x=>x.id===pid);
  if(!p)return['?',''];
  if(p.vencido)return['Vencido','b-venc'];
  const t=totalStock(pid);
  if(t<=0)return['Agotado','b-out'];
  if(t<=p.minimo)return['Stock bajo','b-low'];
  return['En stock','b-ok'];
}
function fmt(n){return parseFloat(parseFloat(n||0).toFixed(2))}
// Formato plata chileno: $1.234.567
function plata(n){return '$'+Math.round(n||0).toLocaleString('es-CL')}
// Valor del stock total de un producto (todas las ubicaciones)
function valorProducto(pid){const p=products.find(x=>x.id===pid);return p?totalStock(pid)*(p.precio||0):0}
// Valor total del inventario
function valorInventario(){return products.reduce((s,p)=>s+totalStock(p.id)*(p.precio||0),0)}
function hoy(){return new Date().toLocaleDateString('es-CL')}
function prodOpts(){return products.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('')}
function locOpts(def){return LOCS.map(l=>`<option${l===def?' selected':''}>${l}</option>`).join('')}
function fieldLocsExclude(ex,def){return LOCS.filter(l=>l!==ex).map(l=>`<option${l===def?' selected':''}>${l}</option>`).join('')}

// Traduce el nombre del producto a su ID en la base de datos.
function pidPorNombre(nombre){
  const p = products.find(x => String(x.nombre).toUpperCase().trim() === String(nombre).toUpperCase().trim());
  return p ? p.id : null;
}

// Lee todo el estado actual desde Supabase (productos + stock + movimientos + ordenes)
async function syncData() {
  setSyncStatus('loading', 'Sincronizando...');
  const btn = document.getElementById('btn-sync');
  if (btn) btn.disabled = true;

  try {
    // 1) Productos
    const { data: prods, error: e1 } = await sb
      .from('productos').select('*').order('nombre');
    if (e1) throw e1;

    // 2) Stock (todas las filas producto+ubicacion)
    const { data: stk, error: e2 } = await sb
      .from('stock').select('*');
    if (e2) throw e2;

    // 3) Movimientos activos (historial)
    const { data: movs, error: e3 } = await sb
      .from('movimientos').select('*')
      .eq('estado','ACTIVO').order('fecha', {ascending:false});
    if (e3) throw e3;

    // 4) Ordenes
    const { data: ords, error: e4 } = await sb
      .from('ordenes').select('*').order('creado_en', {ascending:false});
    if (e4) throw e4;

    // ── Armar products y stockByLoc con el formato que usa la app ──
    const nuevosProducts = [];
    const nuevoStockByLoc = {};

    prods.forEach(row => {
      nuevosProducts.push({
        id: row.id,
        nombre: String(row.nombre || '').trim(),
        familia: String(row.familia || 'SIN FAMILIA').trim(),
        vencido: row.vencido === true,
        minimo: parseFloat(row.minimo_alerta) || 5,
        precio: parseFloat(row.precio_unitario) || 0
      });
      nuevoStockByLoc[row.id] = {
        'Bodega Central':0,'Caseta Cerrillos':0,'Rulo':0,'Paine':0
      };
    });

    stk.forEach(s => {
      const loc = ID_UBIC[s.ubicacion_id];
      if (nuevoStockByLoc[s.producto_id] && loc) {
        nuevoStockByLoc[s.producto_id][loc] = parseFloat(s.cantidad) || 0;
      }
    });

    // ── Movimientos al formato de la app ──
    const nuevosMovimientos = movs.map((m,i) => {
      const prod = prods.find(p => p.id === m.producto_id);
      return {
        id: i+1,
        idRegistro: m.id,
        tipo: String(m.tipo || '').toLowerCase(),
        producto: prod ? prod.nombre : '',
        cantidad: parseFloat(m.cantidad) || 0,
        origen: ID_UBIC[m.origen_id] || '',
        destino: ID_UBIC[m.destino_id] || '',
        usuario: m.usuario || '',
        ordenNum: m.orden_id || '',
        obs: m.observaciones || '',
        fecha: m.fecha ? new Date(m.fecha).toLocaleDateString('es-CL') : '',
        estado: m.estado || 'ACTIVO'
      };
    });

    // ── Ordenes al formato de la app ──
    const nuevasOrdenes = ords.map(o => ({
      idOrden: o.id,
      fecha: o.creado_en ? new Date(o.creado_en).toLocaleDateString('es-CL') : '',
      campo: ID_UBIC[o.campo_id] || '',
      dosificador: o.dosificador || '',
      productos: o.productos_txt || '',
      estado: o.estado || 'EN CURSO',
      usuarioCrea: o.usuario_crea || '',
      usuarioCierra: o.usuario_cierra || '',
      fechaCierre: o.cerrado_en ? new Date(o.cerrado_en).toLocaleDateString('es-CL') : '',
      obs: o.observaciones || '',
      detalle: o.detalle || null
    }));

    products = nuevosProducts;
    stockByLoc = nuevoStockByLoc;
    movimientos = nuevosMovimientos;
    ordenes = nuevasOrdenes;

    sheetsConnected = true;
    setSyncStatus('on', 'Conectado · ' + products.length + ' productos');
    guardarCacheLocal();
    refresh();

  } catch(e) {
    console.error(e);
    if (products.length) {
      setSyncStatus('off', 'Sin conexion · usando datos ' + edadCacheTexto());
      showToast('No se pudo sincronizar. Mostrando datos guardados.', 'info');
    } else {
      setSyncStatus('off', 'Error de conexion');
      showToast((e.message || 'No se pudo conectar con la base de datos.'), 'err');
    }
  }

  if (btn) btn.disabled = false;
}

// Registra un movimiento usando la funcion transaccional de la base de datos.
// Recibe el MISMO objeto "body" que antes mandaba la app a Sheets, y lo traduce.
async function postSheets(body) {
  try {
    const accion = body.action;

    if (accion === 'entrada') {
      const pid = pidPorNombre(body.producto);
      if (!pid) throw new Error('Producto no encontrado: ' + body.producto);
      const { error } = await sb.rpc('registrar_movimiento', {
        p_tipo:'entrada', p_producto_id:pid, p_cantidad:Number(body.cantidad)||0,
        p_origen_id:null, p_destino_id:UBIC_ID[body.destino], p_usuario:body.usuario||'',
        p_orden_id:null, p_obs:body.obs||''
      });
      if (error) throw error;

    } else if (accion === 'transferencia') {
      const pid = pidPorNombre(body.producto);
      if (!pid) throw new Error('Producto no encontrado: ' + body.producto);
      const { error } = await sb.rpc('registrar_movimiento', {
        p_tipo:'transferencia', p_producto_id:pid, p_cantidad:Number(body.cantidad)||0,
        p_origen_id:UBIC_ID[body.origen], p_destino_id:UBIC_ID[body.destino],
        p_usuario:body.usuario||'', p_orden_id:null, p_obs:body.instrucciones||''
      });
      if (error) throw error;

    } else if (accion === 'devolucion') {
      const pid = pidPorNombre(body.producto);
      if (!pid) throw new Error('Producto no encontrado: ' + body.producto);
      const { error } = await sb.rpc('registrar_movimiento', {
        p_tipo:'devolucion', p_producto_id:pid, p_cantidad:Number(body.cantidad)||0,
        p_origen_id:UBIC_ID[body.origen], p_destino_id:UBIC_ID['Bodega Central'],
        p_usuario:body.usuario||'', p_orden_id:null, p_obs:body.motivo||''
      });
      if (error) throw error;

    } else if (accion === 'aplicacion') {
      // body.lineas = [{producto, cantidad}]
      const lineas = body.lineas || [];
      for (const l of lineas) {
        const pid = pidPorNombre(l.producto);
        if (!pid) throw new Error('Producto no encontrado: ' + l.producto);
        const { error } = await sb.rpc('registrar_movimiento', {
          p_tipo:'aplicacion', p_producto_id:pid, p_cantidad:Number(l.cantidad)||0,
          p_origen_id:UBIC_ID[body.campo], p_destino_id:null,
          p_usuario:body.usuario||'', p_orden_id:body.ordenNum||null, p_obs:body.obs||''
        });
        if (error) throw error;
      }

    } else if (accion === 'crearOrden') {
      const { error } = await sb.from('ordenes').insert({
        campo_id: UBIC_ID[body.campo] || null,
        dosificador: body.dosificador || '',
        productos_txt: Array.isArray(body.productos) ? body.productos.join(', ') : (body.productos||''),
        estado: 'EN CURSO',
        usuario_crea: body.usuario || '',
        observaciones: body.obs || '',
        detalle: body.detalle || null
      });
      if (error) throw error;

    } else if (accion === 'cerrarOrden') {
      // Registrar cada linea como aplicacion
      const lineas = body.lineas || [];
      for (const l of lineas) {
        const pid = pidPorNombre(l.producto);
        if (!pid) continue;
        const { error } = await sb.rpc('registrar_movimiento', {
          p_tipo:'aplicacion', p_producto_id:pid, p_cantidad:Number(l.cantidad)||0,
          p_origen_id:UBIC_ID[body.campo], p_destino_id:null,
          p_usuario:body.usuario||'', p_orden_id:body.idOrden||null, p_obs:body.obs||''
        });
        if (error) throw error;
      }
      // Marcar la orden como terminada
      const { error: e2 } = await sb.from('ordenes').update({
        estado:'TERMINADA', usuario_cierra:body.usuario||'',
        cerrado_en:new Date().toISOString(), observaciones:body.obs||''
      }).eq('id', body.idOrden);
      if (e2) throw e2;

    } else if (accion === 'anular') {
      // body.idRegistro = id del movimiento. Revertir su efecto y marcar anulado.
      await anularMovimientoSupabase(body.idRegistro);

    } else if (accion === 'editar') {
      // Editar = anular el viejo y crear uno nuevo con la cantidad corregida.
      await editarMovimientoSupabase(body.idRegistro, body.datos);
    }

    await syncData();
    return true;

  } catch(e) {
    console.error('Error guardando:', e);
    showToast('Error guardando: ' + (e.message || 'desconocido'), 'err');
    return false;
  }
}

// Anula un movimiento usando la funcion de la base de datos (revierte stock, atomico)
async function anularMovimientoSupabase(movId){
  const { error } = await sb.rpc('anular_movimiento', { p_mov_id: Number(movId) });
  if (error) throw error;
}

// Editar = anular el viejo y crear uno nuevo con la cantidad corregida
async function editarMovimientoSupabase(movId, datos){
  const { data: m, error } = await sb.from('movimientos').select('*').eq('id', movId).single();
  if (error) throw error;
  if (!m) throw new Error('Movimiento no encontrado');

  const nuevaCant = Number(datos.CANTIDAD || datos.CANTIDAD_APLICADA || m.cantidad);

  // Primero revertir/anular el original
  await anularMovimientoSupabase(movId);

  // Crear el nuevo con la cantidad corregida, mismo tipo y ubicaciones
  await sb.rpc('registrar_movimiento', {
    p_tipo: m.tipo, p_producto_id: m.producto_id, p_cantidad: nuevaCant,
    p_origen_id: m.origen_id, p_destino_id: m.destino_id,
    p_usuario:'SISTEMA-EDITA', p_orden_id: m.orden_id, p_obs:(m.observaciones||'')+' (editado)'
  });
}

// ── LOGIN ──
function inicialesDe(u){
  const partes = (u.full||u.name||'').split(/[\s·]+/).filter(Boolean);
  if(partes.length>=2) return (partes[0][0]+partes[1][0]).toUpperCase();
  return (u.name||'?').slice(0,2).toUpperCase();
}

function initLogin() {
  document.getElementById('user-list').innerHTML = USERS.map(u=>`
    <button class="user-btn" onclick="selectUser('${u.id}')" id="ub-${u.id}">
      <div class="av ${u.av}">${inicialesDe(u)}</div>
      <div><div class="user-name">${u.full}</div><div class="user-desc">${u.desc}</div></div>
      <span class="user-arrow">›</span>
    </button>`).join('');
  buildNumpad();
}

function selectUser(id) {
  selUser = USERS.find(u=>u.id===id);
  pinBuffer = '';
  updatePinDots();
  // Paso 2: mostrar pantalla de PIN
  document.getElementById('paso-usuarios').style.display = 'none';
  document.getElementById('paso-pin').style.display = 'block';
  document.getElementById('pin-avatar').textContent = inicialesDe(selUser);
  document.getElementById('pin-avatar').className = 'pin-avatar';
  document.getElementById('pin-username').textContent = selUser.full;
  document.getElementById('pin-userrole').textContent = selUser.desc;
  document.getElementById('pin-error').textContent = '';
}

function volverUsuarios(){
  selUser = null; pinBuffer=''; updatePinDots();
  document.getElementById('paso-pin').style.display = 'none';
  document.getElementById('paso-usuarios').style.display = 'block';
}

function buildNumpad() {
  const keys = ['1','2','3','4','5','6','7','8','9','empty','0','X'];
  document.getElementById('numpad').innerHTML = keys.map(k=>{
    if(k==='empty') return `<div class="pin-key empty"></div>`;
    return `<button class="pin-key${k==='X'?' del':''}" onclick="pinKey('${k}')">${k==='X'?'&#9003;':k}</button>`;
  }).join('');
}

function pinKey(k) {
  if(k==='X'){ pinBuffer=pinBuffer.slice(0,-1); }
  else if(pinBuffer.length<4){ pinBuffer+=k; }
  updatePinDots();
  if(pinBuffer.length===4) setTimeout(attemptLogin,150);
}

function updatePinDots() {
  for(let i=0;i<4;i++) document.getElementById('d'+i)?.classList.toggle('filled',i<pinBuffer.length);
}

function attemptLogin() {
  if(!selUser) return;
  if(pinBuffer===selUser.pin) {
    curUser = selUser;
    document.getElementById('sl').classList.remove('active');
    document.getElementById('sa').classList.add('active');
    document.getElementById('topbar-user').textContent = curUser.full;
    document.getElementById('role-chip').textContent = curUser.desc;

    // 1. Cargar cache local al instante (sin esperar a Sheets)
    const hayCache = cargarCacheLocal();
    buildApp();
    document.getElementById('btn-sync').disabled = false;

    if (hayCache) {
      sheetsConnected = true;
      setSyncStatus('on', 'Datos locales (' + edadCacheTexto() + ') · actualizando...');
    } else {
      setSyncStatus('loading', 'Cargando por primera vez...');
    }

    // 2. Sincronizar en segundo plano, sin bloquear la pantalla
    syncData();

    // 3. Activar tiempo real: cuando alguien cambie stock o movimientos,
    //    esta pantalla se actualiza sola.
    activarTiempoReal();
  } else {
    document.getElementById('pin-error').textContent = 'PIN incorrecto. Intenta de nuevo.';
    pinBuffer = '';
    updatePinDots();
    setTimeout(()=>{ document.getElementById('pin-error').textContent=''; },2000);
  }
}

function doLogout() {
  curUser=null; selUser=null; pinBuffer='';
  document.getElementById('sa').classList.remove('active');
  document.getElementById('sl').classList.add('active');
  document.getElementById('paso-pin').style.display='none';
  document.getElementById('paso-usuarios').style.display='block';
  updatePinDots();
  Object.values(chartInst).forEach(c=>{try{c.destroy()}catch(e){}});
  chartInst={};
  setSyncStatus('off','Sin conectar');
  sheetsConnected=false;
}

function getTabs(role) {
  const all = [
    {k:'stock',    icon:'📦',label:'Stock',    roles:['maestro','bodeguero','gerencia'], render:renderStock,       prim:true},
    {k:'recibir',  icon:'📥',label:'Recibir',  roles:['maestro','bodeguero'],            render:renderRecibir,     prim:false},
    {k:'transfer', icon:'↔️',label:'Mover',    roles:['maestro','bodeguero'],            render:renderTransferir,  prim:false},
    {k:'devol',    icon:'↩️',label:'Devolver', roles:['maestro','bodeguero','dosificador'],render:renderDevolucion,prim:false},
    {k:'orden',    icon:'💧',label:'Aplicar',  roles:['maestro','dosificador','gerencia'], render:renderOrden,       prim:true},
    {k:'historial',icon:'📋',label:'Historial',roles:['maestro','bodeguero','gerencia'], render:renderHistorial,   prim:true},
    {k:'gerencia', icon:'📊',label:'Gerencia', roles:['maestro','gerencia'],             render:renderGerencia,    prim:true},
    {k:'admin',    icon:'⚙️',label:'Admin',    roles:['maestro'],                        render:renderAdmin,       prim:false},
  ];
  return all.filter(t=>t.roles.includes(role));
}

function buildApp() {
  const tabs = getTabs(curUser.role);
  curTab = 0;
  // Paneles para TODAS las tabs (principales y secundarias)
  document.getElementById('panels-container').innerHTML = tabs.map((t,i)=>`<div class="panel${i===0?' active':''}" id="p-${i}"></div>`).join('');

  // Indices de principales y secundarias
  const prim = tabs.map((t,i)=>({t,i})).filter(x=>x.t.prim);
  const sec  = tabs.map((t,i)=>({t,i})).filter(x=>!x.t.prim);

  let nav = prim.map(({t,i})=>`
    <button class="nav-item${i===0?' active':''}" onclick="switchTab(${i})" aria-label="${t.label}">
      <span class="nav-icon">${t.icon}</span>
      <span class="nav-label">${t.label}</span>
    </button>`).join('');

  // Boton "Mas" solo si hay secundarias
  if(sec.length){
    nav += `
    <button class="nav-item" onclick="toggleMenuMas(event)" aria-label="Más">
      <span class="nav-icon">⋯</span>
      <span class="nav-label">Más</span>
    </button>`;
  }
  document.getElementById('bottom-nav').innerHTML = nav;

  // Menu desplegable de secundarias
  const menuMas = document.getElementById('menu-mas');
  if(sec.length){
    menuMas.innerHTML = `<div class="menu-mas-label">Más opciones</div>` + sec.map(({t,i})=>`
      <button class="menu-mas-item" onclick="switchTab(${i});cerrarMenuMas()">
        <span style="font-size:18px">${t.icon}</span><span>${t.label}</span>
      </button>`).join('');
  } else {
    menuMas.innerHTML = '';
  }

  renderPanel(0);
}

function toggleMenuMas(e){
  if(e) e.stopPropagation();
  const m = document.getElementById('menu-mas');
  m.style.display = m.style.display==='block' ? 'none' : 'block';
}
function cerrarMenuMas(){
  const m = document.getElementById('menu-mas');
  if(m) m.style.display='none';
}
document.addEventListener('click', (e)=>{
  const m = document.getElementById('menu-mas');
  if(m && m.style.display==='block' && !m.contains(e.target) && !e.target.closest('[onclick*="toggleMenuMas"]')){
    m.style.display='none';
  }
});

function switchTab(i) {
  curTab=i;
  const tabs=getTabs(curUser.role);
  // Marcar activo solo si es principal; si es secundaria, ninguno de la barra se marca
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const prim = tabs.map((t,idx)=>({t,idx})).filter(x=>x.t.prim);
  const posEnBarra = prim.findIndex(x=>x.idx===i);
  if(posEnBarra>=0){
    const botones=document.querySelectorAll('#bottom-nav .nav-item');
    if(botones[posEnBarra]) botones[posEnBarra].classList.add('active');
  }
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));
  document.getElementById('app-scroll').scrollTop=0;
  renderPanel(i);
}

function renderPanel(i) {
  const tabs=getTabs(curUser.role);
  if(!tabs[i]) return;
  const el=document.getElementById('p-'+i);
  if(el){
    el.innerHTML=tabs[i].render();
    if(tabs[i].k==='gerencia') setTimeout(buildCharts,150);

function lineaTransferHTML(i){

async function doTransferir(){
  const origen = document.getElementById('t-or').value;
  const dest = document.getElementById('t-dst').value;

  if(origen === dest) {
    return showToast('Origen y destino deben ser distintos', 'err');
  }

  const lineas = [];

  document.querySelectorAll('[id^="tr-prod-"]').forEach(sel => {
    const idx = sel.id.replace('tr-prod-', '');
    const pid = parseInt(sel.value);
    const cant = parseFloat(document.getElementById('tr-cant-' + idx)?.value || 0);

    if(pid && cant > 0){
      const p = products.find(x => x.id === pid);
      if(p){
        lineas.push({
          pid: pid,
          producto: p.nombre,
          cantidad: cant
        });
      }
    }
  });

  if(!lineas.length) {
    return showToast('Agrega al menos un producto con cantidad', 'err');
  }

  for(const l of lineas){
    const disp = stockAt(l.pid, origen);

    if(l.cantidad > disp){
      return showToast(
        'Insuficiente en ' + origen + ' para ' + l.producto +
        '. Disponible: ' + fmt(disp) +
        ', ingresado: ' + fmt(l.cantidad),
        'err'
      );
    }
  }

  showToast('Guardando transferencias...', 'info');

  for(const l of lineas){
    addStock(l.pid, origen, -l.cantidad);
    addStock(l.pid, dest, l.cantidad);

    movimientos.push({
      id: nextMov++,
      tipo: 'transferencia',
      producto: l.producto,
      cantidad: l.cantidad,
      origen: origen,
      destino: dest,
      fecha: hoy(),
      usuario: curUser.id
    });

    await postSheets({
      action: 'transferencia',
      fecha: hoy(),
      producto: l.producto,
      cantidad: l.cantidad,
      origen: origen,
      destino: dest,
      usuario: curUser.id,
      instrucciones: ''
    });
  }

  showToast('Transferencia guardada correctamente');
  await syncData();
}

let ordProds = [];   // productos de la orden actual
let ordProdSeq = 0;

function onFundoChange(){
  const fundo = document.getElementById('ord-fundo').value;
  const cont = document.getElementById('ord-cuarteles');

       <span style="line-height:1.1"><strong>${q.c}</strong><br><span style="color:var(--tx3);font-size:9px">${q.ha}</span></span>
     </label>`
  ).join('');

}

function hectareasOrden(){
  let suma = 0;
  document.querySelectorAll('.cuartel-chk:checked').forEach(ch => suma += parseFloat(ch.value)||0);
  const pctRaw = document.getElementById('ord-pct').value;
  const pct = pctRaw === '' ? 100 : (parseFloat(pctRaw)||0);
  return suma * pct / 100;
}

function recalcOrden(){
  const has = hectareasOrden();
  const hasEl = document.getElementById('ord-has');
  if(hasEl) hasEl.textContent = has.toFixed(2);

  // Variedad y direccion del PRIMER cuartel seleccionado
  const fundo = document.getElementById('ord-fundo')?.value;
  const primero = document.querySelector('.cuartel-chk:checked');
  const vEl = document.getElementById('ord-variedad');
  const dEl = document.getElementById('ord-direccion');
  if(primero && fundo && CUARTELES[fundo]){
    const cdata = CUARTELES[fundo].find(q=>q.c===primero.dataset.c);
    if(cdata){
      if(vEl) vEl.textContent = cdata.var || '—';
      if(dEl) dEl.textContent = cdata.dir || '—';
    }
  } else {
    if(vEl) vEl.textContent='—';
    if(dEl) dEl.textContent='—';
  }

  const mojamiento = parseFloat(document.getElementById('ord-mojamiento')?.value) || 0;
  const ltsMaq = parseFloat(document.getElementById('ord-ltsmaq')?.value) || 0;
  const nMaq = ltsMaq > 0 ? (has * mojamiento) / ltsMaq : 0;

  ordProds.forEach(id => {
    const dosis100 = parseFloat(document.getElementById('opa-dosis-'+id)?.value) || 0;
    const dosisMaq = (ltsMaq * dosis100) / 100;
    const totProd = nMaq * dosisMaq;
    const dosisHa = has > 0 ? totProd / has : 0;
    const set = (s,v) => { const e=document.getElementById(s); if(e) e.textContent = v; };
    set('opa-dmaq-'+id, dosis100? dosisMaq.toFixed(3):'—');
    set('opa-nmaq-'+id, (mojamiento&&ltsMaq)? nMaq.toFixed(2):'—');
    set('opa-tot-'+id, (dosis100&&mojamiento&&ltsMaq)? totProd.toFixed(3):'—');
    set('opa-dha-'+id, (dosis100&&mojamiento&&ltsMaq&&has)? dosisHa.toFixed(3):'—');
  });

  buildBodegaTabla();
}

// Datos crudos de cuarteles seleccionados {c, ha}
function cuartelesSeleccionados(){
  const arr=[];
  document.querySelectorAll('.cuartel-chk:checked').forEach(ch=>arr.push({c:ch.dataset.c, ha:parseFloat(ch.value)||0}));
  return arr;
}

// dosis/ha de un producto (recalcula igual que la tabla de arriba)
function dosisHaProd(id){
  const has = hectareasOrden();
  const mojamiento = parseFloat(document.getElementById('ord-mojamiento')?.value) || 0;
  const ltsMaq = parseFloat(document.getElementById('ord-ltsmaq')?.value) || 0;
  const dosis100 = parseFloat(document.getElementById('opa-dosis-'+id)?.value) || 0;
  if(!has||!mojamiento||!ltsMaq||!dosis100) return 0;
  const nMaq=(has*mojamiento)/ltsMaq;
  const dosisMaq=(ltsMaq*dosis100)/100;
  const totProd=nMaq*dosisMaq;
  return totProd/has;
}

// Construye la tabla "Para Bodega" en vivo
function buildBodegaTabla(){
  const tabla = document.getElementById('ord-bodega');
  if(!tabla) return;
  const cuarts = cuartelesSeleccionados();
  const pctRaw = document.getElementById('ord-pct')?.value;
  const pct = pctRaw==='' ? 100 : (parseFloat(pctRaw)||0);

  // Productos con nombre elegido
  const prods = ordProds.map(id=>{
    const sel=document.getElementById('opa-prod-'+id);
    const p = sel&&sel.value ? products.find(x=>x.id===parseInt(sel.value)) : null;
    return p ? {id, nombre:p.nombre, dha:dosisHaProd(id)} : null;
  }).filter(Boolean);

  if(!cuarts.length || !prods.length){
    tabla.innerHTML='<tbody><tr><td style="padding:14px;color:var(--tx3);font-size:12px;text-align:center">Completa productos y cuarteles arriba para ver el resumen</td></tr></tbody>';
    return;
  }

  // Encabezado: Producto | Real Aplic. | un col por cuartel | Total
  let head = '<thead><tr><th style="min-width:110px">Productos</th><th>Real<br>Aplic.</th>';
  cuarts.forEach(q=>head+=`<th>${q.c}<br><span style="font-weight:400;font-size:9px">${q.ha}ha</span></th>`);
  head += '<th>Total</th></tr></thead>';

  let body='<tbody>';
  prods.forEach(p=>{
    body+=`<tr><td style="text-align:left;font-size:11px">${p.nombre}</td>`;
    body+=`<td><input type="number" placeholder="0" style="min-width:50px" disabled title="Lo llena el aplicador"></td>`;
    let total=0;
    cuarts.forEach(q=>{
      const val = q.ha * p.dha * pct/100;
      total += val;
      body+=`<td class="calc-cell">${val?val.toFixed(2):'0'}</td>`;
    });
    body+=`<td class="calc-cell" style="background:var(--vino-glow)">${total.toFixed(2)}</td></tr>`;
  });
  body+='</tbody>';
  tabla.innerHTML = head+body;
}

      });
      prodsData.push(p.nombre + (dosis?` (${dosis}/100lts`:'') + (obj?` · ${obj})`:dosis?')':''));
      detalleProds.push({
        nombre:p.nombre, dosis100:dosis, objetivo:obj, carencia:car,
        dosisHa:+dha.toFixed(3), totalTeorico:+totalTeorico.toFixed(3), porCuartel
      });
    }
  });

  const primerCuartel = cuarts.length ? cuarts[0].c : null;
  let variedadOrden='', direccionOrden='';
  if(primerCuartel && CUARTELES[fundo]){
    const cd = CUARTELES[fundo].find(q=>q.c===primerCuartel);
    if(cd){ variedadOrden=cd.var||''; direccionOrden=cd.dir||''; }
  }

  const detalle = {
    fundo, fecha, numeroOrden, tipo: tipoOrden,
    cuarteles: cuarts, hectareas:+has.toFixed(2),
    pct:pctV, mojamiento:parseFloat(mojamiento)||0, ltsMaq:parseFloat(ltsMaq)||0,
    especie:'Uva de Mesa', variedad:variedadOrden, direccion:direccionOrden,
    equipo: document.getElementById('ord-equipo').value || '',
    metodo: document.getElementById('ord-metodo').value || '',
    productos: detalleProds, observaciones: obs
  };

  // ── NÚMERO DE ORDEN ÚNICO POR TIPO (bloqueo duro) ──
  if(numeroOrden){
    const existe = ordenes.find(o =>
      String(o.estado||'').toUpperCase()!=='ANULADA' &&
      o.detalle && (o.detalle.tipo||'fitosanitario')===tipoOrden &&
      String(o.detalle.numeroOrden)===String(numeroOrden)
    );
    if(existe){
      const sugerido = siguienteCorrelativo(tipoOrden);
      alert(`⚠️ La orden N°${numeroOrden} de tipo ${tipoOrden} ya existe.\n\nEl siguiente número libre es: ${sugerido}`);
      document.getElementById('ord-num').value = sugerido;
      return;
    }
  }

  // ── ADVERTENCIAS (permiten seguir si insiste) ──
  const faltan = [];
  if(!numeroOrden) faltan.push('N° de orden');
  if(!fundo) faltan.push('Fundo');
  if(!fecha) faltan.push('Fecha');
  if(!cuartelesSel.length) faltan.push('Cuarteles');
  if(!mojamiento) faltan.push('Mojamiento');
  if(!ltsMaq) faltan.push('Lts/kg por máquina');
  if(!prodsData.length) faltan.push('Al menos un producto');

  if(faltan.length){
    const seguir = confirm('⚠️ Faltan datos por completar:\n\n• ' + faltan.join('\n• ') + '\n\n¿Continuar de todas formas?');
    if(!seguir) return;
  }

  // ── VALIDACION DE STOCK contra Bodega Central ──
  const faltaStock = [];
  detalleProds.forEach(dp => {
    const p = products.find(x=>x.nombre===dp.nombre);
    if(!p) return;
    const enBodega = stockAt(p.id, 'Bodega Central');
    if(dp.totalTeorico > enBodega){
      faltaStock.push({ nombre:dp.nombre, necesita:dp.totalTeorico, hay:enBodega, falta:dp.totalTeorico-enBodega });
    }
  });

  // Si falta stock: avisar, ofrecer correo de compra, y NO crear todavía.
  if(faltaStock.length){
    const crearCompra = confirm('⚠️ Falta stock en Bodega Central para:\n\n• ' +
      faltaStock.map(f=>`${f.nombre} (necesita ${f.necesita.toFixed(2)}, hay ${fmt(f.hay)})`).join('\n• ') +
      '\n\n¿Generar una solicitud de compra (correo)?');
    if(crearCompra){
      abrirFormularioCompra(faltaStock);
    }

    // Decisión final aparte: crear o volver a editar
    const crearIgual = confirm('La orden AÚN NO se ha creado.\n\nPuedes cambiar productos o cantidades si quieres.\n\n¿Crear la orden ahora de todas formas?');
    if(!crearIgual){
      showToast('Orden no creada. Puedes editar y volver a intentar.', 'info');
      return;  // vuelve al formulario con todo como estaba
    }
  }

  await postSheets({
    action: 'crearOrden',
    fecha: fecha || hoy(),
    numeroOrden: numeroOrden,
    campo: FUNDO_UBIC[fundo] || fundo,
    dosificador: (fundo||'').toLowerCase(),
    productos: prodsData,
    detalle: detalle,
    usuario: curUser ? curUser.id : '',
    obs: `Fundo: ${fundo} · Cuarteles: ${cuartelesSel.join(', ')} · ${has.toFixed(2)} ha · Mojamiento: ${mojamiento} · Lts/maq: ${ltsMaq}${obs?' · '+obs:''}`
  });

  showToast('Orden creada correctamente');
  ordProds = [];
  await syncData();

  // Ofrecer generar el PDF de inmediato
  const ult = ordenes.find(o => o.detalle && String(o.detalle.numeroOrden)===String(numeroOrden));
  if(ult){
    if(confirm('Orden creada. ¿Generar el PDF para imprimir?')){
      generarPDFOrden(ult.idOrden);
    }
  }
}

  const ta = document.getElementById('compra-texto');

  }catch(e){
    document.execCommand('copy');

// ── EXPORTAR RESPALDO COMPLETO (Stock + Movimientos + Órdenes) ──
function exportarRespaldo(){
  if(typeof XLSX === 'undefined'){ showToast('La librería de Excel no cargó. Recarga la página.','err'); return; }
  try{
    showToast('Generando respaldo...');
    const wb = XLSX.utils.book_new();

    // Hoja STOCK
    const stockRows = [['ID','NOMBRE','FAMILIA','BODEGA_CENTRAL','CASETA_CERRILLOS','RULO','PAINE','TOTAL','MINIMO','PRECIO']];
    products.forEach(p=>{
      stockRows.push([p.id, p.nombre, p.familia,
        stockAt(p.id,'Bodega Central'), stockAt(p.id,'Caseta Cerrillos'),
        stockAt(p.id,'Rulo'), stockAt(p.id,'Paine'),
        totalStock(p.id), p.minimo||0, p.precio||0]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(stockRows), 'STOCK');

    // Hoja MOVIMIENTOS
    const movRows = [['FECHA','TIPO','PRODUCTO','CANTIDAD','ORIGEN','DESTINO','ESTADO','USUARIO','ORDEN','OBS']];
    (movimientos||[]).forEach(m=>{
      movRows.push([m.fecha||'', m.tipo||'', m.producto||'', m.cantidad||0,
        m.origen||'', m.destino||'', m.estado||'', m.usuario||'', m.orden_id||'', m.obs||'']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(movRows), 'MOVIMIENTOS');

    // Hoja ORDENES
    const ordRows = [['N°','FECHA','CAMPO','CUARTELES','PRODUCTOS','ESTADO','HECTAREAS']];
    (ordenes||[]).forEach(o=>{
      const d=o.detalle||{};
      ordRows.push([d.numeroOrden||o.idOrden, d.fecha||'', d.fundo||o.campo||'',
        (d.cuarteles||[]).map(c=>c.c).join(', '),
        (d.productos||[]).map(p=>p.nombre).join(', '),
        o.estado||'', d.hectareas||0]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ordRows), 'ORDENES');

    const hoy = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, 'Respaldo_SanJose_'+hoy+'.xlsx');
    showToast('✓ Respaldo descargado');
  }catch(e){
    console.error(e);
    showToast('Error al generar respaldo: '+(e.message||''),'err');
  }
}

  ['Equipo','Tractorista','Tractor','Pistonero','Implemento'].forEach((c,i)=>doc.text(c,10+((W-20)/5)*i+1,y+3.4)); y+=5;
  doc.setTextColor(...TX); doc.setFont('helvetica','normal'); doc.setFontSize(7);

    doc.text(String(e.tractorista||'—').substring(0,18),10+ew+1,y+3.4);
    doc.text(String(e.tractor||'—').substring(0,12),10+ew*2+1,y+3.4);
    doc.text(String(e.pistonero||'—').substring(0,18),10+ew*3+1,y+3.4);
    doc.text(String(e.implemento||'—').substring(0,12),10+ew*4+1,y+3.4);
    doc.setDrawColor(220,220,220); doc.rect(10,y,W-20,5); y+=5;
  });
  y+=6;

  // ── CARENCIAS (en blanco) ──
  seccion('Fechas de carencia y reingreso');
  dato('Estimada cosecha:','',L,y); dato('Reingreso (hrs):','',R,y); y+=6;
  dato('Mínima cosecha:','',L,y); dato('Reingreso embaraz.:','',R,y); y+=12;

  // ── FIRMAS ──
  const fx=[35,105,175];

  y+=4; doc.setFontSize(7); doc.setTextColor(...LBL);
  doc.text('Responsable (Asesor)',fx[0],y,{align:'center'});
  doc.text('Responsable Aplicación',fx[1],y,{align:'center'});
  doc.text('Dosificador',fx[2],y,{align:'center'});

  if(d.observaciones){ y+=8; doc.setTextColor(...TX); doc.setFontSize(7); doc.text('Observaciones: '+d.observaciones,10,y); }

  doc.save('Orden_'+(d.numeroOrden||o.idOrden)+'_'+(d.fundo||'')+'.pdf');
  showToast('PDF generado');
  }catch(e){
    console.error(e);
    showToast('Error al generar PDF: '+(e.message||'desconocido'),'err');
  }

async function anularOrden(idOrden, terminada){
  const o = ordenes.find(x=>String(x.idOrden)===String(idOrden));
  if(!o){ showToast('Orden no encontrada','err'); return; }

  let msg = `¿Anular la orden N°${o.detalle?.numeroOrden||o.idOrden}?`;
  if(terminada) msg += `\n\nEsta orden ya descontó stock. Al anularla, se DEVOLVERÁ al stock de ${o.campo} lo que se había aplicado.`;
  if(!confirm(msg)) return;

  try{
    // Si está terminada, revertir los movimientos de aplicación de esta orden
    if(terminada){
      const { data: movs, error } = await sb.from('movimientos')
        .select('*').eq('orden_id', o.idOrden).eq('estado','ACTIVO');
      if(error) throw error;
      for(const m of (movs||[])){
        await sb.rpc('anular_movimiento', { p_mov_id: m.id });
      }
    }
    // Marcar la orden como anulada
    const { error: e2 } = await sb.from('ordenes').update({ estado:'ANULADA' }).eq('id', o.idOrden);
    if(e2) throw e2;

    showToast('Orden anulada' + (terminada?' y stock revertido':''));
    await syncData();
  }catch(e){
    console.error(e);
    showToast('Error al anular: '+(e.message||'desconocido'),'err');
  }
}

async function completarOrdenReal(idOrden){
  const o = ordenes.find(x => String(x.idOrden) === String(idOrden));
  if(!o){ showToast('No se encontró la orden', 'err'); return; }

  // Recolectar Real Aplicado de productos de la orden
  const lineas = [];
  document.querySelectorAll(`[id^="ra-${idOrden}-"]`).forEach(inp => {
    const cant = parseFloat(inp.value)||0;
    lineas.push({ producto: inp.dataset.prod, cantidad: cant });
  });

  // Recolectar productos adicionales que agregó el dosificador
  document.querySelectorAll(`[id^="exa-prod-${idOrden}-"]`).forEach(sel => {
    const n = sel.value;
    const idx = sel.id.split('-').pop();
    const cantEl = document.getElementById(`exa-cant-${idOrden}-${idx}`);
    const cant = parseFloat(cantEl?.value)||0;
    if(n && cant>0){
      const p = products.find(x=>String(x.id)===String(n));
      if(p) lineas.push({ producto: p.nombre, cantidad: cant, extra:true });
    }
  });

  // ── VALIDACIÓN: TODOS los campos obligatorios ──
  const g = (id)=>{ const e=document.getElementById(id+'-'+idOrden); return e?(e.type==='checkbox'?e.checked:e.value):''; };
  const faltantes = [];
  // Real aplicado: todos los productos de la orden deben tener cantidad > 0
  const sinCant = lineas.filter(l=>!l.extra && (!l.cantidad || l.cantidad<=0));
  if(sinCant.length) faltantes.push('Real Aplicado de todos los productos');
  if(!lineas.some(l=>l.cantidad>0)) faltantes.push('Al menos un producto con cantidad');
  if(!g('ap-fi')) faltantes.push('Fecha inicio');
  if(!g('ap-hi')) faltantes.push('Hora inicio');
  if(!g('ap-ft')) faltantes.push('Fecha término');
  if(!g('ap-ht')) faltantes.push('Hora término');
  if(!g('ap-lav')) faltantes.push('Lavado de máquina');
  if(!g('ap-exc')) faltantes.push('Eliminación de excedente');
  if(!g('ap-tra1')) faltantes.push('Tractorista (Equipo 1)');
  if(!g('ap-trc1')) faltantes.push('Tractor (Equipo 1)');
  if(!g('ap-pis1')) faltantes.push('Pistonero (Equipo 1)');
  if(!g('ap-imp1')) faltantes.push('Implemento (Equipo 1)');
  if(!g('ap-tra2')) faltantes.push('Tractorista (Equipo 2)');
  if(!g('ap-trc2')) faltantes.push('Tractor (Equipo 2)');
  if(!g('ap-pis2')) faltantes.push('Pistonero (Equipo 2)');
  if(!g('ap-imp2')) faltantes.push('Implemento (Equipo 2)');
  if(!g('ap-tie')) faltantes.push('Tiempo (clima)');
  if(!g('ap-vie')) faltantes.push('Viento');

  if(faltantes.length){
    alert('⚠️ No puedes confirmar: faltan campos por completar.\n\nDebes llenar TODO antes de enviar:\n\n• ' + faltantes.join('\n• '));
    return;
  }

  // solo cantidades > 0 para descontar
  const lineasDesc = lineas.filter(l=>l.cantidad>0);

  // Validar stock en el campo destino (de donde se descuenta)
  const campoDestino = o.campo;
  const sinStock = [];
  lineasDesc.forEach(l => {
    const p = products.find(x => x.nombre === l.producto);
    if(p){
      const disp = stockAt(p.id, campoDestino);
      if(l.cantidad > disp) sinStock.push(`${l.producto}: aplicas ${l.cantidad} pero en ${campoDestino} hay ${fmt(disp)}`);
    }
  });

  let msg = `Vas a descontar de ${campoDestino}:\n\n` + lineasDesc.map(l=>`• ${l.producto}: ${l.cantidad}`).join('\n');
  if(sinStock.length) msg += `\n\n⚠️ Stock insuficiente:\n• ` + sinStock.join('\n• ');
  msg += `\n\n¿Confirmar?`;
  if(!confirm(msg)) return;

  // Info de la aplicacion (ya validada completa)
  const infoAplicacion = {
    fechaInicio:g('ap-fi'), horaInicio:g('ap-hi'), fechaTermino:g('ap-ft'), horaTermino:g('ap-ht'),
    lavado:g('ap-lav'), excedente:g('ap-exc'),
    equipos:[
      {tractorista:g('ap-tra1'),tractor:g('ap-trc1'),pistonero:g('ap-pis1'),implemento:g('ap-imp1')},
      {tractorista:g('ap-tra2'),tractor:g('ap-trc2'),pistonero:g('ap-pis2'),implemento:g('ap-imp2')}
    ],
    clima:{tiempo:g('ap-tie'),viento:g('ap-vie'),trajeCompleto:g('ap-tra')},
    realAplicado: lineasDesc
  };

  // Guardar la info en el detalle de la orden
  const detalleActualizado = Object.assign({}, o.detalle||{}, { infoAplicacion });
  await sb.from('ordenes').update({ detalle: detalleActualizado }).eq('id', o.idOrden);

  // Registrar cada aplicacion (descuenta del campo destino)
  await postSheets({
    action: 'cerrarOrden',
    idOrden: o.idOrden,
    campo: campoDestino,
    lineas: lineasDesc,
    usuario: curUser ? curUser.id : '',
    obs: `Orden ${o.detalle?.numeroOrden||o.idOrden} aplicada`
  });

  showToast('Aplicación registrada y stock descontado');
  await syncData();
}

          const costoCuartel = realTotal * proporcion * precio;
          porCampo[campo] = porCampo[campo]||{};
          porCampo[campo][pc.c] = (porCampo[campo][pc.c]||0) + costoCuartel;
        });
      });
    });

    if(!Object.keys(porCampo).length) return '';

    let html = '<div class="section-label">💰 Costo por cuartel (acumulado)</div>';
    Object.keys(porCampo).sort().forEach(campo=>{
      const cuarts = Object.entries(porCampo[campo]).sort((a,b)=>b[1]-a[1]);
      const totalCampo = cuarts.reduce((s,c)=>s+c[1],0);
      const maxC = cuarts.length?cuarts[0][1]:1;
      html += `<div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:13px;font-weight:700;color:var(--vino)">📍 ${campo}</span>
          <span style="font-size:13px;font-weight:700">${plata(totalCampo)}</span>
        </div>
        ${cuarts.map(([c,costo])=>`
          <div style="padding:5px 0">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${c}</span><span style="color:var(--tx2);font-weight:600">${plata(costo)}</span></div>
            <div style="height:5px;background:var(--surf3);border-radius:3px"><div style="height:100%;width:${Math.max(3,Math.round(costo/maxC*100))}%;background:var(--vino);border-radius:3px"></div></div>
          </div>`).join('')}
      </div>`;
    });
    return html;
  })()}

  ${(()=>{
    const pend = ordenes.filter(o=>String(o.estado||'').toUpperCase()==='EN CURSO');
    if(!pend.length) return '';
    return `<div class="section-label" style="color:var(--amber)">⏳ Órdenes pendientes por aplicar (${pend.length})</div>
    <div class="card" style="border-left:3px solid var(--amber)">
      ${pend.sort((a,b)=>(b.idOrden||0)-(a.idOrden||0)).map(o=>{
        const d=o.detalle;
        const num=d&&d.numeroOrden?d.numeroOrden:o.idOrden;
        const campo=d&&d.fundo?d.fundo:o.campo;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)">
          <div><span style="font-weight:600;font-size:13px">Orden N°${num}</span> <span style="color:var(--tx3);font-size:12px">· 📍 ${campo}</span></div>
          <span class="badge b-low">En curso</span>
        </div>`;
      }).join('')}
    </div>`;
  })()}

  <div class="section-label">Órdenes por campo</div>
  ${(()=>{
    if(!ordenes.length) return '<div class="card"><div class="empty-state"><div class="empty-text">Sin órdenes registradas</div></div></div>';
    // Agrupar ordenes por campo
    const porCampo={};
    ordenes.forEach(o=>{
      const campo = (o.detalle&&o.detalle.fundo) ? o.detalle.fundo : (o.campo||'Sin campo');
      (porCampo[campo]=porCampo[campo]||[]).push(o);
    });
    return Object.keys(porCampo).sort().map(campo=>{
      const lista = porCampo[campo].sort((a,b)=>(b.idOrden||0)-(a.idOrden||0));
      return `<div class="card" style="margin-bottom:10px">
        <div style="font-size:13px;font-weight:700;color:var(--vino);margin-bottom:8px">📍 ${campo} <span style="color:var(--tx3);font-weight:400">(${lista.length})</span></div>
        ${lista.map(o=>{
          const d=o.detalle;
          const num = d&&d.numeroOrden ? d.numeroOrden : o.idOrden;
          const fecha = (d&&d.fecha) ? d.fecha : o.fecha;
          const cuarts = (d&&d.cuarteles) ? d.cuarteles.map(c=>c.c).join(', ') : '—';
          const prods = (d&&d.productos) ? d.productos.map(p=>p.nombre).join(', ') : (o.productos||'—');
          const term = String(o.estado||'').toUpperCase()==='TERMINADA';
          const anulada = String(o.estado||'').toUpperCase()==='ANULADA';
          const badge = anulada ? `<span class="badge b-out">Anulada</span>` : term ? `<span class="badge b-ok">Terminada</span>` : `<span class="badge b-low">En curso</span>`;
          const esMaestro = curUser && curUser.role==='maestro';
          let botones = '';
          if(esMaestro && !anulada){
            botones = `<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">`;
            botones += `<button onclick="generarPDFOrden('${o.idOrden}')" style="font-size:11px;padding:5px 12px;border:1px solid var(--vino);border-radius:6px;background:var(--vino);color:#fff">📄 PDF</button>`;
            if(!term) botones += `<button onclick="editarOrden('${o.idOrden}')" style="font-size:11px;padding:5px 12px;border:1px solid var(--bd2);border-radius:6px;background:var(--surf);color:var(--tx2)">✏️ Editar</button>`;
            botones += `<button onclick="anularOrden('${o.idOrden}',${term})" style="font-size:11px;padding:5px 12px;border:1px solid var(--red);border-radius:6px;background:var(--surf);color:var(--red)">✕ Anular${term?' (revierte stock)':''}</button>`;
            botones += `</div>`;
          }
          return `<div style="border-top:1px solid var(--bd);padding:8px 0${anulada?';opacity:.55':''}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
              <span style="font-size:13px;font-weight:600">Orden N°${num}</span>
              <span style="display:flex;gap:6px;align-items:center"><span style="font-size:11px;color:var(--tx3)">${fecha}</span>${badge}</span>
            </div>
            <div style="font-size:11px;color:var(--tx2)"><strong>Cuarteles:</strong> ${cuarts}</div>
            <div style="font-size:11px;color:var(--tx2)"><strong>Productos:</strong> ${prods}</div>
            ${botones}
          </div>`;
        }).join('')}
      </div>`;
    }).join('');
  })()}

  ${alertas.length||agotados.length?`<div class="section-label" style="color:var(--red)">Alertas de stock</div>${agotados.slice(0,3).map(p=>`<div class="alert-item crit">🔴 <strong>${p.nombre}</strong> — Agotado</div>`).join('')}${alertas.slice(0,4).map(p=>`<div class="alert-item warn">🟡 <strong>${p.nombre}</strong> — Stock: ${fmt(totalStock(p.id))} (min: ${p.minimo})</div>`).join('')}`:''}

  <div class="section-label">Últimos movimientos</div>
  <div class="card">${[...movimientos].reverse().slice(0,8).map(m=>{const dots={entrada:'var(--green)',transferencia:'var(--blue)',aplicacion:'var(--amber)',devolucion:'var(--purple)'};return`<div class="move-item"><div class="move-dot" style="background:${dots[m.tipo]||'#999'}"></div><div class="move-body"><div class="move-prod">${m.producto}</div><div class="move-detail">${m.tipo}${m.campo?' · '+m.campo:''}${m.ordenNum?' · Orden #'+m.ordenNum:''}</div></div><div class="move-right"><div class="move-qty">${fmt(m.cantidad)}</div><div class="move-date">${m.fecha}</div></div></div>`;}).join('')||`<div class="empty-state"><div class="empty-text">Sin movimientos aun</div></div>`}</div>`;
}
function buildCharts(){
  const COLORS=['#7B2D2D','#C4933F','#3d5a80','#2d6b3a','#8a5e00','#9d6b4f','#a0522d','#5f7a8a'];
  function dc(id){if(chartInst[id]){try{chartInst[id].destroy()}catch(e){}delete chartInst[id]}}

  // Valor por familia (barra horizontal)
  const cFam=document.getElementById('cFam');
  if(cFam){dc('cFam');
    const famMap={};products.forEach(p=>{const v=valorProducto(p.id);if(v>0){famMap[p.familia]=(famMap[p.familia]||0)+v}});
    const ent=Object.entries(famMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
    chartInst['cFam']=new Chart(cFam,{type:'bar',data:{labels:ent.map(e=>e[0]),datasets:[{data:ent.map(e=>Math.round(e[1])),backgroundColor:'#7B2D2D',borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'$'+c.parsed.x.toLocaleString('es-CL')}}},scales:{x:{beginAtZero:true,ticks:{font:{size:10},callback:v=>'$'+(v/1000000).toFixed(1)+'M'}},y:{ticks:{font:{size:10}}}}}})}

  const cLoc=document.getElementById('cLoc');
  if(cLoc){dc('cLoc');const d=LOCS.map(l=>products.reduce((s,p)=>s+stockAt(p.id,l),0));chartInst['cLoc']=new Chart(cLoc,{type:'doughnut',data:{labels:LOCS,datasets:[{data:d,backgroundColor:COLORS,borderWidth:3,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}}})}

  const cCampo=null;
}

// ══ ADMIN ══

  return`
  <div class="section-header"><div class="section-title">Administracion</div><div class="section-sub">Usuarios y configuracion</div></div>
  <div class="card" style="margin-bottom:1rem">${USERS.map(u=>`<div class="move-item"><div class="av ${u.av}" style="width:36px;height:36px;font-size:13px;flex-shrink:0">${u.name[0]}</div><div class="move-body"><div class="move-prod">${u.full}</div><div class="move-detail">${u.desc} · PIN: ${u.pin}</div></div><span class="badge b-info">${u.role}</span></div>`).join('')}</div>
  <div class="form-box">
    <div class="form-title"><div class="form-title-icon">🔗</div>Base de datos conectada</div>
    <div style="background:var(--green-bg);border:1px solid #78b878;border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--green);margin-bottom:12px">
      ✅ Base de datos Supabase activa.<br><span style="font-size:11px;word-break:break-all;opacity:.8">cmfvnluppvqyqwpfjrbs.supabase.co</span>
    </div>
    <button class="btn-primary" onclick="syncData()" style="margin-top:0">🔄 Sincronizar ahora</button>
    <button class="btn-sec" onclick="forzarRecalculo()" style="width:100%;margin-top:10px">🧮 Forzar recalculo completo (lento, usar solo si editaste el Excel a mano)</button>
  </div>
  <div class="form-box">
    <div class="form-title"><div class="form-title-icon">👤</div>Agregar usuario</div>
    <div class="form-group"><label class="form-label">Nombre completo</label><input type="text" class="form-control" id="nu-n" placeholder="Nombre" autocomplete="off"/></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Rol</label><select class="form-control" id="nu-r"><option value="bodeguero">Bodeguero</option><option value="dosificador">Dosificador</option><option value="gerencia">Gerencia</option></select></div>
      <div class="form-group"><label class="form-label">PIN (4 digitos)</label><input type="text" class="form-control" id="nu-p" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="0000"/></div>
    </div>
    <div class="form-group"><label class="form-label">Zona / Campo</label><input type="text" class="form-control" id="nu-z" placeholder="Campo 3" autocomplete="off"/></div>
    <button class="btn-primary" onclick="addUser()" style="margin-top:.5rem">+ Agregar usuario</button>
  </div>`;
}
function addUser(){
  const n=document.getElementById('nu-n').value.trim();
  const r=document.getElementById('nu-r').value;
  const z=document.getElementById('nu-z').value.trim();
  const p=document.getElementById('nu-p').value.trim();
  if(!n||p.length<4) return showToast('Completa nombre y PIN de 4 digitos','err');
  const av={bodeguero:'av-b',dosificador:'av-d',gerencia:'av-g'}[r];
  USERS.push({id:'u'+Date.now(),name:n[0].toUpperCase(),full:n,role:r,pin:p,av,desc:z||r});
  showToast('Usuario '+n+' creado');
  refresh();
}

// ══ TOAST ══
function showToast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=type; el.style.display='block';
  setTimeout(()=>el.style.display='none',3000);
}
function hojaPorTipo(tipo){
  tipo = String(tipo || '').toLowerCase();

  if(tipo === 'entrada') return 'ENTRADAS';
  if(tipo === 'transferencia') return 'SALIDAS';
  if(tipo === 'aplicacion') return 'APLICACIONES';
  if(tipo === 'devolucion') return 'DEVOLUCIONES';

  return '';
}

async function editarMovimiento(idRegistro, tipo){
  if(!idRegistro){
    showToast('Este registro no tiene ID. No se puede editar.', 'err');
    return;
  }

  const m = movimientos.find(x => String(x.idRegistro) === String(idRegistro));

  if(!m){
    showToast('No encontre el movimiento.', 'err');
    return;
  }

  const nuevaCantidad = prompt('Nueva cantidad:', m.cantidad);
  if(nuevaCantidad === null) return;

  const cant = parseFloat(nuevaCantidad);
  if(!cant || cant <= 0){
    showToast('Cantidad no valida.', 'err');
    return;
  }

  const hoja = hojaPorTipo(tipo);

  let datos = {};

  if(tipo === 'entrada') datos = { CANTIDAD: cant };
  if(tipo === 'transferencia') datos = { CANTIDAD: cant };
  if(tipo === 'aplicacion') datos = { CANTIDAD_APLICADA: cant };
  if(tipo === 'devolucion') datos = { CANTIDAD: cant };

  showToast('Guardando edicion...', 'info');

  await postSheets({
    action: 'editar',
    hoja: hoja,
    idRegistro: idRegistro,
    datos: datos,
    usuario: curUser ? curUser.id : ''
  });

  showToast('Registro editado correctamente');
}

async function anularMovimiento(idRegistro, tipo){
  if(!idRegistro){
    showToast('Este registro no tiene ID. No se puede anular.', 'err');
    return;
  }

  if(!confirm('¿Seguro que quieres anular este movimiento?')) return;

  const hoja = hojaPorTipo(tipo);

  showToast('Anulando...', 'info');

  await postSheets({
    action: 'anular',
    hoja: hoja,
    idRegistro: idRegistro,
    usuario: curUser ? curUser.id : ''
  });

  showToast('Movimiento anulado');
}
// ══ TIEMPO REAL ══
let canalRealtime = null;
let resyncTimer = null;
function activarTiempoReal(){
  if (canalRealtime) return; // ya activo
  canalRealtime = sb.channel('cambios-inventario')
    .on('postgres_changes', { event:'*', schema:'public', table:'stock' }, programarResync)
    .on('postgres_changes', { event:'*', schema:'public', table:'movimientos' }, programarResync)
    .on('postgres_changes', { event:'*', schema:'public', table:'ordenes' }, programarResync)
    .subscribe();
}
// Agrupa varios cambios seguidos en una sola resincronizacion (medio segundo)
function programarResync(){
  clearTimeout(resyncTimer);
  resyncTimer = setTimeout(() => { syncData(); }, 500);
}

// ══ INIT ══
initLogin();
</script>
