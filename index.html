// ══ ORDEN DE APLICACION (formulario rico) ══
let ordProds = [];   // productos de la orden actual
let ordProdSeq = 0;

function onFundoChange(){
  const fundo = document.getElementById('ord-fundo').value;
  const cont = document.getElementById('ord-cuarteles');
  if(!fundo || !CUARTELES[fundo]){
    cont.innerHTML = '<div style="grid-column:1/-1;color:var(--tx3);font-size:13px;text-align:center;padding:10px">Elige un fundo primero</div>';
    recalcOrden();
    return;
  }
  cont.innerHTML = CUARTELES[fundo].map(q =>
    `<label style="display:flex;align-items:center;gap:4px;font-size:11px;background:var(--surf);border:1px solid var(--bd2);border-radius:5px;padding:4px 5px;cursor:pointer">
       <input type="checkbox" class="cuartel-chk" value="${q.ha}" data-c="${q.c}" onchange="recalcOrden()" style="margin:0;flex-shrink:0">
       <span style="line-height:1.1"><strong>${q.c}</strong><br><span style="color:var(--tx3);font-size:9px">${q.ha}</span></span>
     </label>`
  ).join('');
  recalcOrden();
}

function hectareasOrden(){
  let suma = 0;
  document.querySelectorAll('.cuartel-chk:checked').forEach(ch => suma += parseFloat(ch.value)||0);
  const pctRaw = document.getElementById('ord-pct').value;
  const pct = pctRaw === '' ? 100 : (parseFloat(pctRaw)||0);
  return suma * pct / 100;
}

function addProdOrden(){
  if(ordProds.length >= 4){ showToast('Máximo 4 productos', 'info'); return; }
  const id = ordProdSeq++;
  ordProds.push(id);
  const cont = document.getElementById('ord-prods');
  const tr = document.createElement('tr');
  tr.id = 'opa-' + id;
  tr.innerHTML = `
    <td><select id="opa-prod-${id}" onchange="onProdOrdenChange(${id})"><option value="">— Producto —</option>${prodOpts()}</select></td>
    <td id="opa-ia-${id}" style="font-size:9px;color:var(--tx2);line-height:1.1">—</td>
    <td><input type="number" id="opa-dosis-${id}" placeholder="0.090" step="0.001" oninput="recalcOrden()"></td>
    <td class="calc-cell" id="opa-dmaq-${id}">—</td>
    <td class="calc-cell" id="opa-nmaq-${id}">—</td>
    <td class="calc-cell" id="opa-tot-${id}">—</td>
    <td class="calc-cell" id="opa-dha-${id}">—</td>
    <td><input type="text" id="opa-obj-${id}" placeholder="chanchito"></td>
    <td><input type="number" id="opa-car-${id}" placeholder="31"></td>
    <td id="opa-tox-${id}" style="font-weight:700"></td>
    <td><button class="del-btn" onclick="removeProdOrden(${id})">✕</button></td>
  `;
  cont.appendChild(tr);
  recalcOrden();
}

function onProdOrdenChange(id){
  const sel = document.getElementById('opa-prod-'+id);
  const nombre = sel.options[sel.selectedIndex]?.text || '';
  // Ingrediente activo: primero del producto (base de datos), luego del diccionario legado
  const prodObj = products.find(p=>p.nombre===nombre);
  const iaEl = document.getElementById('opa-ia-'+id);
  if(iaEl){
    const ia = (prodObj && prodObj.ingActivo) ? prodObj.ingActivo : (typeof INGREDIENTE_ACTIVO!=='undefined' ? INGREDIENTE_ACTIVO[nombre] : '') || '';
    iaEl.textContent = ia || '—';
  }
  // Aviso tóxico
  const toxEl = document.getElementById('opa-tox-'+id);
  if(toxEl){
    if(PRODUCTO_TOXICO[nombre]){ toxEl.textContent='SÍ'; toxEl.style.color='#c0392b'; }
    else { toxEl.textContent=''; }
  }
  recalcOrden();
}

function removeProdOrden(id){
  const el = document.getElementById('opa-' + id);
  if(el) el.remove();
  ordProds = ordProds.filter(x => x !== id);
  recalcOrden();
}

function onEquipoChange(){
  const eq = document.getElementById('ord-equipo').value;
  const metodos = {
    'TURBO':'NEBULIZADORA',
    'PISTON CON OPERARIO':'PISTÓN',
    'ELECTROESTATICA':'ELECTROESTÁTICA',
    'AZUFRADORA':'ESPOLVOREO',
    'HERBY':'MICROGATA',
    'MANUAL':'HISOPO'
  };
  document.getElementById('ord-metodo').value = metodos[eq] || '';
}

function recalcOrden(){
  const has = hectareasOrden();
  const hasEl = document.getElementById('ord-has');
  if(hasEl) hasEl.textContent = has.toFixed(2);

  // Variedad y direccion del PRIMER cuartel seleccionado
  const fundo = document.getElementById('ord-fundo')?.value;
  const primero = document.querySelector('.cuartel-chk:checked');
  const vEl = document.getElementById('ord-variedad');
  const dEl = document.getElementById('ord-direccion');
  if(primero && fundo && CUARTELES[fundo]){
    const cdata = CUARTELES[fundo].find(q=>q.c===primero.dataset.c);
    if(cdata){
      if(vEl) vEl.textContent = cdata.var || '—';
      if(dEl) dEl.textContent = cdata.dir || '—';
    }
  } else {
    if(vEl) vEl.textContent='—';
    if(dEl) dEl.textContent='—';
  }

  const mojamiento = parseFloat(document.getElementById('ord-mojamiento')?.value) || 0;
  const ltsMaq = parseFloat(document.getElementById('ord-ltsmaq')?.value) || 0;
  const nMaq = ltsMaq > 0 ? (has * mojamiento) / ltsMaq : 0;

  // Total litros a aplicar = N° maquinadas × lts/máquina
  const totLitrosEl = document.getElementById('ord-totlitros');
  if(totLitrosEl){
    const totLitros = nMaq * ltsMaq;
    totLitrosEl.textContent = (has&&mojamiento&&ltsMaq) ? totLitros.toFixed(2) : '—';
  }

  ordProds.forEach(id => {
    const dosis100 = parseFloat(document.getElementById('opa-dosis-'+id)?.value) || 0;
    const dosisMaq = (ltsMaq * dosis100) / 100;
    const totProd = nMaq * dosisMaq;
    const dosisHa = has > 0 ? totProd / has : 0;
    const set = (s,v) => { const e=document.getElementById(s); if(e) e.textContent = v; };
    set('opa-dmaq-'+id, dosis100? dosisMaq.toFixed(3):'—');
    set('opa-nmaq-'+id, (mojamiento&&ltsMaq)? nMaq.toFixed(2):'—');
    set('opa-tot-'+id, (dosis100&&mojamiento&&ltsMaq)? totProd.toFixed(3):'—');
    set('opa-dha-'+id, (dosis100&&mojamiento&&ltsMaq&&has)? dosisHa.toFixed(3):'—');
  });

  buildBodegaTabla();
}

// Datos crudos de cuarteles seleccionados {c, ha}
function cuartelesSeleccionados(){
  const arr=[];
  document.querySelectorAll('.cuartel-chk:checked').forEach(ch=>arr.push({c:ch.dataset.c, ha:parseFloat(ch.value)||0}));
  return arr;
}

// dosis/ha de un producto (recalcula igual que la tabla de arriba)
function dosisHaProd(id){
  const has = hectareasOrden();
  const mojamiento = parseFloat(document.getElementById('ord-mojamiento')?.value) || 0;
  const ltsMaq = parseFloat(document.getElementById('ord-ltsmaq')?.value) || 0;
  const dosis100 = parseFloat(document.getElementById('opa-dosis-'+id)?.value) || 0;
  if(!has||!mojamiento||!ltsMaq||!dosis100) return 0;
  const nMaq=(has*mojamiento)/ltsMaq;
  const dosisMaq=(ltsMaq*dosis100)/100;
  const totProd=nMaq*dosisMaq;
  return totProd/has;
}

// Construye la tabla "Para Bodega" en vivo
function buildBodegaTabla(){
  const tabla = document.getElementById('ord-bodega');
  if(!tabla) return;
  const cuarts = cuartelesSeleccionados();
  const pctRaw = document.getElementById('ord-pct')?.value;
  const pct = pctRaw==='' ? 100 : (parseFloat(pctRaw)||0);

  // Productos con nombre elegido
  const prods = ordProds.map(id=>{
    const sel=document.getElementById('opa-prod-'+id);
    const p = sel&&sel.value ? products.find(x=>x.id===parseInt(sel.value)) : null;
    return p ? {id, nombre:p.nombre, dha:dosisHaProd(id)} : null;
  }).filter(Boolean);

  if(!cuarts.length || !prods.length){
    tabla.innerHTML='<tbody><tr><td style="padding:14px;color:var(--tx3);font-size:12px;text-align:center">Completa productos y cuarteles arriba para ver el resumen</td></tr></tbody>';
    return;
  }

  // Encabezado: Producto | Real Aplic. | un col por cuartel | Total
  let head = '<thead><tr><th style="min-width:110px">Productos</th><th>Real<br>Aplic.</th>';
  cuarts.forEach(q=>head+=`<th>${q.c}<br><span style="font-weight:400;font-size:9px">${q.ha}ha</span></th>`);
  head += '<th>Total</th></tr></thead>';

  let body='<tbody>';
  prods.forEach(p=>{
    body+=`<tr><td style="text-align:left;font-size:11px">${p.nombre}</td>`;
    body+=`<td><input type="number" placeholder="0" style="min-width:50px" disabled title="Lo llena el aplicador"></td>`;
    let total=0;
    cuarts.forEach(q=>{
      const val = q.ha * p.dha * pct/100;
      total += val;
      body+=`<td class="calc-cell">${val?val.toFixed(2):'0'}</td>`;
    });
    body+=`<td class="calc-cell" style="background:var(--vino-glow)">${total.toFixed(2)}</td></tr>`;
  });
  body+='</tbody>';
  tabla.innerHTML = head+body;
}

async function crearOrdenNueva(){
  const tipoOrden = document.getElementById('ord-tipo')?.value || 'fitosanitario';
  const numeroOrden = document.getElementById('ord-num').value.trim();
  const fundo = document.getElementById('ord-fundo').value;
  const fecha = document.getElementById('ord-fecha').value;
  const has = hectareasOrden();
  const mojamiento = document.getElementById('ord-mojamiento').value;
  const ltsMaq = document.getElementById('ord-ltsmaq').value;
  const obs = document.getElementById('ord-obs').value.trim();

  const cuartelesSel = [];
  document.querySelectorAll('.cuartel-chk:checked').forEach(ch => cuartelesSel.push(ch.dataset.c));

  const cuarts = cuartelesSeleccionados(); // [{c, ha}]
  const pctV = (document.getElementById('ord-pct').value==='') ? 100 : (parseFloat(document.getElementById('ord-pct').value)||0);

  // Recolectar productos con su estructura completa
  const prodsData = [];      // texto para columna productos_txt
  const detalleProds = [];   // estructura completa
  ordProds.forEach(id => {
    const sel = document.getElementById('opa-prod-'+id);
    if(sel && sel.value){
      const p = products.find(x => x.id === parseInt(sel.value));
      if(!p) return;
      const dosis = parseFloat(document.getElementById('opa-dosis-'+id).value)||0;
      const obj = document.getElementById('opa-obj-'+id).value.trim();
      const car = document.getElementById('opa-car-'+id).value.trim();
      const dha = dosisHaProd(id);
      let totalTeorico = 0;
      const porCuartel = cuarts.map(q => {
        const v = q.ha * dha * pctV/100;
        totalTeorico += v;
        return { c:q.c, ha:q.ha, val:+v.toFixed(3) };
      });
      prodsData.push(p.nombre + (dosis?` (${dosis}/100lts`:'') + (obj?` · ${obj})`:dosis?')':''));
      detalleProds.push({
        nombre:p.nombre, dosis100:dosis, objetivo:obj, carencia:car,
        dosisHa:+dha.toFixed(3), totalTeorico:+totalTeorico.toFixed(3), porCuartel
      });
    }
  });

  const primerCuartel = cuarts.length ? cuarts[0].c : null;
  let variedadOrden='', direccionOrden='';
  if(primerCuartel && CUARTELES[fundo]){
    const cd = CUARTELES[fundo].find(q=>q.c===primerCuartel);
    if(cd){ variedadOrden=cd.var||''; direccionOrden=cd.dir||''; }
  }

  const detalle = {
    fundo, fecha, numeroOrden, tipo: tipoOrden,
    cuarteles: cuarts, hectareas:+has.toFixed(2),
    pct:pctV, mojamiento:parseFloat(mojamiento)||0, ltsMaq:parseFloat(ltsMaq)||0,
    totalLitros: +((+has.toFixed(2))*(parseFloat(mojamiento)||0)).toFixed(2),
    especie:'Uva de Mesa', variedad:variedadOrden, direccion:direccionOrden,
    equipo: document.getElementById('ord-equipo').value || '',
    metodo: document.getElementById('ord-metodo').value || '',
    productos: detalleProds, observaciones: obs
  };

  // ── NÚMERO DE ORDEN ÚNICO POR TIPO (bloqueo duro) ──
  if(numeroOrden){
    const existe = ordenes.find(o =>
      String(o.estado||'').toUpperCase()!=='ANULADA' &&
      o.detalle && (o.detalle.tipo||'fitosanitario')===tipoOrden &&
      String(o.detalle.numeroOrden)===String(numeroOrden)
    );
    if(existe){
      const sugerido = siguienteCorrelativo(tipoOrden);
      alert(`⚠️ La orden N°${numeroOrden} de tipo ${tipoOrden} ya existe.\n\nEl siguiente número libre es: ${sugerido}`);
      document.getElementById('ord-num').value = sugerido;
      return;
    }
  }

  // ── ADVERTENCIAS (permiten seguir si insiste) ──
  const faltan = [];
  if(!numeroOrden) faltan.push('N° de orden');
  if(!fundo) faltan.push('Fundo');
  if(!fecha) faltan.push('Fecha');
  if(!cuartelesSel.length) faltan.push('Cuarteles');
  if(!mojamiento) faltan.push('Mojamiento');
  if(!ltsMaq) faltan.push('Lts/kg por máquina');
  if(!prodsData.length) faltan.push('Al menos un producto');

  if(faltan.length){
    const seguir = confirm('⚠️ Faltan datos por completar:\n\n• ' + faltan.join('\n• ') + '\n\n¿Continuar de todas formas?');
    if(!seguir) return;
  }

  // ── VALIDACION DE STOCK contra Bodega Central ──
  const faltaStock = [];
  detalleProds.forEach(dp => {
    const p = products.find(x=>x.nombre===dp.nombre);
    if(!p) return;
    const enBodega = stockAt(p.id, 'Bodega Central');
    if(dp.totalTeorico > enBodega){
      faltaStock.push({ nombre:dp.nombre, necesita:dp.totalTeorico, hay:enBodega, falta:dp.totalTeorico-enBodega });
    }
  });

  // Si falta stock: avisar, ofrecer correo de compra, y NO crear todavía.
  if(faltaStock.length){
    const crearCompra = confirm('⚠️ Falta stock en Bodega Central para:\n\n• ' +
      faltaStock.map(f=>`${f.nombre} (necesita ${f.necesita.toFixed(2)}, hay ${fmt(f.hay)})`).join('\n• ') +
      '\n\n¿Generar una solicitud de compra (correo)?');
    if(crearCompra){
      abrirFormularioCompra(faltaStock);
    }

    // Decisión final aparte: crear o volver a editar
    const crearIgual = confirm('La orden AÚN NO se ha creado.\n\nPuedes cambiar productos o cantidades si quieres.\n\n¿Crear la orden ahora de todas formas?');
    if(!crearIgual){
      showToast('Orden no creada. Puedes editar y volver a intentar.', 'info');
      return;  // vuelve al formulario con todo como estaba
    }
  }

  if(!bloquearAccion('crearOrden')){ return; } // evita doble envío / duplicados
  const okCrear=await postSheets({
    action: 'crearOrden',
    fecha: fecha || hoy(),
    numeroOrden: numeroOrden,
    campo: FUNDO_UBIC[fundo] || fundo,
    dosificador: (fundo||'').toLowerCase(),
    productos: prodsData,
    detalle: detalle,
    usuario: curUser ? curUser.id : '',
    obs: `Fundo: ${fundo} · Cuarteles: ${cuartelesSel.join(', ')} · ${has.toFixed(2)} ha · Mojamiento: ${mojamiento} · Lts/maq: ${ltsMaq}${obs?' · '+obs:''}`
  });

  if(!okCrear){ liberarAccion('crearOrden'); showToast('No se pudo crear la orden. Revisa tu conexión y reintenta.','err'); return; }
  liberarAccion('crearOrden');
  showToast('Orden creada correctamente');
  ordProds = [];
  await syncData();

  // Ofrecer generar el PDF de inmediato
  const ult = ordenes.find(o => o.detalle && String(o.detalle.numeroOrden)===String(numeroOrden));
  if(ult){
    if(confirm('Orden creada. ¿Generar el PDF para imprimir?')){
      generarPDFOrden(ult.idOrden);
    }
  }
}

  const asunto = 'Solicitud de compra - Agrícola San José';
  const cuerpo = `Hola Janet,\n\nPor favor cotizar/comprar los siguientes productos:\n\n` +

    `\n\nSolicitado por: ${curUser?curUser.full||curUser.id:''}\nFecha: ${hoy()}\n\nGracias.`;

  // Mostrar el pedido listo con varias formas de enviarlo (funciona en cualquier dispositivo)
  const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(EMAIL_COMPRAS)}&su=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
  const mailtoUrl = `mailto:${EMAIL_COMPRAS}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;

  const html = `
    <div style="font-size:13px;color:var(--tx2);margin-bottom:10px">Pedido para <strong>${EMAIL_COMPRAS}</strong>. Elige cómo enviarlo:</div>
    <textarea id="compra-texto" readonly style="width:100%;min-height:160px;font-size:12px;padding:10px;border:1px solid var(--bd2);border-radius:8px;background:var(--surf2);color:var(--tx);margin-bottom:12px">${cuerpo}</textarea>
    <button class="btn-primary" onclick="copiarPedido()" style="margin-bottom:8px">📋 Copiar pedido</button>
    <button class="btn-sec" onclick="window.open('${gmailUrl.replace(/'/g,"\\'")}','_blank')" style="width:100%;margin-bottom:8px">✉️ Abrir en Gmail (web)</button>

    <button class="btn-sec" onclick="cerrarModalCompra()" style="width:100%">Cerrar</button>

  mostrarModal('Enviar pedido a compras', html);

function copiarPedido(){
  const ta = document.getElementById('compra-texto');
  if(!ta) return;
  ta.select();
  try{
    navigator.clipboard.writeText(ta.value);
    showToast('Pedido copiado. Pégalo en tu correo o WhatsApp');
  }catch(e){
    document.execCommand('copy');
    showToast('Pedido copiado');
  }
}

function mostrarModal(titulo, contenidoHTML){
  let m = document.getElementById('modal-compra');
  if(!m){
    m = document.createElement('div');
    m.id = 'modal-compra';
    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center;padding:0';

  m.innerHTML = `<div style="background:var(--surf);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:1.25rem;max-height:85vh;overflow-y:auto">

function cerrarModalCompra(){

}


// ── EXPORTAR RESPALDO COMPLETO (Stock + Movimientos + Órdenes) ──
function exportarRespaldo(){
  if(typeof XLSX === 'undefined'){ showToast('La librería de Excel no cargó. Recarga la página.','err'); return; }
  try{
    showToast('Generando respaldo...');
    const wb = XLSX.utils.book_new();

    // Hoja STOCK
    const stockRows = [['ID','NOMBRE','FAMILIA','BODEGA_CENTRAL','CASETA_CERRILLOS','RULO','PAINE','TOTAL','MINIMO','PRECIO']];
    products.forEach(p=>{
      stockRows.push([p.id, p.nombre, p.familia,
        stockAt(p.id,'Bodega Central'), stockAt(p.id,'Caseta Cerrillos'),
        stockAt(p.id,'Rulo'), stockAt(p.id,'Paine'),
        totalStock(p.id), p.minimo||0, p.precio||0]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(stockRows), 'STOCK');

    // Hoja ENTRADAS (recibir + devoluciones, ambas suman a bodega)
    const entRows = [['FECHA','TIPO','PRODUCTO','CANTIDAD','DESTINO','PROVEEDOR/ORIGEN','USUARIO','OBS']];
    (movimientos||[]).filter(m=>m.tipo==='entrada'||m.tipo==='devolucion').forEach(m=>{
      entRows.push([m.fecha||'', m.tipo==='devolucion'?'Devolución':'Entrada', m.producto||'', m.cantidad||0,
        m.destino||'', m.proveedor||m.origen||'', m.usuario||'', m.obs||'']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(entRows), 'ENTRADAS');

    // Hoja SALIDAS (transferencias/movimientos entre bodegas)
    const salRows = [['FECHA','TIPO','PRODUCTO','CANTIDAD','ORIGEN','DESTINO','USUARIO','OBS']];
    (movimientos||[]).filter(m=>m.tipo==='transferencia').forEach(m=>{
      salRows.push([m.fecha||'', 'Movimiento', m.producto||'', m.cantidad||0,
        m.origen||'', m.destino||'', m.usuario||'', m.obs||'']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(salRows), 'SALIDAS');

    // Hoja APLICACIONES (producto aplicado en campo)
    const aplRows = [['FECHA','PRODUCTO','CANTIDAD','CAMPO','USUARIO','ORDEN','TIPO']];
    (movimientos||[]).filter(m=>m.tipo==='aplicacion').forEach(m=>{
      // Cruzar con la orden para obtener correlativo y tipo
      const ord = ordenes.find(o=>String(o.idOrden)===String(m.ordenNum));
      const numOrden = ord?.detalle?.numeroOrden || m.ordenNum || '';
      const tipoOrden = ord?.detalle?.tipo === 'herbicida' ? 'Herbicida' : 'Fitosanitario';
      aplRows.push([m.fecha||'', m.producto||'', m.cantidad||0,
        m.origen||'', m.usuario||'', numOrden, tipoOrden]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aplRows), 'APLICACIONES');

    // Hoja PERDIDAS (mermas con valor en dinero)
    const perRows = [['FECHA','PRODUCTO','CANTIDAD','PRECIO_UNIT','TOTAL_$','UBICACION','MOTIVO','USUARIO']];
    (movimientos||[]).filter(m=>m.tipo==='perdida').forEach(m=>{
      const p = products.find(x=>x.nombre===m.producto);
      const precio = p ? (p.precio||0) : 0;
      perRows.push([m.fecha||'', m.producto||'', m.cantidad||0,
        precio, +(precio*(m.cantidad||0)).toFixed(0), m.origen||'', m.obs||'', m.usuario||'']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(perRows), 'PERDIDAS');

    // Hoja ORDENES
    const ordRows = [['N°','FECHA','CAMPO','CUARTELES','PRODUCTOS','ESTADO','HECTAREAS']];
    (ordenes||[]).forEach(o=>{
      const d=o.detalle||{};
      ordRows.push([d.numeroOrden||o.idOrden, d.fecha||'', d.fundo||o.campo||'',
        (d.cuarteles||[]).map(c=>c.c).join(', '),
        (d.productos||[]).map(p=>p.nombre).join(', '),
        o.estado||'', d.hectareas||0]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ordRows), 'ORDENES');

    const hoy = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, 'Respaldo_SanJose_'+hoy+'.xlsx');
    showToast('✓ Respaldo descargado');
  }catch(e){
    console.error(e);
    showToast('Error al generar respaldo: '+(e.message||''),'err');
  }
}

  let y = 30;

  // ── DATOS GENERALES en 2 columnas ──

  const L=10, R=112;

  kv('Variedad',d.variedad,L,y); kv('Lts o Kg / máquina',d.ltsMaq,R,y); y+=6;
  kv('Cuartel(es)',(d.cuarteles||[]).map(c=>c.c).join(', '),L,y); kv('Total litros a aplic.', (d.totalLitros!=null?d.totalLitros:((d.hectareas||0)*(d.mojamiento||0)).toFixed(2)), R, y); y+=6;
  kv('Fecha',d.fecha,L,y); kv('Equipo a usar',d.equipo,R,y); y+=6;
  kv('Método',d.metodo,R,y); y+=9;

  // ── helper de sección ──
  const seccion=(titulo)=>{
    doc.setFillColor(...GRIS); doc.rect(10,y-4,W-20,6,'F');
    doc.setFillColor(...VINO); doc.rect(10,y-4,1.5,6,'F');

  (d.productos||[]).forEach((p,idx)=>{

// ── DEVOLVER ORDEN al dosificador para corregir (revierte stock, vuelve a INICIADA) ──
async function devolverOrden(idOrden){
  const o = ordenes.find(x=>String(x.idOrden)===String(idOrden));
  if(!o){ showToast('Orden no encontrada','err'); return; }
  if(String(o.estado||'').toUpperCase()!=='TERMINADA'){ showToast('Solo se pueden devolver órdenes terminadas','info'); return; }

  const motivo = prompt('¿Por qué devuelves la orden N°'+(o.detalle?.numeroOrden||o.idOrden)+' al dosificador?\n\nEscribe el motivo (lo verá el dosificador para corregir):');
  if(motivo===null) return;
  if(!motivo.trim()){ showToast('Debes escribir un motivo','err'); return; }

  if(!confirm('Se devolverá la orden al dosificador y se REVERTIRÁ el stock aplicado en '+o.campo+'.\n\nEl dosificador la corregirá y volverá a cerrarla. ¿Continuar?')) return;

  try{
    // Revertir movimientos de aplicación de esta orden
    const { data: movs, error } = await sb.from('movimientos')
      .select('*').eq('orden_id', o.idOrden).eq('estado','ACTIVO');
    if(error) throw error;
    for(const m of (movs||[])){
      await sb.rpc('anular_movimiento', { p_mov_id: m.id });
    }
    // Registrar auditoría y volver a INICIADA
    const audit = (o.detalle?.auditoria||[]).concat([{
      accion:'Devuelta para corregir (motivo: '+motivo.trim()+')',
      usuario: curUser?curUser.id:'?',
      fecha: new Date().toLocaleString('es-CL')
    }]);
    const detDev = Object.assign({}, o.detalle||{}, {
      auditoria: audit,
      devueltaMotivo: motivo.trim(),
      devueltaPor: curUser?curUser.id:'?',
      devueltaEn: new Date().toLocaleString('es-CL')
    });
    // limpiar la info de aplicación anterior para que corrija desde cero el real
    delete detDev.infoAplicacion;
    const { error:e2 } = await sb.from('ordenes').update({ estado:'INICIADA', detalle:detDev }).eq('id', o.idOrden);
    if(e2) throw e2;
    showToast('Orden devuelta al dosificador · stock revertido');
    await syncData();
  }catch(e){
    console.error(e);
    showToast('Error al devolver: '+(e.message||''),'err');
  }
}

async function anularOrden(idOrden, terminada){
  const o = ordenes.find(x=>String(x.idOrden)===String(idOrden));
  if(!o){ showToast('Orden no encontrada','err'); return; }

  // Protección: no re-anular una orden ya anulada
  if(String(o.estado||'').toUpperCase()==='ANULADA'){
    showToast('Esta orden ya está anulada','info');
    await syncData();
    return;
  }

  let msg = `¿Anular la orden N°${o.detalle?.numeroOrden||o.idOrden}?`;
  if(terminada) msg += `\n\nEsta orden ya descontó stock. Al anularla, se DEVOLVERÁ al stock de ${o.campo} lo que se había aplicado.`;
  if(!confirm(msg)) return;

  try{
    // Si está terminada, revertir los movimientos de aplicación de esta orden
    if(terminada){
      const { data: movs, error } = await sb.from('movimientos')
        .select('*').eq('orden_id', o.idOrden).eq('estado','ACTIVO');
      if(error) throw error;
      for(const m of (movs||[])){
        await sb.rpc('anular_movimiento', { p_mov_id: m.id });
      }
    }
    // Marcar la orden como anulada + registrar auditoría
    const audit = (o.detalle?.auditoria||[]).concat([{
      accion:'Anulada'+(terminada?' (stock revertido)':''),
      usuario: curUser?curUser.id:'?',
      fecha: new Date().toLocaleString('es-CL')
    }]);
    const detAudit = Object.assign({}, o.detalle||{}, {auditoria:audit, anuladaPor:curUser?curUser.id:'?', anuladaEn:new Date().toLocaleString('es-CL')});
    const { error: e2 } = await sb.from('ordenes').update({ estado:'ANULADA', detalle:detAudit }).eq('id', o.idOrden);
    if(e2) throw e2;

    showToast('Orden anulada' + (terminada?' y stock revertido':''));
    await syncData();
  }catch(e){
    console.error(e);
    showToast('Error al anular: '+(e.message||'desconocido'),'err');
  }
}

// ── AJUSTE DE CUARTELES por el dosificador (antes de finalizar) ──
async function actualizarCuartelesOrden(o, nuevosCuarts){
  const d = o.detalle;
  const pct = d.pct||100;
  // Recalcular hectáreas y el teórico por cuartel de cada producto
  const sumHa = nuevosCuarts.reduce((s,c)=>s+(c.ha||0),0);
  const nuevosProds = (d.productos||[]).map(p=>{
    const porCuartel = nuevosCuarts.map(q=>({c:q.c, val:+(q.ha*(p.dosisHa||0)*pct/100).toFixed(2)}));
    const totalTeorico = +porCuartel.reduce((s,c)=>s+c.val,0).toFixed(2);
    return Object.assign({}, p, {porCuartel, totalTeorico});
  });
  const detalleActualizado = Object.assign({}, d, {
    cuarteles: nuevosCuarts,
    hectareas: +sumHa.toFixed(2),
    totalLitros: +(sumHa*(d.mojamiento||0)).toFixed(2),
    productos: nuevosProds
  });
  const { error } = await sb.from('ordenes').update({ detalle: detalleActualizado }).eq('id', o.idOrden);
  if(error) throw error;
  await syncData();
}

async function quitarCuartelOrden(idOrden, c){

async function completarOrdenReal(idOrden){
  const o = ordenes.find(x => String(x.idOrden) === String(idOrden));
  if(!o){ showToast('No se encontró la orden', 'err'); return; }

  // Recolectar Real Aplicado de productos de la orden
  const lineas = [];
  document.querySelectorAll(`[id^="ra-${idOrden}-"]`).forEach(inp => {
    const cant = parseFloat(inp.value)||0;
    lineas.push({ producto: inp.dataset.prod, cantidad: cant });
  });

  // Recolectar productos adicionales que agregó el dosificador
  document.querySelectorAll(`[id^="exa-prod-${idOrden}-"]`).forEach(sel => {
    const n = sel.value;
    const idx = sel.id.split('-').pop();
    const cantEl = document.getElementById(`exa-cant-${idOrden}-${idx}`);
    const cant = parseFloat(cantEl?.value)||0;
    if(n && cant>0){
      const p = products.find(x=>String(x.id)===String(n));
      if(p) lineas.push({ producto: p.nombre, cantidad: cant, extra:true });
    }
  });

  // ── VALIDACIÓN: TODOS los campos obligatorios ──
  const g = (id)=>{ const e=document.getElementById(id+'-'+idOrden); return e?(e.type==='checkbox'?e.checked:e.value):''; };
  const faltantes = [];
  // Real aplicado: todos los productos de la orden deben tener cantidad > 0
  const sinCant = lineas.filter(l=>!l.extra && (!l.cantidad || l.cantidad<=0));
  if(sinCant.length) faltantes.push('Real Aplicado de todos los productos');
  if(!lineas.some(l=>l.cantidad>0)) faltantes.push('Al menos un producto con cantidad');
  if(!g('ap-fi')) faltantes.push('Fecha inicio');
  if(!g('ap-hi')) faltantes.push('Hora inicio');
  if(!g('ap-ft')) faltantes.push('Fecha término');
  if(!g('ap-ht')) faltantes.push('Hora término');
  if(!g('ap-lav')) faltantes.push('Lavado de máquina');
  if(!g('ap-exc')) faltantes.push('Eliminación de excedente');
  if(!g('ap-tra1')) faltantes.push('Tractorista (Equipo 1)');
  if(!g('ap-trc1')) faltantes.push('Tractor (Equipo 1)');
  if(!g('ap-pis1')) faltantes.push('Pistonero (Equipo 1)');
  if(!g('ap-imp1')) faltantes.push('Implemento (Equipo 1)');
  if(!g('ap-tie')) faltantes.push('Tiempo (clima)');
  if(!g('ap-vie')) faltantes.push('Viento');

  if(faltantes.length){
    alert('⚠️ No puedes confirmar: faltan campos por completar.\n\nDebes llenar TODO antes de enviar:\n\n• ' + faltantes.join('\n• '));
    return;
  }

  // solo cantidades > 0 para descontar
  const lineasDesc = lineas.filter(l=>l.cantidad>0);

  // Validar stock en el campo destino (de donde se descuenta)
  const campoDestino = o.campo;
  const sinStock = [];
  lineasDesc.forEach(l => {
    const p = products.find(x => x.nombre === l.producto);
    if(p){
      const disp = stockAt(p.id, campoDestino);
      if(l.cantidad > disp) sinStock.push(`${l.producto}: aplicas ${l.cantidad} pero en ${campoDestino} hay ${fmt(disp)}`);
    }
  });

  // ── BLOQUEO: si no hay stock suficiente en el campo, NO se puede cerrar ──
  if(sinStock.length){
    alert(
      '🚫 NO SE PUEDE CERRAR LA ORDEN\n\n' +
      'No hay producto suficiente en ' + campoDestino + ' para descontar lo aplicado:\n\n• ' +
      sinStock.join('\n• ') +
      '\n\nQUÉ HACER:\n' +
      '1) Avisa al bodeguero o a Felipe para que TRANSFIERAN el producto que falta a ' + campoDestino + '.\n' +
      '2) Cuando llegue el stock, vuelve aquí y cierra la orden normalmente.\n\n' +
      'Tus datos quedan guardados como borrador — no se pierden.'
    );
    return;
  }

  let msg = `Vas a descontar de ${campoDestino}:\n\n` + lineasDesc.map(l=>`• ${l.producto}: ${l.cantidad}`).join('\n');
  msg += `\n\n¿Confirmar?`;
  if(!confirm(msg)) return;

  // Info de la aplicacion (ya validada completa)
  const infoAplicacion = {
    fechaInicio:g('ap-fi'), horaInicio:g('ap-hi'), fechaTermino:g('ap-ft'), horaTermino:g('ap-ht'),
    lavado:g('ap-lav'), excedente:g('ap-exc'),
    equipos:(()=>{
      const eqs=[];
      for(let n=1;n<=5;n++){
        const e={tractorista:g('ap-tra'+n),tractor:g('ap-trc'+n),pistonero:g('ap-pis'+n),implemento:g('ap-imp'+n)};
        if(e.tractorista||e.tractor||e.pistonero||e.implemento) eqs.push(e);
      }
      return eqs;
    })(),
    clima:{tiempo:g('ap-tie'),viento:g('ap-vie'),trajeCompleto:g('ap-tra')},
    realAplicado: lineasDesc
  };

  // Guardar la info en el detalle de la orden
  const detalleActualizado = Object.assign({}, o.detalle||{}, { infoAplicacion });
  await sb.from('ordenes').update({ detalle: detalleActualizado }).eq('id', o.idOrden);

  // Registrar cada aplicacion (descuenta del campo destino)
  const okCerrar=await postSheets({
    action: 'cerrarOrden',
    idOrden: o.idOrden,
    campo: campoDestino,
    lineas: lineasDesc,
    usuario: curUser ? curUser.id : '',
    obs: `Orden ${o.detalle?.numeroOrden||o.idOrden} aplicada`
  });

  if(!okCerrar){ showToast('No se pudo cerrar la orden. Revisa tu conexión y reintenta.','err'); return; }
  showToast('Aplicación registrada y stock descontado');
  limpiarBorrador(o.idOrden);
  await syncData();

  // Generar el PDF completo y preparar correo a Felipe
  if(confirm('Orden completada. ¿Generar el PDF y enviarlo por correo?')){
    generarPDFOrden(o.idOrden);
    setTimeout(()=>{
      const num = o.detalle?.numeroOrden || o.idOrden;
      const tipoTxt = o.detalle?.tipo==='herbicida' ? 'Herbicida' : 'Fitosanitario';
      const asunto = encodeURIComponent(`Orden ${tipoTxt} N°${num} completada - ${o.detalle?.fundo||o.campo}`);
      const cuerpo = encodeURIComponent(
        `Estimado,\n\nSe completó la aplicación de la orden ${tipoTxt} N°${num} en ${o.detalle?.fundo||o.campo}.\n\nSe adjunta el PDF con el detalle (recuerda adjuntar el archivo que se acaba de descargar).\n\nSaludos.`
      );
      window.location.href = `mailto:fbustamante@agricolasanjose.cl?subject=${asunto}&body=${cuerpo}`;
    }, 1500);
  }
}

async function ordenLista(idOrden){
  const o = ordenes.find(x => String(x.idOrden) === String(idOrden));
  if(!o) return showToast('No se encontró la orden', 'err');

  const lineas = [];

  document.querySelectorAll('[id^="co-prod-"]').forEach(inp => {
    const idx = inp.id.replace('co-prod-', '');
    const cant = parseFloat(document.getElementById('co-cant-' + idx)?.value || 0);
    if(inp.value && cant > 0){
      lineas.push({ producto: inp.value, cantidad: cant });
    }
  });

  document.querySelectorAll('[id^="co-prod-extra-"]').forEach(sel => {
    const idx = sel.id.replace('co-prod-extra-', '');
    const cant = parseFloat(document.getElementById('co-cant-extra-' + idx)?.value || 0);
    if(sel.value && cant > 0){
      const p = products.find(x => x.id === parseInt(sel.value));
      if(p) lineas.push({ producto: p.nombre, cantidad: cant });
    }
  });
for (const l of lineas) {
  const p = products.find(x => x.nombre === l.producto);
  if (!p) continue;

  const disponible = stockAt(p.id, o.campo);

  if (l.cantidad > disponible) {
    return showToast(
      'No hay stock suficiente en ' + o.campo +
      ' para ' + l.producto +
      '. Disponible: ' + disponible +
      ', ingresado: ' + l.cantidad,
      'err'
    );
  }
}
  if(!lineas.length) return showToast('Ingresa al menos una cantidad', 'err');

  showToast('Cerrando orden...', 'info');

  const resp = await postSheets({
    action: 'cerrarOrden',
    idOrden: idOrden,
    campo: o.campo,
    usuario: curUser ? curUser.id : '',
    obs: o.obs || '',
    lineas: lineas
  });

  if(!resp){ showToast('No se pudo terminar la orden. Revisa tu conexión y reintenta.','err'); return; }
  showToast('Orden terminada correctamente');
  await syncData();
}

function renderHistorial(){

    perdida:{color:'var(--red)',dot:'#a32d2d',label:'Pérdida'}
  };

  // Rango por defecto: últimos 5 días (hoy incluido)
  const hoyD = new Date();
  const hace5 = new Date(); hace5.setDate(hace5.getDate()-4);
  if(histDesde===null) histDesde = isoLocal(hace5);
  if(histHasta===null) histHasta = isoLocal(hoyD);

  const list = [...movimientos].filter(m=>{

    return f>=histDesde && f<=histHasta;
  });

  const btnRango = (lbl,dias)=>`<button onclick="histRangoRapido(${dias})" style="padding:6px 10px;border:1px solid var(--bd2);border-radius:7px;background:white;color:var(--tx2);font-size:12px;cursor:pointer">${lbl}</button>`;

  return `

    <div class="section-title">Historial</div>
    <div class="section-sub">${list.length} movimientos · ${histDesde.split('-').reverse().slice(0,2).join('/')} al ${histHasta.split('-').reverse().slice(0,2).join('/')}</div>

  <div class="card" style="padding:12px;margin-bottom:12px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
      <div><label style="font-size:11px;color:var(--tx3);font-weight:600;display:block;margin-bottom:3px">Desde</label>
        <input type="date" id="hist-desde" value="${histDesde}" max="${histHasta}" onchange="histAplicarFechas()" style="font-size:12px;padding:6px"></div>

            style="margin-top:6px;padding:5px 9px;border:1px solid var(--bd2);border-radius:7px;background:white;color:var(--red);font-size:12px">

// Estado y acciones del filtro de fechas del historial
let histDesde=null, histHasta=null;
// Fecha YYYY-MM-DD en hora LOCAL (evita el desfase de toISOString que cambia el día en Chile)
function isoLocal(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Fecha amigable: "2026-07-24" -> "24 jul"
function fechaCorta(f){
  if(!f) return '';
  const m=String(f).match(/(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return f;
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return parseInt(m[3])+' '+meses[parseInt(m[2])-1];
}
function histAplicarFechas(){
  const d=document.getElementById('hist-desde'), h=document.getElementById('hist-hasta');
  if(d&&d.value) histDesde=d.value;
  if(h&&h.value) histHasta=h.value;
  if(histDesde>histHasta){ const t=histDesde; histDesde=histHasta; histHasta=t; }
  render();
}
function histRangoRapido(dias){
  const hoyD=new Date(), desde=new Date(); desde.setDate(desde.getDate()-(dias-1));
  histDesde=isoLocal(desde); histHasta=isoLocal(hoyD);
  render();
}

          const anulada = String(o.estado||'').toUpperCase()==='ANULADA';
          const iniciada = String(o.estado||'').toUpperCase()==='INICIADA';
          const badge = anulada ? `<span class="badge b-out">Anulada</span>` : term ? `<span class="badge b-ok">Terminada</span>` : iniciada ? `<span class="badge b-low">▶️ Iniciada</span>` : `<span class="badge" style="background:#e8f0fb;color:#2456a0">Creada</span>`;
          const esMaestro = curUser && curUser.role==='maestro';
          let botones = '';
          if(esMaestro && !anulada){
            botones = `<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">`;
            botones += `<button onclick="generarPDFOrden('${o.idOrden}')" style="font-size:11px;padding:5px 12px;border:1px solid var(--vino);border-radius:6px;background:var(--vino);color:#fff">📄 PDF</button>`;
            if(!term) botones += `<button onclick="editarOrden('${o.idOrden}')" style="font-size:11px;padding:5px 12px;border:1px solid var(--bd2);border-radius:6px;background:var(--surf);color:var(--tx2)">✏️ Editar</button>`;
            if(term) botones += `<button onclick="devolverOrden('${o.idOrden}')" style="font-size:11px;padding:5px 12px;border:1px solid #e0a800;border-radius:6px;background:var(--surf);color:#a87514">↩️ Devolver a dosificador</button>`;
            botones += `<button onclick="anularOrden('${o.idOrden}',${term})" style="font-size:11px;padding:5px 12px;border:1px solid var(--red);border-radius:6px;background:var(--surf);color:var(--red)">✕ Anular${term?' (revierte stock)':''}</button>`;
            botones += `</div>`;
          }
          return `<div style="border-top:1px solid var(--bd);padding:8px 0${anulada?';opacity:.55':''}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
              <span style="font-size:13px;font-weight:600">Orden N°${num}</span>
              <span style="display:flex;gap:6px;align-items:center"><span style="font-size:11px;color:var(--tx3)">${fecha}</span>${badge}</span>
            </div>
            <div style="font-size:11px;color:var(--tx2)"><strong>Cuarteles:</strong> ${cuarts}</div>
            <div style="font-size:11px;color:var(--tx2)"><strong>Productos:</strong> ${prods}</div>
            ${botones}
          </div>`;
        }).join('')}
      </div>`;
    }).join('');
  })()}

  ${alertas.length||agotados.length?`<div class="section-label" style="color:var(--red)">Alertas de stock</div>${agotados.slice(0,3).map(p=>`<div class="alert-item crit">🔴 <strong>${p.nombre}</strong> — Agotado</div>`).join('')}${alertas.slice(0,4).map(p=>`<div class="alert-item warn">🟡 <strong>${p.nombre}</strong> — Stock: ${fmt(totalStock(p.id))} (min: ${p.minimo})</div>`).join('')}`:''}

  <div class="section-label">Últimos movimientos</div>
  <div class="card">${[...movimientos].slice(0,8).map(m=>{const dots={entrada:'var(--green)',transferencia:'var(--blue)',aplicacion:'var(--amber)',devolucion:'var(--purple)'};return`<div class="move-item"><div class="move-dot" style="background:${dots[m.tipo]||'#999'}"></div><div class="move-body"><div class="move-prod">${m.producto}</div><div class="move-detail">${m.tipo}${m.campo?' · '+m.campo:''}${m.ordenNum?' · Orden #'+m.ordenNum:''}</div></div><div class="move-right"><div class="move-qty">${fmt(m.cantidad)}</div><div class="move-date">${m.fecha}</div></div></div>`;}).join('')||`<div class="empty-state"><div class="empty-text">Sin movimientos aun</div></div>`}</div>`;
}
function buildCharts(){
  const COLORS=['#7B2D2D','#C4933F','#3d5a80','#2d6b3a','#8a5e00','#9d6b4f','#a0522d','#5f7a8a'];
  function dc(id){if(chartInst[id]){try{chartInst[id].destroy()}catch(e){}delete chartInst[id]}}

  // Valor por familia (barra horizontal)
  const cFam=document.getElementById('cFam');
  if(cFam){dc('cFam');
    const famMap={};products.forEach(p=>{const v=valorProducto(p.id);if(v>0){famMap[p.familia]=(famMap[p.familia]||0)+v}});
    const ent=Object.entries(famMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
    chartInst['cFam']=new Chart(cFam,{type:'bar',data:{labels:ent.map(e=>e[0]),datasets:[{data:ent.map(e=>Math.round(e[1])),backgroundColor:'#7B2D2D',borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'$'+c.parsed.x.toLocaleString('es-CL')}}},scales:{x:{beginAtZero:true,ticks:{font:{size:10},callback:v=>'$'+(v/1000000).toFixed(1)+'M'}},y:{ticks:{font:{size:10}}}}}})}

  const cLoc=document.getElementById('cLoc');
  if(cLoc){dc('cLoc');const d=LOCS.map(l=>products.reduce((s,p)=>s+stockAt(p.id,l),0));chartInst['cLoc']=new Chart(cLoc,{type:'doughnut',data:{labels:LOCS,datasets:[{data:d,backgroundColor:COLORS,borderWidth:3,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}}})}

  const cCampo=null;
}

// ══ TOAST ══
// Candado anti-doble-envío: evita que una acción se ejecute dos veces seguidas
const _enCurso = {};
function bloquearAccion(nombre){
  if(_enCurso[nombre]) return false; // ya se está ejecutando -> rechazar
  _enCurso[nombre] = true;
  return true;
}
function liberarAccion(nombre){ _enCurso[nombre] = false; }

function showToast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=type; el.style.display='block';
  setTimeout(()=>el.style.display='none',3000);
}
function hojaPorTipo(tipo){
  tipo = String(tipo || '').toLowerCase();

  if(tipo === 'entrada') return 'ENTRADAS';
  if(tipo === 'transferencia') return 'SALIDAS';
  if(tipo === 'aplicacion') return 'APLICACIONES';
  if(tipo === 'devolucion') return 'DEVOLUCIONES';

  return '';
}

async function editarMovimiento(idRegistro, tipo){
  if(!idRegistro){
    showToast('Este registro no tiene ID. No se puede editar.', 'err');
    return;
  }

  const m = movimientos.find(x => String(x.idRegistro) === String(idRegistro));

  if(!m){
    showToast('No encontre el movimiento.', 'err');
    return;
  }

  const nuevaCantidad = prompt('Nueva cantidad:', m.cantidad);
  if(nuevaCantidad === null) return;

  const cant = parseFloat(nuevaCantidad);
  if(!cant || cant <= 0){
    showToast('Cantidad no valida.', 'err');
    return;
  }

  const hoja = hojaPorTipo(tipo);

  let datos = {};

  if(tipo === 'entrada') datos = { CANTIDAD: cant };
  if(tipo === 'transferencia') datos = { CANTIDAD: cant };
  if(tipo === 'aplicacion') datos = { CANTIDAD_APLICADA: cant };
  if(tipo === 'devolucion') datos = { CANTIDAD: cant };

  showToast('Guardando edicion...', 'info');

  await postSheets({
    action: 'editar',
    hoja: hoja,
    idRegistro: idRegistro,
    datos: datos,
    usuario: curUser ? curUser.id : ''
  });

  showToast('Registro editado correctamente');
}

async function anularMovimiento(idRegistro, tipo){
  if(!idRegistro){
    showToast('Este registro no tiene ID. No se puede anular.', 'err');
    return;
  }

  if(!confirm('¿Seguro que quieres anular este movimiento?')) return;

  const hoja = hojaPorTipo(tipo);

  // ¿Es una recepción de orden de compra? Buscar el movimiento en memoria por su obs
  const movMem = movimientos.find(m=>String(m.idRegistro)===String(idRegistro));
  const esRecepcionOC = movMem && String(movMem.tipo).toLowerCase()==='entrada' && /Recepci[oó]n OC/i.test(movMem.obs||'');

  showToast('Anulando...', 'info');

  const ok = await postSheets({
    action: 'anular',
    hoja: hoja,
    idRegistro: idRegistro,
    usuario: curUser ? curUser.id : ''
  });

  // Solo confirmar si la base realmente guardó la anulación
  if(!ok){
    showToast('No se pudo anular. Revisa tu conexión y reintenta.', 'err');
    return;
  }

  // Revertir lo recibido en la orden de compra correspondiente
  if(esRecepcionOC){
    try{ await revertirRecepcionOC(movMem); }
    catch(e){ console.error('No se pudo revertir la OC:', e); showToast('Stock revertido, pero revisa la orden de compra','err'); }
  }

  showToast('Movimiento anulado');
}

// Descuenta del "recibido" de la orden de compra la cantidad de un movimiento de recepción anulado/editado
async function revertirRecepcionOC(mov, cantidadRevertir){
  // Extraer identificador de OC desde la observación: "Recepción OC N°123" o "Recepción OC 123"
  const m = String(mov.obs||'').match(/Recepci[oó]n OC\s*N?°?\s*([A-Za-z0-9\-]+)/i);
  if(!m) return;
  const ref = m[1];
  const cant = cantidadRevertir!=null ? cantidadRevertir : mov.cantidad;
  // Buscar la OC por numero_oc o por id
  const { data: ocs, error } = await sb.from('ordenes_compra').select('*');
  if(error || !ocs) return;
  const oc = ocs.find(o=>String(o.numero_oc)===String(ref) || String(o.id)===String(ref));
  if(!oc) return;
  const det = oc.detalle||[];
  const linea = det.find(x=>String(x.producto).trim()===String(mov.producto).trim());
  if(!linea) return;
  linea.recibido = Math.max(0, (+linea.recibido||0) - (+cant||0));
  // Recalcular estado
  const tp=det.reduce((s,i)=>s+(+i.pedido||0),0), tr=det.reduce((s,i)=>s+(+i.recibido||0),0);
  const estado = tr<=0?'PENDIENTE':(tr>=tp?'COMPLETA':'PARCIAL');
  await sb.from('ordenes_compra').update({detalle:det,estado}).eq('id',oc.id);
}

let canalRealtime = null;
let resyncTimer = null;
function activarTiempoReal(){
  if (canalRealtime) return; // ya activo
  canalRealtime = sb.channel('cambios-inventario')
    .on('postgres_changes', { event:'*', schema:'public', table:'stock' }, programarResync)
    .on('postgres_changes', { event:'*', schema:'public', table:'movimientos' }, programarResync)
    .on('postgres_changes', { event:'*', schema:'public', table:'ordenes' }, programarResync)
    .subscribe();
}
// Agrupa varios cambios seguidos en una sola resincronizacion (medio segundo)
function programarResync(){
  clearTimeout(resyncTimer);
  resyncTimer = setTimeout(() => { syncData(); }, 500);
}
